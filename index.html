<h1>Modul 6: Praktik Pembelajaran Terpadu di SD</h1>
<div class="warn"><b>⚠️ Penting:</b> Modul 6 <b>tidak punya latihan, rangkuman, maupun tes formatif</b>. Isinya panduan praktik dan simulasi. Menurut tinjauan mata kuliah, <b>materi UAS diambil dari Modul 1–5</b>. Modul 6 ini tetap wajib karena nilai praktik menentukan keluarnya nilai akhir.</div>
<h2>Pendahuluan: apa dan mengapa</h2>
<p>Sesuai deskripsi mata kuliah Pembelajaran Terpadu di SD (PDGK4205), mahasiswa S1 PGSD diharapkan mampu menjelaskan hakikat pembelajaran terpadu, beberapa modelnya, cara memilih dan mengembangkan topik dari berbagai mapel menjadi rancangan terpadu, serta <b>berlatih mempraktikkannya di kelas sendiri di SD dan simulasi di kelas tutorial</b>.</p>
<ul><li>Formatnya <b>berbeda</b> dari modul lain: bukan uraian konsep, tetapi <b>prosedur praktik dan simulasi</b>.</li><li>Isinya: tata cara praktik dan simulasi, <b>Format Rancangan Pembelajaran Terpadu</b>, <b>Format Refleksi Guru</b>, <b>alat penilaian kemampuan guru</b> (merancang dan melaksanakan), serta tugas mahasiswa, tutor, dan pengelola.</li><li>PDGK4205 adalah <b>mata kuliah berpraktik</b>. Tutorial tatap muka <b>pertemuan 3, 5, dan 7</b> tidak ada tugas tutorial karena <b>diganti praktik dan simulasi</b>.</li><li><b>Nilai UAS tidak akan diterima</b> mahasiswa selama nilai praktik belum diserahkan ke Pusat Pengujian UT melalui UPBJJ-UT. Mahasiswa harus aktif memastikan nilainya diolah tutor dan dikirim lewat Pengelola Kelompok Belajar.</li></ul>
<div class="ing"><b>💡 Ingat:</b> pertemuan <b>3-5-7</b> = diganti praktik/simulasi. Tanpa nilai praktik, nilai akhir <b>tidak keluar</b>. UAS dari <b>Modul 1–5</b>.</div>

<h1>Kegiatan Belajar 1: Praktik Merancang Pembelajaran Terpadu di SD</h1>
<p>Sebelum praktik, simak ulang <b>Modul 4</b> dengan teliti. Prosedurnya berlaku untuk praktik di kelas sendiri maupun simulasi di kelas tutorial.</p>
<h2>Lima langkah prosedur merancang (untuk praktik dan simulasi)</h2>
<div class="tw"><table><tr><th>No</th><th>Langkah</th><th>Isi</th></tr>
<tr><td>1</td><td><b>Menetapkan mapel yang dipadukan</b></td><td>Pilih <b>3 mapel</b> dari <b>IPA, IPS, PKn, Matematika, dan Bahasa Indonesia</b>, dengan mengkaji KD dalam silabus sekolah. Alternatif: dokumen <b>Standar Isi dan Standar Kompetensi</b> dari <b>BSNP</b> Depdiknas. Pemilihan harus dikaitkan dengan pencapaian KD serta kegiatan belajar yang <b>selaras</b> antara 3 mapel. Wajib menyusun <b>2 (dua) rancangan berbeda</b> untuk dipraktikkan dan disimulasikan.</td></tr>
<tr><td>2</td><td><b>Menetapkan KD dari 3 mapel</b></td><td>Pilih KD pada <b>jenjang kelas dan semester yang sama</b> dari 3 mapel yang bisa dipadukan.</td></tr>
<tr><td>3</td><td><b>Mengembangkan tema</b></td><td>Tema = pokok pikiran yang jadi fokus atau pusat pembicaraan. Tema tepat menciptakan suasana belajar optimal. Kembangkan <b>satu tema untuk tiap rancangan</b> (dua tema berbeda), ikuti prosedur di Modul 4.</td></tr>
<tr><td>4</td><td><b>Mengembangkan peta keterhubungan KD dan tema pemersatu</b></td><td>Peta yang menggambarkan tema sebagai pusat dengan 3 KD dari 3 mapel, seperti <b>jaring laba-laba</b> (Modul 4 poin 5). Bentuknya bebas. Contoh: <b>Peta Jaring-jaring Tematik Kelas IV</b>: IPS membaca peta lingkungan setempat (kab/kota dan provinsi) dengan skala sederhana; Bahasa Indonesia menjelaskan kembali secara lisan/tulis tentang simbol daerah/lambang korps; Matematika menentukan besar sudut dengan satuan tidak baku dan satuan derajat.</td></tr>
<tr><td>5</td><td><b>Menyusun Satuan Pembelajaran Terpadu</b></td><td>Istilahnya boleh berbeda (Rencana Pembelajaran, Rencana Pelaksanaan Pembelajaran). Mengacu pada <b>silabus sekolah</b>. Bagi yang memakai <b>KTSP</b>, untuk praktik dan simulasi mata kuliah ini <b>harus memakai format contoh di Modul 4 KB 2</b> (format di bawah).</td></tr></table></div>
<div class="ing"><b>💡 Ingat:</b> <b>3 mapel</b> dari <b>IPA-IPS-PKn-Matematika-BI</b>, <b>2 rancangan</b> berbeda, KD <b>kelas dan semester sama</b>, tema → peta jaring-jaring → satuan.</div>

<h2>Format Rencana Pembelajaran Terpadu (untuk praktik dan simulasi PDGK4205)</h2>
<div class="tw"><table><tr><th>Bagian</th><th>Isi</th></tr>
<tr><td><b>Identitas mata pelajaran</b></td><td>Mapel (1, 2, 3), tema, kelas/semester, waktu</td></tr>
<tr><td><b>I. Standar Kompetensi</b></td><td>dari 3 mapel yang dipadukan</td></tr>
<tr><td><b>II. Kompetensi Dasar</b></td><td>dari 3 mapel yang dipadukan</td></tr>
<tr><td><b>III. Indikator</b></td><td>dikembangkan atas dasar KD</td></tr>
<tr><td><b>IV. Pokok Materi</b></td><td></td></tr>
<tr><td><b>V. Media dan Sumber Belajar</b></td><td></td></tr>
<tr><td><b>VI. Metode Pembelajaran</b></td><td></td></tr>
<tr><td><b>VII. Kegiatan Pembelajaran</b></td><td>Tabel: tahap pembelajaran (<b>pendahuluan, penyajian, penutup</b>), kegiatan siswa dan guru, waktu (menit)</td></tr>
<tr><td><b>VIII. Evaluasi</b></td><td>Harus disertakan: <b>lembar kerja siswa, soal tes formatif, kunci soal/cara pengerjaan tes, dan lembar penilaian</b> evaluasi proses/hasil belajar</td></tr></table></div>
<p><b>Penilai rencana:</b> untuk praktik di SD sendiri, bantuan <b>Kepala Sekolah atau teman sejawat</b>. Untuk simulasi di kelas tutorial, dinilai <b>tutor</b>. Alat penilaiannya <b>APKG 1</b>.</p>

<h2>APKG 1: Lembar Penilaian Kemampuan Merencanakan Pembelajaran Terpadu</h2>
<p>Identitas yang diisi: nama guru/mahasiswa, NIM, tempat mengajar, kelas/semester, mapel, tema, waktu, tanggal. Pengamat membaca rencana dengan cermat, lalu menilai tiap butir <b>skala 1–5</b>.</p>
<div class="tw"><table><tr><th>Kode</th><th>Butir (7)</th><th>Subbutir</th></tr>
<tr><td><b>A</b></td><td><b>1.</b> Menentukan tema, bahan pembelajaran, dan merumuskan tujuan/indikator</td><td>1.1 Kesesuaian tema penghubung dengan KD 3 mapel; 1.2 bahan sesuai Standar Isi dan Kompetensi; 1.3 merumuskan tujuan/indikator</td></tr>
<tr><td><b>B</b></td><td><b>2.</b> Mengembangkan dan mengorganisasikan materi, media, dan sumber belajar</td><td>2.1 materi dari 3 mapel; 2.2 alat bantu/media; 2.3 sumber belajar</td></tr>
<tr><td><b>C</b></td><td><b>3.</b> Merencanakan skenario kegiatan pembelajaran terpadu</td><td>3.1 jenis kegiatan; 3.2 langkah-langkah; 3.3 alokasi waktu; 3.4 cara memotivasi siswa</td></tr>
<tr><td><b>D</b></td><td><b>4.</b> Merancang pengelolaan kelas</td><td>Cara pengorganisasian siswa agar berpartisipasi</td></tr>
<tr><td><b>E</b></td><td><b>5.</b> Merencanakan prosedur, jenis, dan menyiapkan alat penilaian</td><td>5.1 prosedur dan jenis penilaian; 5.2 alat penilaian dan kunci jawaban</td></tr>
<tr><td><b>F</b></td><td><b>6.</b> Tampilan dokumen rencana</td><td>6.1 kebersihan dan kerapian; 6.2 penggunaan bahasa tulis</td></tr>
<tr><td><b>G</b></td><td><b>7.</b> Tampilan lembar Peta Jaring-jaring Tematik</td><td>Kreativitas tampilan peta</td></tr></table></div>
<p><b>Nilai APKG 1 = R</b>, yaitu gabungan rata-rata butir A sampai G (R = A + B + C + D + E + F + G, dirata-ratakan). Pengamat: Kepala Sekolah/teman sejawat/tutor.</p>
<h3>Penjelasan skala nilai APKG 1</h3>
<div class="tw"><table><tr><th>Butir</th><th>Cara menilai</th></tr>
<tr><td>1.1 Kesesuaian tema dan KD</td><td>Skala 1: tanpa peta jaring-jaring tematik. 2: ada peta dengan tema tetapi tanpa KD. 3: peta dengan KD dari <b>2</b> mapel tetapi tidak sesuai/tidak berhubungan. 4: peta dengan KD dari 2 mapel yang bisa dihubungkan. <b>5: peta lengkap dengan KD dari 3 mapel</b> yang bisa dihubungkan</td></tr>
<tr><td>1.2 Bahan sesuai Standar Isi</td><td>1 tidak sesuai; 2 sesuai tetapi tidak dijabarkan; 3 sesuai dengan penjabaran singkat; 4 penjabaran rinci; 5 penjabaran rinci dan jelas</td></tr>
<tr><td>1.3 Indikator</td><td>Syarat: jelas (tidak bermakna ganda); lengkap bila memuat rambu <b>ABCD</b>: <b>A</b>udience (subjek belajar), <b>B</b>ehavior (tingkah laku teramati dan terukur), <b>C</b>ondition (kondisi), <b>D</b>egree (kriteria keberhasilan); berurutan logis (mudah ke sukar, sederhana ke kompleks, konkret ke abstrak, ingatan hingga menilai). Skala: 1 bukan jabaran KD; 2 jabaran KD; 3 jelas dan jabaran KD; 4 jelas, logis, jabaran KD; 5 jelas, logis, <b>lengkap</b>, jabaran KD</td></tr>
<tr><td>2.1 Materi 3 mapel</td><td>4 deskriptor: kesesuaian dengan Standar Isi dan Kompetensi; sistematika materi; kesesuaian dengan kemampuan dan kebutuhan siswa; <b>kemutakhiran</b>. Skala = banyak deskriptor tampak (0→1 sampai 4→5)</td></tr>
<tr><td>2.2 Media</td><td>Media = segala sesuatu untuk menyajikan bahan (gambar, model, peta, chart), <b>tidak termasuk papan tulis, penghapus, kapur</b>. 1 tidak direncanakan; 2 satu macam tetapi tidak sesuai indikator; 3 lebih dari satu tetapi tidak sesuai; 4 satu macam dan sesuai; <b>5 lebih dari satu macam dan sesuai</b></td></tr>
<tr><td>2.3 Sumber belajar</td><td>Sumber: buku paket, buku pelengkap, manusia sumber, museum, lingkungan, laboratorium. 4 deskriptor: sesuai tujuan/indikator, perkembangan siswa, materi, lingkungan siswa</td></tr>
<tr><td>3.1 Jenis kegiatan</td><td>Mendengarkan penjelasan, observasi, belajar kelompok, percobaan, membaca. Lebih dari satu jenis diharapkan. 8 deskriptor: sesuai indikator, bahan, perkembangan anak, waktu, sarana/lingkungan, bervariasi, memungkinkan dampak pengiring, memungkinkan keterlibatan siswa. Skala: 0 → 1; 1–2 → 2; 3–4 → 3; 5–6 → 4; 7–8 → 5</td></tr>
<tr><td>3.2 Langkah pembelajaran</td><td>1 tidak ada; 2 pembukaan, inti, penutup tetapi tidak rinci; 3 rinci tetapi tidak sesuai tujuan dan materi; 4 rinci dan sesuai tujuan <i>atau</i> materi; 5 rinci dan sesuai tujuan <b>dan</b> materi</td></tr>
<tr><td>3.3 Alokasi waktu</td><td>Pembagian waktu tiap tahap dalam satu pertemuan. 1 tidak dicantumkan; 2 keseluruhan dicantumkan; 3 tiap langkah dicantumkan; 4 waktu inti lebih besar dari jumlah pembukaan dan penutup; 5 tiap kegiatan dirinci proporsional</td></tr>
<tr><td>3.4 Cara memotivasi</td><td>4 deskriptor: bahan pengait (termasuk apersepsi) menarik; mempersiapkan media; jenis kegiatan menarik; melibatkan siswa. Mengkaji seluruh komponen rencana</td></tr>
<tr><td>4. Pengelolaan kelas</td><td>Pengorganisasian siswa = menentukan pengelompokan, memberi tugas, menata alur dan cara kerja. 4 deskriptor: (a) pengaturan individu/kelompok/klasikal, (b) penugasan, (c) alur dan cara kerja, (d) kesempatan mendiskusikan hasil tugas. Skala berurutan a, a-b, a-b-c, a-b-c-d</td></tr>
<tr><td>5.1 Prosedur dan jenis penilaian</td><td>Prosedur: <b>penilaian proses dan penilaian akhir</b>. Jenis: <b>tes lisan, tes tertulis, tes perbuatan</b>. 5 bila prosedur dan jenis keduanya sesuai indikator</td></tr>
<tr><td>5.2 Alat penilaian dan kunci</td><td>Alat: pertanyaan, tugas, lembar observasi; kunci: jawaban benar atau rambu-rambu. 1 tidak ada soal; 2 soal tiap indikator; 3 tiap soal mengukur indikator; 4 bahasa/format memenuhi syarat penyusunan butir soal; 5 disertai kunci/rambu jawaban benar</td></tr>
<tr><td>6.1 Kebersihan dan kerapian</td><td>4 deskriptor: tulisan mudah dibaca, tidak banyak coretan, bentuk tulisan ajeg, ilustrasi tepat dan menarik</td></tr>
<tr><td>6.2 Bahasa tulis</td><td>4 deskriptor: bahasa komunikatif, pilihan kata tepat, struktur kalimat baku, penulisan sesuai EYD</td></tr>
<tr><td>7. Peta jaring-jaring</td><td>4 deskriptor: KD tiap kotak sesuai Standar Isi; tema berbentuk gambar menarik dan jelas; ada penghubung KD dengan tema yang menarik dan jelas; tulisan indah dan jelas</td></tr></table></div>
<p>Pola umum skala: jumlah <b>deskriptor yang tampak</b> menentukan skor (tidak ada = 1, satu = 2, dua = 3, tiga = 4, empat/semua = 5).</p>

<h1>Kegiatan Belajar 2: Praktik Pelaksanaan Pembelajaran Terpadu di SD</h1>
<p>Setelah merancang, tahap berikutnya adalah <b>pelaksanaan</b>, juga <b>2 kali</b>: (1) praktik di kelas sendiri di sekolah, diamati <b>teman sejawat/Kepala Sekolah</b>; (2) simulasi di kelas tutorial, diamati <b>tutor</b>. Pelaksanaan sesuai rancangan dari KB 1.</p>
<h2>Rambu-rambu pelaksanaan</h2>
<ol><li>Sebaiknya <b>simulasi di kelas tutorial dulu</b>, baru praktik di kelas sendiri. Kalau tidak memungkinkan, boleh praktik dulu. Diskusikan dengan tutor.</li><li>Sebelum praktik di sekolah sendiri: <b>minta izin Kepala Sekolah</b> dan <b>beri tahu siswa</b>. Minta Kepala Sekolah atau teman sejawat jadi pengamat. Diskusikan dulu <b>APKG 2</b> beserta penjelasan skalanya dengan pengamat. Setelah penilaian baik, minta hasilnya dan serahkan ke tutor. Di akhir perkuliahan, nilai dari teman sejawat/kepala sekolah <b>digabung</b> dengan nilai simulasi menjadi nilai praktik yang dikeluarkan tutor.</li><li>Praktik di sekolah sendiri wajib mengisi <b>Lembar Refleksi Pelaksanaan Praktik Pembelajaran Terpadu</b>, berdasarkan pengamatan di kelas dan <b>wawancara sederhana</b> dengan siswa sendiri dan pengamat.</li><li><b>Simulasi di kelas tutorial</b>: waktu maksimum <b>20 menit</b> per mahasiswa. Rancangan tetap seperti situasi nyata dan mengikuti kurikulum sekolah. Tidak perlu menampilkan semua tahap utuh. Bagian yang dilewati cukup dikatakan <b>“pre memori”</b> (sudah dilakukan/dilewatkan), misalnya “sudah dikerjakan” saat teman bertindak sebagai siswa berdiskusi atau latihan. Atur waktu agar keterampilan terlihat dalam 20 menit.</li><li>Bersikap seperti guru yang sebenarnya. Anggap teman sebagai siswa SD, sebut mereka <b>“anak-anak sekalian”</b> dan diri sendiri <b>“Ibu/Bapak”</b>.</li><li>Simulasi diamati dan dinilai <b>tutor</b> memakai <b>Lembar Penilaian Simulasi Pembelajaran Terpadu</b>.</li></ol>
<div class="ing"><b>💡 Ingat:</b> simulasi <b>20 menit</b>, kata kunci <b>“pre memori”</b>, sapaan “anak-anak sekalian” dan “Ibu/Bapak”. Sebelum praktik di sekolah: <b>izin Kepala Sekolah + beri tahu siswa</b>.</div>
<h3>Lembar Refleksi Pelaksanaan Praktik Pembelajaran Terpadu</h3>
<p>Identitas: nama, NIM, tempat/alamat mengajar, jumlah siswa. Lima pertanyaan refleksi:</p>
<ol><li>Bagaimana cara saya memilih tema untuk pembelajaran terpadu?</li><li>Apa yang saya rasakan saat praktik di kelas sendiri?</li><li>Masalah/kendala apa yang saya alami?</li><li>Bagaimana reaksi/kesan siswa saya?</li><li>Apa komentar/saran teman sejawat/kepala sekolah terhadap penampilan saya?</li></ol>

<h2>APKG 2: Lembar Penilaian Kemampuan Melaksanakan Pembelajaran Terpadu</h2>
<p>Dipakai teman sejawat/kepala sekolah untuk menilai praktik di sekolah sendiri. Identitas: nama mahasiswa, NIM, alamat sekolah, kelas/semester, tema, mapel, tanggal, kelompok belajar, UPBJJ-UT. <b>Petunjuk:</b> amati cermat, pusatkan perhatian pada <b>kemampuan guru mengelola pembelajaran dan dampaknya pada siswa</b>, nilai tiap butir. Untuk butir 3 pilih <b>satu butir yang sesuai</b> dengan mapel yang diajarkan.</p>
<div class="tw"><table><tr><th>Kode</th><th>Butir</th><th>Subbutir</th></tr>
<tr><td><b>P</b></td><td><b>1. Melakukan pembelajaran</b></td><td>a. tugas rutin kelas; b. memulai pembelajaran; c. ragam kegiatan sesuai kemampuan/tujuan/indikator, siswa, situasi, lingkungan; d. kegiatan individual, kelompok, atau klasikal; e. sumber belajar; f. media belajar; g. waktu secara efisien; h. mengakhiri pembelajaran</td></tr>
<tr><td><b>Q</b></td><td><b>2. Mengelola interaksi kelas</b></td><td>a. perhatian serta sikap bersahabat, terbuka, penuh pengertian; b. memicu dan memelihara keterlibatan siswa; c. komunikasi efektif</td></tr>
<tr><td><b>R</b></td><td><b>3. Kemampuan khusus 3 mapel</b></td><td>a. Bahasa Indonesia; b. Matematika; c. IPA; d. IPS; e. PKn (pilih sesuai mapel)</td></tr>
<tr><td><b>S</b></td><td><b>4. Penilaian proses dan hasil belajar</b></td><td>a. penilaian selama proses; b. penilaian hasil belajar di akhir</td></tr>
<tr><td><b>T</b></td><td><b>5. Kesan umum</b></td><td>a. peka terhadap kemampuan berbahasa; b. penampilan guru; c. keefektifan pembelajaran terpadu</td></tr></table></div>
<p><b>Nilai APKG 2 = K</b>, rata-rata dari P, Q, R, S, T. Pengamat juga menulis <b>catatan singkat</b> kekuatan dan saran perbaikan.</p>
<h3>Kemampuan khusus per mapel (butir 3)</h3>
<div class="tw"><table><tr><th>Mapel</th><th>Tiga indikator</th></tr>
<tr><td><b>Bahasa Indonesia</b></td><td>1) menunjukkan penguasaan materi (4 aspek: <b>kebahasaan, pemahaman, penggunaan, apresiasi sastra</b>); 2) memberi latihan keterampilan berbahasa (terpadu: membaca, menyimak, berbicara, menulis); 3) mengembangkan kemampuan <b>berkomunikasi dan bernalar</b> (tanya jawab, dialog, bermain peran, bercerita, drama)</td></tr>
<tr><td><b>Matematika</b></td><td>1) menanamkan konsep melalui <b>kegiatan manipulatif</b> (benda nyata di sekitar); 2) menguasai <b>simbol</b> matematika (membaca, menggunakan, berbahasa matematika, menyelesaikan masalah dengan simbol); 3) latihan penggunaan konsep dalam kehidupan sehari-hari (memberi contoh, mendorong siswa mencari contoh, keterkaitan dengan mapel lain, menyelesaikan masalah praktis)</td></tr>
<tr><td><b>IPA</b></td><td>1) pembelajaran melalui <b>pengalaman langsung</b> (skala: 1 ceramah, 2 ceramah plus pembuktian guru, 3 pembuktian melibatkan siswa, 4 pengamatan klasikal lalu kesimpulan dengan bimbingan, 5 pengamatan kelompok kecil/perorangan lalu kesimpulan); 2) meningkatkan keterlibatan siswa (pengamatan perorangan, kelompok, diskusi kelompok kecil, diskusi kelas); 3) menampilkan penguasaan IPA (konsep, prinsip, teori, hukum; 1 semua salah … 5 semua benar dan sesuai GBPP)</td></tr>
<tr><td><b>IPS</b></td><td>1) pemahaman konsep <b>waktu</b> (1 fakta sejarah, 2 mendeskripsikan masa silam, 3 mengaitkan masa lalu dengan kini, 4 menggali nilai masa silam yang berguna kini, 5 memprediksi manfaat bagi masa depan); 2) konsep <b>ruang</b> (lokasi, jarak, wilayah, region, teritorial, ruang angkasa, migrasi; naik dari verbal ke peta/data dan diskusi); 3) konsep <b>kelangkaan (<i>scarcity</i>)</b> (terbatasnya sumber daya dan tak terbatasnya kebutuhan, spesialisasi, distribusi, konsumsi, pasar)</td></tr>
<tr><td><b>PKn</b></td><td>1) ketepatan istilah dan konsep; 2) penguasaan materi (benar, sistematis, ada generalisasi, generalisasi bersama siswa); 3) menerapkan konsep dalam kehidupan sehari-hari (memberi contoh, membimbing siswa memberi contoh, memberi balikan atas contoh siswa)</td></tr></table></div>
<h3>Penjelasan skala APKG 2 untuk butir lain</h3>
<ul><li><b>1a/1b Tugas rutin dan memulai:</b> memeriksa ketersediaan alat tulis, kehadiran, kebersihan (papan tulis, siswa, ruangan, perabot), kesiapan alat pelajaran siswa.</li><li><b>1c Ragam kegiatan:</b> sesuai kemampuan/tujuan, karakteristik materi, perkembangan dan kebutuhan siswa, situasi dan lingkungan, serta terkoordinasi baik.</li><li><b>1d Individual/kelompok/klasikal:</b> variasi minimal <b>dua</b>, sesuai kebutuhan, guru berperan sesuai jenis kegiatan, perubahan antarjenis lancar.</li><li><b>1e Sumber belajar:</b> sesuai tujuan, karakteristik materi, perkembangan dan lingkungan siswa, dan tidak bergantung pada satu sumber.</li><li><b>1f Media:</b> cetak (gambar, model, peta, chart), non-cetak (tape, video, TV, radio, OHP, komputer, LCD), atau objek sesungguhnya/tiruan. Skala: 1 tidak pakai; 2 pakai tetapi tidak tepat; 3 satu media tepat; 4 dua media <b>sejenis</b> tepat; 5 dua atau lebih media bervariasi dan tepat.</li><li><b>1g Waktu:</b> mulai tepat waktu, hindari penundaan dan penyimpangan, bagi fase proporsional, tutup tepat waktu.</li><li><b>1h Mengakhiri:</b> merangkum, meninjau ulang, penegasan hal yang meragukan, atau tindak lanjut (PR, pertanyaan). Deskriptor: ada kegiatan merangkum, isi jelas dan lengkap, membimbing siswa membuat rangkuman, memberi kesempatan bertanya, memberi tindak lanjut.</li><li><b>2a Sikap bersahabat:</b> sikap bersahabat, adil/proporsional, menghargai perbedaan pendapat, mengontrol tindakan.</li><li><b>2b Keterlibatan:</b> membantu mengingat pengalaman sebelumnya, pertanyaan terbuka, memberi kesempatan siswa bertanya/merespons, memberi balikan.</li><li><b>2c Komunikasi:</b> perangkat bahasa lisan, tulis, ekspresi, gerak tubuh; mengatasi kebingungan siswa; bicara lancar dan tulisan terbaca; suara jelas.</li><li><b>4a Penilaian proses:</b> 1 tidak menilai; 2 bertanya atau memberi tugas; 3 bertanya dan memberi tugas; 4 melalui kinerja siswa; 5 melalui isyarat siswa.</li><li><b>4b Penilaian akhir:</b> 1 tidak ada; 2 tidak sesuai tujuan; 3 sebagian kecil sesuai; 4 sebagian besar sesuai; 5 semua sesuai tujuan.</li><li><b>5a Peka berbahasa:</b> 1 membiarkan kesalahan; 2 memberi tahu tanpa memperbaiki; 3 memperbaiki langsung; 4 meminta siswa lain memperbaiki; 5 mengarahkan siswa menemukan dan memperbaiki sendiri. <b>Bila tidak ada siswa yang salah berbahasa, nilai maksimal 5.</b></li><li><b>5b Penampilan guru:</b> busana pantas dan rapi, posisi bervariasi, tegas dan cermat, menunjukkan kegairahan (pandangan, ekspresi, suara, gerak, mendekati siswa).</li><li><b>5c Keefektifan:</b> memakai rencana, menyesuaikan rencana dengan kebutuhan kelas yang tidak terantisipasi, tujuan tercapai, pembelajaran lancar, terbentuk dampak pengiring (solidaritas, saling menghargai).</li></ul>

<h2>Lembar Penilaian Simulasi Pembelajaran Terpadu (untuk tutor)</h2>
<p>Tutor memberi tanda check pada skala 1–5 dan mengisi berapa menit mahasiswa menghabiskan waktu tiap aspek, serta komentar tambahan. Identitas: nama, NIM, tiga mapel, tema, kelas/semester.</p>
<div class="tw"><table><tr><th>Bagian</th><th>Aspek</th><th>Rata-rata</th></tr>
<tr><td><b>A. Pendahuluan/kegiatan awal</b></td><td>1. Menarik perhatian/memotivasi; 2. Memberikan acuan; 3. Membuat kaitan</td><td><b>KW</b> = (N1+N2+N3)/3</td></tr>
<tr><td><b>B. Penyajian/kegiatan inti</b></td><td>1. Penjelasan konsep/data/fakta/prinsip dengan contoh/ilustrasi/demonstrasi; 2. Tanya-jawab/pemberian penguatan; 3. Pemberian tugas/latihan individual/kelompok/evaluasi proses; 4. Supervisi saat siswa diberi tugas dan balikan</td><td><b>KI</b> = (N1+N2+N3+N4)/4</td></tr>
<tr><td><b>C. Penutup/kegiatan akhir</b></td><td>1. Peninjauan kembali; 2. Evaluasi hasil belajar/pemberian tindak lanjut</td><td><b>KK</b> = (N1+N2)/2</td></tr></table></div>
<p><b>Nilai Simulasi = K = (KW + KI + KK) / 3</b>.</p>
<h3>Cara memakai lembar simulasi (penjelasan skala)</h3>
<div class="tw"><table><tr><th>Aspek</th><th>Deskriptor</th></tr>
<tr><td>A1 Menarik perhatian/memotivasi</td><td>1 tak satu komponen; 2 salah satu komponen; 3 kedua komponen; 4 menarik perhatian dengan <b>alat bantu</b> (misal mendengarkan kaset, demonstrasi boneka) dan memotivasi dengan <b>fakta atau ide yang bertentangan</b> dengan materi 3 mapel; 5 melibatkan siswa dan alat bantu, dan memotivasi dengan melibatkan siswa memaparkan fakta/ide yang bertentangan</td></tr>
<tr><td>A2 Memberikan acuan</td><td>4 aspek: (a) tujuan dan batas tugas, (b) langkah pembelajaran, (c) mengingatkan masalah pokok, (d) pertanyaan terkait pokok materi. Skor = jumlah aspek yang tampak (tidak ada = 1 … keempat = 5)</td></tr>
<tr><td>A3 Membuat kaitan</td><td>2 aspek: (a) pertanyaan apersepsi, (b) merangkum pelajaran lalu. 1 tidak ada; 2 satu aspek; 3 kedua aspek; 4 kedua aspek dan sesuai indikator/tujuan; 5 sesuai dan bermakna bagi siswa</td></tr>
<tr><td>B1 Penjelasan</td><td>4 aspek: (a) terkait materi 3 mapel dengan bahasa jelas, lancar, istilah sulit dijelaskan; (b) balikan dari mimik atau pertanyaan; (c) contoh/ilustrasi/demonstrasi dengan pola <b>induktif atau deduktif</b> yang menggambarkan keterpaduan; (d) alat bantu/media sesuai. Skor = jumlah aspek</td></tr>
<tr><td>B2 Tanya-jawab/penguatan</td><td>4 aspek: (a) waktu berpikir, (b) penyebaran pertanyaan (siswa lain menanggapi), (c) tuntunan (menyederhanakan, mengulangi pertanyaan), (d) acuan. Skor 3–5 bila disertai <b>pemberian penguatan</b> (ucapan, gerak badan, mimik)</td></tr>
<tr><td>B3 Tugas/latihan</td><td>(a) latihan/percobaan individual dengan petunjuk kerja, (b) tugas kelompok/diskusi dengan <b>LKS</b>. Naik bila sesuai indikator, bermakna, dan sesuai perkembangan siswa</td></tr>
<tr><td>B4 Supervisi dan balikan</td><td>4 aspek: (a) memeriksa dengan berkeliling, (b) arahan/menjelaskan kembali tugas, (c) mengendalikan kelas, (d) mendengar dan merespons pertanyaan siswa. Skor 4–5 disertai balikan setelah tugas selesai</td></tr>
<tr><td>C1 Peninjauan kembali</td><td>(a) membuat ringkasan, (b) merangkum. 3: melibatkan siswa (guru moderator); 4: dilakukan siswa dengan rangkuman tertulis dari guru; 5: ditambah balikan guru atas rangkuman siswa</td></tr>
<tr><td>C2 Evaluasi/tindak lanjut</td><td>(a) soal/kuis lisan atau tertulis, (b) tindak lanjut berupa tugas di rumah. 3 kedua aspek; 4 plus supervisi saat siswa mengerjakan soal; 5 plus balikan umum tentang evaluasi</td></tr></table></div>

<h2>Khusus untuk tutor: menghitung nilai akhir praktik</h2>
<ul><li>Bila <b>2 rencana</b> dan <b>2 kali praktik/simulasi</b> sudah dinilai dengan skala 5, tutor <b>menggabungkan</b> nilai teman sejawat/kepala sekolah dan nilai tutor.</li><li><b>R</b> = nilai Rencana Pembelajaran (rata-rata nilai penilai). <b>K</b> = nilai pelaksanaan praktik/simulasi (rata-rata). <b>N</b> = (R + K) / 2. <b>NAP</b> (Nilai Akhir Praktik) = <b>(N / 5) × 100</b>.</li></ul>
<div class="tw"><table><tr><th>Contoh (mahasiswa “Polan”)</th><th>Hitungan</th></tr>
<tr><td>Rencana: teman sejawat/kepsek 4,00; tutor 3,9</td><td>R = (4,00 + 3,9) / 2 = <b>3,95</b></td></tr>
<tr><td>Pelaksanaan: teman sejawat/kepsek 4,5; tutor (simulasi) 4,5</td><td>K = (4,5 + 4,5) / 2 = <b>4,5</b></td></tr>
<tr><td>Nilai rata-rata praktik</td><td>N = (3,95 + 4,5) / 2 = 4,225 dibulatkan <b>4,23</b></td></tr>
<tr><td>Nilai akhir praktik</td><td>NAP = (4,23 / 5) × 100 = <b>84,6</b></td></tr></table></div>
<ul><li>Tutor memasukkan nilai ke <b>Rekapitulasi Nilai Praktik</b> mata kuliah PDGK4205 (kolom: pokjar, kabupaten/kota, provinsi, UPBJJ-UT, masa ujian, nama, nilai R, K, N, NAP; diketahui Kepala UPBJJ-UT, Pengelola Pokjar, dan Tutor).</li><li>Rekapitulasi diserahkan ke <b>UPBJJ-UT melalui Pengelola Pokjar</b> segera setelah tutorial berakhir atau pada <b>pertemuan terakhir (pertemuan ke-8)</b>. Disertakan: rencana pembelajaran untuk praktik dan simulasi, Lembar Refleksi, dan Lembar Penilaian Simulasi dari <b>2 mahasiswa</b> (yang <b>paling baik dan kurang baik</b>).</li><li>Bila nilai praktik tidak masuk atau terlambat ke UT Pusat, nilai akhir <b>tidak dapat diumumkan</b> atau muncul di Daftar Nilai Ujian (DNU).</li></ul>
<div class="ing"><b>💡 Ingat rumus:</b> N = (R + K) / 2, NAP = N / 5 × 100. Contoh Polan: 3,95 dan 4,5 → 4,23 → <b>84,6</b>.</div>
