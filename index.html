<h2>Pengantar: kenapa perlu pembelajaran terpadu?</h2>
<p>Sebelum masuk sekolah, anak melihat dunia sebagai satu kesatuan yang utuh (<i>holistik</i>). Bayangkan anak melihat pasar: ada orang jual beli (IPS), ada sayur (IPA), ada hitung uang (Matematika), ada obrolan (Bahasa). Semua jadi satu cerita. Tapi di bangku sekolah dasar, ilmu dipecah jadi mata pelajaran yang terpisah. Akibatnya anak sering sulit memahami kejadian di lingkungan dan alam sekitar.</p>
<p>Pelajaran yang dipisah tegas membuat pengalaman belajar menjadi <b>artifisial</b> (dibuat-buat). Pengalaman belajar yang menunjukkan kaitan antarunsur konsep, di dalam maupun antarmata pelajaran, memberi peluang belajar yang efektif dan lebih bermakna (<i>meaningful learning</i>).</p>
<p>Pembelajaran terpadu diyakini berorientasi pada praktik belajar yang sesuai kebutuhan anak. Siswa diharapkan mampu <b>mengidentifikasi, mengumpulkan, menilai, dan menggunakan</b> informasi di sekitarnya secara bermakna. Pemahaman ini penting bagi guru supaya bisa mengarahkan siswa menemukan keterkaitan konsep antarmata pelajaran.</p>
<div class="ing"><b>💡 Ingat:</b> anak lahir “utuh”, sekolah yang memotong-motong. Terpadu = menyambung potongan itu lagi.</div>

<h2>A. Pengertian pembelajaran terpadu</h2>
<h3>Dua istilah yang saling terkait</h3>
<p>Ada dua istilah: <i>integrated curriculum</i> (kurikulum terpadu) dan <i>integrated learning</i> (pembelajaran terpadu). Menurut <b>Wolfinger</b> (1994:133), kurikulum terpadu adalah kurikulum yang menggabungkan sejumlah disiplin ilmu melalui pemaduan <b>isi, keterampilan, dan sikap</b>.</p>
<h3>5 alasan (rasional) pemaduan</h3>
<ol><li>Kebanyakan masalah dan pengalaman (termasuk pengalaman belajar) bersifat <b>interdisipliner</b>, sehingga memahami dan memecahkannya perlu <i>multi-skill</i>.</li><li>Ada tuntutan interaksi <b>kolaboratif</b> yang tinggi dalam memecahkan berbagai masalah.</li><li>Memudahkan anak membuat hubungan antarskemata dan <b>transfer pemahaman</b> antarkonteks.</li><li>Demi <b>efisiensi</b>.</li><li>Ada tuntutan <b>keterlibatan</b> anak yang tinggi dalam proses belajar.</li></ol>
<p>Pembelajaran terpadu banyak dipengaruhi oleh eksplorasi topik dalam kurikulum, sehingga anak dapat menghubungkan proses dan isi belajar secara lintas disiplin dalam waktu yang bersamaan.</p>
<h3>Beda kurikulum terpadu dan pembelajaran terpadu</h3>
<p>Perbedaan mendasar ada pada segi <b>perencanaan dan pelaksanaannya</b>. Idealnya, pembelajaran terpadu bertolak dari kurikulum terpadu. Kenyataannya, banyak kurikulum yang memisahkan mata pelajaran (<i>separated subject curriculum</i>), tetapi menuntut pembelajaran yang terpadu (<i>integrated learning</i>).</p>
<p>Ada juga pihak yang menyamakan keduanya, dengan alasan pusat perhatian kurikulum terpadu ada pada <b>proses</b> yang ditempuh siswa saat memahami isi pelajaran sejalan dengan keterampilan yang harus dikembangkan. Maka pembelajaran terpadu dipandang sebagai wawasan dan aktivitas berpikir dalam merancang pembelajaran untuk menghubungkan tema, topik, pemahaman, dan keterampilan secara utuh.</p>
<h3>Pengertian pembelajaran terpadu</h3>
<p>Pendekatan pembelajaran yang melibatkan beberapa mata pelajaran untuk memberi pengalaman bermakna. Bermakna karena siswa memahami konsep melalui <b>pengalaman langsung</b> dan menghubungkannya dengan konsep lain yang sudah dipahami. Menurut <b>Aminuddin (1994)</b>, fokusnya pada proses yang ditempuh siswa saat memahami isi pelajaran sejalan dengan bentuk keterampilan yang harus dikembangkan. Dari situ, pengertiannya dilihat sebagai:</p>
<ol><li>pendekatan yang menghubungkan berbagai mata pelajaran yang mencerminkan <b>dunia nyata</b> di sekeliling serta dalam rentang kemampuan dan perkembangan anak;</li><li>cara mengembangkan pengetahuan dan keterampilan anak secara <b>serempak (simultan)</b>;</li><li>merakit atau menggabungkan sejumlah konsep dari beberapa mata pelajaran berbeda, agar siswa belajar lebih baik dan bermakna.</li></ol>
<div class="warn"><b>⚠️ Jebakan:</b> pilihan di Tes Formatif 1 nomor 1 mengutip tiga definisi ini sebagai pengecoh. Yang milik Wolfinger hanya yang <b>“menggabungkan disiplin ilmu melalui pemaduan isi, keterampilan, sikap”</b>.</div>
<h3>Tema sebagai pusat perhatian dan akar teorinya</h3>
<ul><li>Pembelajaran berawal dari tema tertentu sebagai <b>pusat perhatian (<i>center of interest</i>)</b> untuk memahami gejala dan konsep lain, baik dari mata pelajaran terkait maupun lainnya.</li><li>Berorientasi pada kebutuhan perkembangan anak. Pendekatan ini berangkat dari teori yang <b>menolak latihan/hafalan (<i>drill</i>)</b> sebagai dasar pembentukan pengetahuan dan struktur intelektual anak.</li><li>Teori ini dimotori tokoh <b>Psikologi Gestalt</b> (termasuk teori <b>Piaget</b>): belajar harus bermakna dan program harus berorientasi pada kebutuhan perkembangan anak.</li><li>Tema dipilih dan dikembangkan oleh guru <b>bersama-sama dengan anak</b>. Tujuannya bukan hanya menguasai konsep mata pelajaran, tetapi menjadikan konsep itu <b>alat dan wahana</b> untuk mempelajari tema.</li><li>Dibanding pendekatan konvensional, lebih menekankan keterlibatan anak dan pembuatan keputusan, yakni <b>belajar sambil melakukan (<i>learning by doing</i>)</b>.</li></ul>
<div class="ing"><b>💡 Ingat:</b> Gestalt + Piaget = menolak <b>drill</b>. Tema = “pusat perhatian”, mata pelajaran = “alat”. Kata kunci: <i>center of interest</i>, <i>learning by doing</i>, <i>simultan</i>.</div>

<h2>B. Karakteristik pembelajaran terpadu</h2>
<p>Penerapannya di SD adalah upaya memperbaiki kualitas pendidikan, terutama untuk mengimbangi <b>penjejalan isi kurikulum</b>. Penjejalan itu berbahaya karena anak dituntut mengerjakan tugas melebihi kapasitas dan kebutuhannya, sehingga kehilangan sesuatu yang seharusnya bisa dikerjakan. Jika anak hanya merespons perintah guru, mereka kehilangan <b>pengalaman langsung (<i>direct experiences</i>)</b>, padahal pengalaman sensorik itulah dasar kemampuan belajar abstrak anak SD.</p>
<h3>6 karakteristik</h3>
<table><tr><th>No</th><th>Karakteristik</th><th>Artinya</th></tr>
<tr><td>1</td><td>Berpusat pada siswa (<i>student centered</i>)</td><td>Siswa jadi subjek belajar. Guru lebih sebagai <b>fasilitator</b> yang memberi kemudahan.</td></tr>
<tr><td>2</td><td>Pengalaman langsung</td><td>Siswa berhadapan dengan hal <b>konkret</b> sebagai dasar memahami hal yang abstrak.</td></tr>
<tr><td>3</td><td>Pemisahan antarmata pelajaran tidak begitu jelas</td><td>Di kelas awal SD, fokus pada tema yang paling dekat dengan kehidupan siswa.</td></tr>
<tr><td>4</td><td>Menyajikan konsep dari berbagai mata pelajaran dalam satu proses</td><td>Siswa memahami konsep secara <b>utuh</b>, untuk memecahkan masalah sehari-hari.</td></tr>
<tr><td>5</td><td>Luwes (fleksibel)</td><td>Guru dapat mengaitkan bahan ajar antarmata pelajaran, bahkan dengan kehidupan siswa dan lingkungan sekolah.</td></tr>
<tr><td>6</td><td>Hasil belajar berkembang sesuai minat dan kebutuhan siswa</td><td>Siswa dapat mengoptimalkan potensinya.</td></tr></table>
<h3>6 kelebihan dibanding pembelajaran konvensional</h3>
<ol><li>Pengalaman dan kegiatan belajar selalu <b>relevan</b> dengan tingkat perkembangan siswa.</li><li>Kegiatan sesuai minat dan kebutuhan anak.</li><li>Seluruh kegiatan lebih bermakna sehingga hasil belajar <b>bertahan lebih lama</b>.</li><li>Menumbuhkembangkan <b>keterampilan berpikir</b> siswa.</li><li>Kegiatan <b>pragmatis</b>, sesuai masalah yang sering ditemui di lingkungannya.</li><li>Menumbuhkan keterampilan sosial: <b>kerja sama, toleransi, komunikasi, respek</b> pada gagasan orang lain.</li></ol>
<h3>3 kendala pelaksanaan di SD</h3>
<ol><li>Kompetensi dasar dalam kurikulum SD <b>tahun 2004</b> masih terpisah-pisah per mata pelajaran, sehingga guru kesulitan menyusun program terpadu. Selain itu, tidak semua kompetensi dasar dapat dipadukan.</li><li>Perlu <b>sarana dan prasarana</b> belajar yang memadai. Kalau tidak, pelaksanaan tidak berjalan baik dan hasil belajar terpengaruh.</li><li>Belum semua guru SD memahami konsepnya secara utuh. Kendala utamanya adalah sifat <b>konservatif guru</b>: senang dengan pembelajaran konvensional yang biasa dilakukan.</li></ol>
<div class="ing"><b>💡 Ingat (kendala):</b> <b>K-S-G</b> = Kompetensi terpisah, Sarana kurang, Guru konservatif.</div>
<div class="warn"><b>⚠️ Jebakan ujian:</b> “siswa semakin pintar” dan “guru dapat mengevaluasi dengan mudah dan efektif” <b>tidak ada</b> di modul sebagai ciri/kelebihan. Keduanya jawaban “kecuali” di TF 1 no. 5 dan 6.</div>

<h2>C. Landasan pembelajaran terpadu</h2>
<p>Pembelajaran menempati posisi sangat strategis dalam pendidikan, jadi tidak bisa dilakukan sembarangan. Landasan adalah faktor yang harus dipertimbangkan guru saat <b>merencanakan, melaksanakan, dan menilai</b> pembelajaran. Ada tiga landasan utama: filosofis, psikologis, dan praktis.</p>
<table><tr><th>Landasan</th><th>Intinya</th></tr>
<tr><td>Filosofis</td><td>Pentingnya filsafat. Jadi landasan utama yang melandasi aspek lain. Perumusan tujuan/kompetensi dan isi/materi bergantung pada pertimbangan filosofis.</td></tr>
<tr><td>Psikologis</td><td>Psikologi perkembangan peserta didik (menentukan <b>isi/materi</b> sesuai keluasan dan kedalaman) dan psikologi/teori belajar (menentukan <b>cara/metode</b>).</td></tr>
<tr><td>Praktis</td><td>Kondisi nyata yang umumnya terjadi dalam pembelajaran saat ini.</td></tr></table>
<h3>1. Landasan filosofis: 3 aliran</h3>
<p><b>a. Progresivisme.</b> Menekankan pembentukan <b>kreativitas</b>, pemberian sejumlah <b>kegiatan</b>, suasana yang alamiah (<i>natural</i>), dan memperhatikan <b>pengalaman siswa</b> (Ellis, 1993). Siswa sering dihadapkan pada persoalan yang harus dipecahkan (<i>problem solving</i>). Siswa memilih dan menyusun ulang pengetahuan serta pengalaman, yang disebut proses berpikir <b>metakognisi</b>: menghubungkan pengetahuan dan pengalaman dengan pengetahuan lain untuk menghasilkan sesuatu (Marzano <i>et al</i>, 1992). Kesalahan dalam memecahkan masalah itu wajar karena bagian dari belajar.</p>
<p><b>b. Konstruktivisme.</b> Pengalaman langsung (<i>direct experiences</i>) adalah kunci belajar, jadi pengalaman orang lain (misalnya di buku teks) harus dihubungkan dengan pengalaman siswa sendiri. Pengetahuan adalah hasil <b>konstruksi/bentukan manusia</b> lewat interaksi dengan objek, fenomena, pengalaman, dan lingkungan. Pengetahuan dianggap benar bila berguna untuk menghadapi dan memecahkan persoalan. Pengetahuan <b>tidak bisa ditransfer begitu saja</b> dari guru ke siswa, tetapi diinterpretasikan sendiri. Pengetahuan bukan sesuatu yang sudah jadi, melainkan proses yang terus berkembang. Bukan tiruan realitas atau gambaran dunia kenyataan. Alat untuk mengetahui adalah <b>indera</b>: melihat, mendengar, menjamah, mencium, merasakan.</p>
<p><b>c. Humanisme.</b> Melihat siswa dari segi (a) keunikan/kekhasannya, (b) potensinya, (c) motivasi yang dimilikinya. Implikasi dari kesamaan dan kekhasan siswa: (a) layanan selain klasikal juga <b>individual</b>, (b) pengakuan adanya siswa yang <b>lambat dan cepat</b>, (c) penyikapan unik terhadap siswa, baik faktor personal maupun lingkungan sosial.</p>
<p>Implikasi dari <b>fitrah bahwa siswa punya bekal/potensi yang sama</b>: (a) guru bukan satu-satunya sumber informasi, (b) siswa disikapi sebagai <b>subjek belajar yang secara kreatif mampu menemukan pemahamannya sendiri</b>, (c) guru lebih banyak sebagai model, teman pendamping, pemberi motivasi, penyedia bahan, dan aktor yang juga bertindak sebagai siswa.</p>
<p>Implikasi dari <b>motivasi dan minat</b> siswa yang khas: (a) isi pelajaran bermanfaat bagi siswa <b>secara aktual</b>, (b) siswa menyadari penguasaan isi itu bagi kehidupannya, (c) isi disesuaikan dengan tingkat perkembangan, pengalaman, dan pengetahuan siswa.</p>
<div class="ing"><b>💡 Ingat:</b> <b>P-K-H</b> = Progresivisme (kreativitas, problem solving, metakognisi), Konstruktivisme (pengetahuan dibentuk sendiri), Humanisme (keunikan siswa). <b>Individualisme bukan landasan filosofis.</b></div>
<h3>2. Landasan psikologis</h3>
<p>Belajar berkaitan dengan perilaku manusia. Melalui belajar diharapkan perilaku siswa menuju kedewasaan fisik, mental/intelektual, moral, dan sosial. Tidak semua perubahan perilaku akibat pembelajaran: ada juga yang dipengaruhi <b>kematangan</b> atau pengaruh di luar kelas. Psikologi adalah ilmu yang mempelajari tingkah laku manusia, sehingga jadi acuan menentukan <b>apa dan bagaimana</b> perilaku dikembangkan. Empat pandangan psikologisnya:</p>
<ol><li>Tiap siswa <b>membangun realitasnya sendiri</b>. Pengalaman langsung siswa adalah kunci pembelajaran berarti, bukan pengalaman guru yang ditransfer lewat media.</li><li>Pikiran mampu mencari <b>pola dan hubungan</b> antargagasan. Pembelajaran terpadu memungkinkan siswa menemukan pola itu dari berbagai disiplin.</li><li>Siswa adalah individu dengan berbagai kemampuan dan kesempatan berkembang. Guru bukan pihak paling menentukan, tetapi lebih sebagai <b><i>tut wuri handayani</i></b>.</li><li>Perkembangan anak itu terpadu, dan anak melihat dirinya serta sekitarnya secara <b>utuh (holistik)</b>.</li></ol>
<h3>3. Landasan praktis</h3>
<ol><li>Ilmu berkembang begitu cepat, sehingga terlalu banyak informasi yang harus dimuat dalam kurikulum.</li><li>Hampir semua pelajaran di sekolah diberikan terpisah, padahal seharusnya saling terkait.</li><li>Masalah sekarang cenderung <b>interdisipliner</b>, sehingga perlu kolaborasi antarmata pelajaran.</li><li>Kesenjangan <b>teori dan praktik</b> dapat dipersempit lewat pembelajaran terpadu, sehingga siswa mampu berpikir teoritis sekaligus praktis.</li></ol>
<h3>Landasan tambahan: sosial-budaya dan IPTEK</h3>
<p>Pembelajaran selalu mengandung nilai yang harus sesuai nilai yang berlaku di masyarakat, dan keberhasilannya dipengaruhi lingkungan. Kehidupan masyarakat dengan karakteristik dan kekayaan budayanya menjadi dasar dan acuan. Landasan <b>IPTEK</b> diperlukan agar materi selaras dengan perkembangan dunia IPTEK, langsung maupun tidak langsung.</p>
<div class="warn"><b>⚠️ Jebakan:</b> “ledakan ilmu pengetahuan, informasi terlalu banyak di kurikulum” = landasan <b>praktis</b> (bukan filosofis/psikologis). “Sosiologis” bukan nama landasan di modul. Tiga landasan utama: filosofis, psikologis, praktis.</div>

<h2>D. Prinsip-prinsip pembelajaran terpadu</h2>
<p>Prinsip diperhatikan pada tiga saat: penggalian tema, pelaksanaan pembelajaran, dan penilaian.</p>
<h3>Prinsip penggalian tema (7)</h3>
<ol><li>Tema <b>tidak terlalu luas</b>, tetapi mudah dipakai untuk memadukan mata pelajaran.</li><li>Tema harus <b>bermakna</b>: memberi bekal belajar selanjutnya.</li><li>Sesuai dengan <b>tingkat perkembangan</b> siswa.</li><li>Mampu menunjukkan sebagian besar <b>minat</b> siswa.</li><li>Mempertimbangkan <b>peristiwa otentik</b> dalam rentang waktu belajar.</li><li>Mempertimbangkan <b>kurikulum yang berlaku</b> serta harapan masyarakat.</li><li>Mempertimbangkan <b>ketersediaan sumber belajar</b>.</li></ol>
<h3>Prinsip pelaksanaan (3)</h3>
<ol><li>Guru tidak bersikap <b>otoriter</b> atau menjadi <i>single actor</i> yang mendominasi aktivitas.</li><li>Tanggung jawab <b>individu dan kelompok</b> harus jelas dalam tugas kerja sama kelompok.</li><li>Guru <b>akomodatif</b> terhadap ide yang kadang sama sekali tidak terpikirkan dalam perencanaan.</li></ol>
<h3>Prinsip penilaian (2)</h3>
<ol><li>Beri kesempatan siswa melakukan <b>penilaian diri (<i>self-evaluation</i>)</b> di samping bentuk penilaian lain.</li><li>Guru mengajak siswa menilai perolehan belajar berdasarkan <b>kriteria keberhasilan</b> pencapaian tujuan/kompetensi yang telah disepakati.</li></ol>
<div class="ing"><b>💡 Ingat:</b> 7 – 3 – 2 (tema – pelaksanaan – penilaian). Prinsip yang dibahas hanya <b>penggalian tema, pelaksanaan, dan penilaian</b>. “Prinsip perencanaan” dan “prinsip reaksi” bukan prinsip di modul.</div>

<h2>E. Manfaat pembelajaran terpadu (10)</h2>
<ol><li>Penggabungan mata pelajaran menghemat karena <b>tumpang-tindih materi</b> dikurangi bahkan dihilangkan.</li><li>Siswa melihat hubungan bermakna karena materi lebih berperan sebagai sarana/alat daripada tujuan akhir.</li><li>Meningkatkan taraf <b>kecakapan berpikir</b>: siswa dihadapkan pada gagasan lebih besar, luas, dalam.</li><li>Kemungkinan pembelajaran terpotong-potong sedikit sekali terjadi.</li><li>Memberi penerapan dunia nyata sehingga memperbesar peluang <b>transfer of learning</b>.</li><li>Penguasaan materi semakin baik dan meningkat.</li><li>Pengalaman antarmata pelajaran positif untuk pendekatan menyeluruh terhadap perkembangan ilmu. Siswa lebih aktif dan <b>otonom</b> dalam berpikir.</li><li>Motivasi belajar diperbaiki dan ditingkatkan lewat “konfrontasi yang melibatkan banyak pemikiran” dengan pokok bahasan.</li><li>Membantu menciptakan <b>struktur kognitif</b> atau pengetahuan awal yang menjembatani pemahaman terkait dan lebih mendalam, serta transfer pemahaman antarkonteks.</li><li>Kerja sama meningkat antara guru, siswa, guru-siswa, dan siswa-narasumber. Belajar menyenangkan, dalam situasi nyata dan konteks lebih bermakna.</li></ol>
<div class="ing"><b>💡 Ingat:</b> manfaat = hemat (tumpang-tindih hilang), berpikir naik, transfer naik, motivasi naik, kerja sama naik.</div>

<h1>Kegiatan Belajar 2: Model-Model Pembelajaran Terpadu</h1>
<p>Di KB 1 kita sudah tahu apa itu pembelajaran terpadu. Sekarang kita lihat “wujudnya”: ada banyak cara memadukan konsep, keterampilan, topik, dan unit tematis. Bayangkan seperti memilih cara menyajikan nasi dan lauk: dipisah di piring berbeda, ditata berdampingan, dicampur jadi satu, dan seterusnya.</p>

<h2>A. Berbagai model pembelajaran terpadu</h2>
<p>Menurut <b>Robin Fogarty (1991)</b> ada <b>sepuluh</b> cara/model merencanakan pembelajaran terpadu: (1) <i>fragmented</i>, (2) <i>connected</i>, (3) <i>nested</i>, (4) <i>sequenced</i>, (5) <i>shared</i>, (6) <i>webbed</i>, (7) <i>threaded</i>, (8) <i>integrated</i>, (9) <i>immersed</i>, (10) <i>networked</i>.</p>
<div class="tw"><table><tr><th>No</th><th>Model</th><th>Inti</th><th>Contoh di modul</th><th>Gambar</th></tr>
<tr><td>1</td><td><b>Penggalan</b> (<i>Fragmented</i>)</td><td>Pemaduan terbatas pada <b>satu</b> mata pelajaran saja; butir materi dilaksanakan terpisah pada jam berbeda.</td><td>Bahasa Indonesia: menyimak, berbicara, membaca, menulis dipadukan dalam keterampilan berbahasa.</td><td>4 lingkaran terpisah dalam kotak</td></tr>
<tr><td>2</td><td><b>Keterhubungan</b> (<i>Connected</i>)</td><td>Butir pembelajaran <b>dipayungkan pada induk</b> mata pelajaran tertentu.</td><td>Kosakata, struktur, membaca, mengarang dipayungkan pada Bahasa dan Sastra Indonesia.</td><td>3 lingkaran terpisah + 1 pasang lingkaran bertautan</td></tr>
<tr><td>3</td><td><b>Sarang</b> (<i>Nested</i>)</td><td>Memadukan berbagai bentuk penguasaan konsep keterampilan <b>melalui satu kegiatan</b> pembelajaran.</td><td>Fokus bentuk kata, makna kata, ungkapan, dengan sarana pembuatan puisi (imajinasi, berpikir logis).</td><td>Lingkaran bersarang</td></tr>
<tr><td>4</td><td><b>Urutan/Rangkaian</b> (<i>Sequenced</i>)</td><td>Memadukan topik antarmata pelajaran berbeda <b>secara paralel</b>, pada alokasi jam yang sama.</td><td>Roman sejarah dipadukan dengan sejarah perjuangan bangsa, kehidupan sosial periode tertentu, perubahan makna kata.</td><td>2 lingkaran putus-putus</td></tr>
<tr><td>5</td><td><b>Bagian</b> (<i>Shared</i>)</td><td>Pemaduan akibat <b>overlapping</b> konsep/ide pada dua mata pelajaran atau lebih.</td><td>Kewarganegaraan dalam PPKn tumpang tindih dengan Tata Negara, PSPB.</td><td>2 lingkaran beririsan</td></tr>
<tr><td>6</td><td><b>Jaring laba-laba</b> (<i>Webbed</i>)</td><td><b>Paling populer</b>. Pendekatan <b>tematis</b>; tema mengikat kegiatan dalam satu mapel maupun lintas mapel.</td><td>Satu tema di tengah dengan banyak subtema.</td><td>Kotak di tengah, 6 lingkaran terhubung</td></tr>
<tr><td>7</td><td><b>Galur</b> (<i>Threaded</i>)</td><td>Memadukan bentuk <b>keterampilan</b>; berfokus pada <b>meta-curriculum</b>.</td><td>Prediksi dan estimasi dalam Matematika, ramalan kejadian, antisipasi cerita dalam novel.</td><td>Lingkaran berderet pada satu benang</td></tr>
<tr><td>8</td><td><b>Keterpaduan</b> (<i>Integrated</i>)</td><td>Memadukan topik dari mapel berbeda yang <b>esensinya sama</b> dalam topik tertentu.</td><td>Topik evidensi di Matematika, B. Indonesia, IPA, IPS cukup diletakkan di satu mapel (misal IPA). Teks membaca dimasukkan butir terkait Matematika, IPA. Sangat baik dikembangkan di SD.</td><td>Beberapa lingkaran saling tumpang tindih</td></tr>
<tr><td>9</td><td><b>Celupan</b> (<i>Immersed</i>)</td><td>Membantu siswa <b>menyaring dan memadukan</b> pengalaman dan pengetahuan dengan medan pemakaiannya. Tukar pengalaman sangat diperlukan.</td><td>Tidak ada contoh khusus di modul.</td><td>Lingkaran besar berisi 4 lingkaran kecil</td></tr>
<tr><td>10</td><td><b>Jaringan</b> (<i>Networked</i>)</td><td>Memungkinkan perubahan konsepsi, bentuk pemecahan masalah, atau tuntutan keterampilan baru setelah <b>studi lapangan</b> dalam situasi/konteks berbeda. Belajar proses terus-menerus (hubungan timbal balik pemahaman-kenyataan).</td><td>Tidak ada contoh khusus di modul.</td><td>3 kelompok lingkaran dihubungkan garis</td></tr></table></div>
<h3>Penjelasan tambahan tiap model</h3>
<ul><li><b>Connected:</b> penguasaan butir-butir itu adalah keutuhan dalam membentuk kemampuan berbahasa dan bersastra. Namun pembentukan pemahaman, keterampilan, dan pengalaman secara utuh <b>tidak berlangsung otomatis</b>, jadi guru harus menata butir pembelajaran dan prosesnya secara terpadu.</li><li><b>Nested:</b> keterampilan imajinasi dan berpikir logis <b>tidak harus dirumuskan dalam tujuan</b>. Keduanya tergarap saat siswa memakai kata, membuat ungkapan, dan mengarang puisi. Penguasaannya terlihat dari kemampuan membuat ungkapan dan mengarang puisi.</li><li><b>Integrated:</b> perlu penataan area isi bacaan yang lengkap supaya bisa dipakai menyampaikan butir pelajaran dari berbagai mapel.</li><li><b>Webbed:</b> tema bertindak sebagai pengikat bahan dan kegiatan pembelajaran.</li></ul>
<div class="ing"><b>💡 Ingat urutan Fogarty:</b> F-C-N-S-S-W-T-I-I-N. Hafalkan dengan kalimat: “<b>F</b>ajar <b>C</b>ari <b>N</b>asi, <b>S</b>iti <b>S</b>emangka, <b>W</b>ati <b>T</b>ahu <b>I</b>kan <b>I</b>kut <b>N</b>imbrung”. Kata kunci: <b>Connected = payung</b>, <b>Shared = irisan</b>, <b>Webbed = tema + jaring</b>, <b>Threaded = keterampilan + meta-curriculum</b>, <b>Networked = studi lapangan</b>.</div>
<p>Untuk memahami lebih dalam, modul menyarankan membaca buku Robin Fogarty, <i>How To Integrate The Curricula</i>, terbitan IRI/Skylight Publishing, Inc. (1991).</p>

<h3>Pandangan Jacobs (1989): 5 bentuk keterpaduan</h3>
<div class="tw"><table><tr><th>Bentuk</th><th>Artinya</th></tr>
<tr><td><i>Discipline based</i></td><td>Bertolak dari <b>mata pelajaran tertentu</b>. Topik ekonomi, misalnya, dapat dihubungkan dengan masalah sosial politik dan ilmiah.</td></tr>
<tr><td><i>Parallel</i></td><td>Memadukan <b>tema-tema yang sama</b> dalam beberapa mapel. Tingkat keterpaduannya kurang mendalam.</td></tr>
<tr><td><i>Multidisciplinary</i></td><td>Sejumlah mapel dipelajari <b>secara terpisah melalui sebuah tema</b>.</td></tr>
<tr><td><i>Interdisciplinary</i></td><td>Menggabungkan sejumlah mapel <b>dalam sebuah tema</b>. Kegiatan berlangsung pada waktu bersamaan.</td></tr>
<tr><td><i>Integrated</i></td><td>Memadukan sebuah <b>konsep</b> dari sejumlah mapel lewat hubungan tujuan, isi, keterampilan, aktivitas, dan sikap. Antarmapel, ditandai pemaduan tujuan, kemampuan, sikap dari berbagai mapel dalam topik tertentu secara utuh.</td></tr></table></div>
<div class="ing"><b>💡 Ingat:</b> multi = <b>terpisah</b> lewat tema; inter = <b>digabung</b> dalam tema, waktu sama. Discipline based = mulai dari satu mapel. Parallel = tema sama, keterpaduan kurang mendalam.</div>

<h2>B. Model pembelajaran terpadu di sekolah dasar</h2>
<p>Tidak semua model Fogarty dan Jacobs tepat untuk SD. Menurut kajian <b>Tim Pengembang PGSD (1997)</b>, tiga model yang paling cocok di SD adalah <b>jaring laba-laba (webbed), keterhubungan (connected), dan keterpaduan (integrated)</b>.</p>
<div class="ing"><b>💡 Ingat:</b> tiga untuk SD = <b>W-C-I</b>. Model <i>shared</i> (bagian), <i>nested</i>, dsb. <b>bukan</b> model SD.</div>
<div class="tw"><table><tr><th></th><th>Webbed</th><th>Connected</th><th>Integrated</th></tr>
<tr><th>Pendekatan</th><td><b>Tematis</b>: tentukan tema → kembangkan jadi subtema yang terkait mapel → aktivitas siswa berkembang sendiri</td><td>Sengaja menghubungkan <b>satu konsep dengan konsep lain</b>, topik dengan topik, keterampilan dengan keterampilan, tugas hari ini dengan tugas hari berikutnya, ide semester ini dengan semester berikutnya <b>dalam satu mapel</b></td><td><b>Antarmata pelajaran</b>: tetapkan prioritas kurikuler, tentukan keterampilan, konsep, sikap yang saling tumpang tindih di beberapa mapel</td></tr>
<tr><th>Langkah awal</th><td>Memilih tema</td><td>Menghubungkan ide dalam satu mapel</td><td>Guru menyeleksi konsep/keterampilan/sikap per semester dari beberapa mapel, lalu memilih yang erat dan tumpang tindih. <b>Tema yang terkait dan bertumpang tindih dicari terakhir</b> (beda dengan webbed).</td></tr></table></div>
<h3>Kekuatan dan kelemahan</h3>
<div class="tw"><table><tr><th>Model</th><th>Kekuatan</th><th>Kelemahan</th></tr>
<tr><td><b>Webbed</b></td><td>a. Ada faktor <b>motivasional</b> dari menyeleksi tema yang sangat diminati.<br>b. Relatif <b>lebih mudah</b> dilakukan guru yang belum berpengalaman.<br>c. Mempermudah perencanaan <b>kerja tim</b> mengembangkan tema ke semua bidang isi pelajaran.</td><td>a. Langkah sulit: <b>menyeleksi tema</b>.<br>b. Cenderung merumuskan tema yang dangkal, hanya berguna secara artifisial dalam perencanaan kurikulum.<br>c. Guru dapat menjaga misi kurikulum.<br>d. Guru lebih fokus pada <b>kegiatan</b> daripada pengembangan konsep.</td></tr>

<h1>Kegiatan Belajar 1: Kegiatan Pendahuluan</h1>
<h2>Pengantar</h2>
<p>Pembelajaran terpadu memberi siswa pengalaman langsung (<i>direct experiences</i>) yang bermakna, otentik, dan aktif. Cara guru mengemas pengalaman itu sangat berpengaruh, sehingga pelaksanaannya harus mengikuti prosedur yang sesuai prinsip pembelajaran terpadu. Prosedur umumnya ada tiga: <b>kegiatan pendahuluan, kegiatan inti, serta kegiatan akhir dan tindak lanjut</b>.</p>
<p>Pendahuluan itu penting dan dapat menentukan keberhasilan. Kegagalan sering terjadi karena pendahuluan tidak dikelola baik atau dianggap hanya pelengkap. Itu karena pemahaman guru yang sempit tentang proses pembelajaran.</p>
<div class="ing"><b>💡 Ingat:</b> pendahuluan itu seperti pemanasan sebelum olahraga. Dilewati, badan belum siap.</div>

<h2>A. Makna kegiatan pendahuluan</h2>
<ul><li>Seluruh proses pembelajaran terpadu harus membangkitkan aktivitas siswa sebagai <b>objek dan subjek</b> pembelajaran.</li><li>Pendahuluan adalah bagian <b>integral</b> yang tidak dapat dipisahkan dari komponen lain. Maka harus direncanakan dan dilaksanakan secara <b>sistematis, fleksibel, efektif, dan efisien</b>.</li><li>Ditempuh guru dan siswa <b>setiap kali</b> pembelajaran dilaksanakan.</li><li><b>Fungsi utama:</b> menciptakan suasana awal pembelajaran yang efektif sehingga siswa dapat mengikuti proses dengan baik.</li><li>Waktunya singkat, sekitar <b>5–10 menit</b>, jadi efisiensi waktu perlu diperhatikan. Di kegiatan inti siswa diharapkan sudah siap.</li></ul>
<p><b>Contoh kegiatannya:</b> guru menyapa dengan nada bersemangat dan gembira (mengucapkan salam), mengecek kehadiran, menanyakan ketidakhadiran dengan tulus, lalu membantu siswa menyiapkan sarana dan prasarana (papan tulis bersih, media atau alat belajar, buku sumber). Semua ini direncanakan dan sedapat mungkin melibatkan siswa agar ikut bertanggung jawab. Guru juga memberi gambaran umum materi dan memancing dengan pertanyaan terkait materi, sehingga siswa aktif berbicara, muncul rasa ingin tahu, dan tergiring ke kegiatan inti.</p>

<h2>B. Bentuk kegiatan pendahuluan</h2>
<div class="tw"><table><tr><th>Jenis kegiatan</th><th>Artinya</th></tr>
<tr><td><b>Kegiatan Awal Pembelajaran</b></td><td>Menyiapkan siswa yang <b>langsung berkaitan</b> dengan kompetensi/materi yang dibahas di kegiatan inti.</td></tr>
<tr><td><b>Kegiatan Pra-pembelajaran</b></td><td>Kegiatan yang <b>tidak langsung berkaitan</b> dengan materi/kompetensi.</td></tr></table></div>
<p>Kunci jawaban modul menyebut kegiatan pendahuluan terdiri dari kegiatan <b>pra-instruksional (pra-pembelajaran)</b> dan kegiatan <b>awal pembelajaran</b>.</p>
<p><b>Empat kegiatan utama:</b> (1) menciptakan kondisi awal pembelajaran yang kondusif, (2) memberikan acuan, (3) membuat kaitan (apersepsi), (4) penilaian awal (<i>pre-test</i>).</p>
<div class="ing"><b>💡 Ingat:</b> <b>K-A-A-P</b> = Kondisi, Acuan, Apersepsi, Penilaian awal.</div>

<h3>1. Penciptaan kondisi awal pembelajaran (5 cara)</h3>
<p><b>a. Mengecek kehadiran siswa (<i>presence, attendance</i>).</b> Beberapa penelitian: siswa dengan kehadiran relatif tinggi (<b>90% ke atas</b>) berprestasi lebih baik. Jika siswa banyak, cari cara praktis: minta siswa yang hadir menyebutkan siapa yang tidak hadir, lalu guru menanyakan alasannya. Manfaatnya: secara tidak langsung memotivasi siswa selalu hadir (kecuali ada halangan seperti sakit atau keperluan keluarga), menanamkan <b>kedisiplinan</b>, dan membiasakan memberi tahu lebih dulu secara tertulis atau lisan lewat teman atau guru.</p>
<p><b>b. Menumbuhkan kesiapan belajar (<i>readiness</i>).</b> Kesiapan adalah prinsip belajar yang sangat berpengaruh pada hasil. Dasarnya teori <b>Koneksionisme/Asosiasi</b> dengan tokoh <b>Edward L. Thorndike</b>, teori paling awal dari rumpun <b>Behaviorisme</b>: kehidupan tunduk pada hukum stimulus-respons (aksi-reaksi). Belajar = membentuk hubungan stimulus-respons sebanyak-banyaknya. Tiga hukum belajar (<i>law of learning</i>):</p>
<div class="tw"><table><tr><th>Hukum</th><th>Intinya</th></tr><tr><td><i>Law of readiness</i> (kesiapan)</td><td>Hubungan stimulus-respons terbentuk/mudah terbentuk bila ada <b>kesiapan sistem syaraf</b> individu.</td></tr><tr><td><i>Law of exercise</i></td><td>Pentingnya <b>latihan</b>.</td></tr><tr><td><i>Law of effect</i></td><td>Pentingnya <b>penguatan</b>.</td></tr></table></div>
<p>Enam alternatif menciptakan kesiapan: (1) membantu/membimbing siswa menyiapkan fasilitas dan sumber belajar; (2) menciptakan kondisi belajar kondusif dan konstruktif; (3) menunjukkan sikap penuh semangat (antusiasme) dan minat mengajar yang tinggi; (4) mengontrol seluruh siswa sejak awal; (5) memakai media yang sesuai tujuan serta minat dan perhatian siswa; (6) menentukan kegiatan belajar yang memungkinkan siswa dapat melakukannya.</p>
<p><b>c. Menciptakan suasana belajar yang demokratis.</b> Sesuai ciri pembelajaran terpadu yang <i>student centered</i>. Menumbuhkan keberanian menjawab, bertanya, berpendapat/mengeluarkan ide, dan memperlihatkan unjuk kerja (<i>performance</i>). Siswa merasa bebas, sukarela, tidak ditekan atau dipaksa. Alternatifnya: ajukan pertanyaan awal yang berkaitan dengan topik/tema, yang merangsang siswa menjawab atau berpendapat dan berkaitan dengan hal yang kira-kira pernah dialami siswa. Guru dituntut memilih jenis pertanyaan secara kreatif.</p>
<p><b>d. Membangkitkan motivasi belajar.</b> Motivasi adalah <b>motor penggerak</b> aktivitas belajar. Motor mati, belajar tidak terjadi. Motor lemah, belajar lemah.</p>
<div class="tw"><table><tr><th>Siswa</th><th>Alasan sungguh-sungguh belajar</th><th>Jenis</th></tr>
<tr><td>Irfan (kelas IV)</td><td>Sadar kemampuan matematika bermanfaat dalam kehidupan sehari-hari</td><td><b>Intrinsik</b></td></tr>
<tr><td>Dodi (sejak kelas II)</td><td>Senang seni suara, ingin jadi penyanyi yang baik</td><td><b>Intrinsik</b></td></tr>
<tr><td>Nani (kelas II)</td><td>Ayah menjanjikan sepeda mini bila jadi siswa terbaik</td><td><b>Ekstrinsik</b></td></tr>
<tr><td>Aminah (kelas V)</td><td>Ibu guru pernah memberi pujian saat ia nilai terbaik</td><td><b>Ekstrinsik</b></td></tr></table></div>
<ul><li><b>Intrinsik (internal/murni):</b> berkaitan <b>langsung dengan tujuan pembelajaran</b>, ingin menguasai kemampuan di dalam tujuan. Guru berusaha memunculkannya, misalnya dengan menjelaskan kaitan tujuan dengan kebutuhan siswa. Di kelas rendah (kelas 1 dan 2) agak sulit karena mereka belum menyadari pentingnya pelajaran.</li><li><b>Ekstrinsik (eksternal):</b> tujuan di <b>luar</b> pelajaran (hadiah atau pujian). Cara memunculkan: memberi <b>penguatan</b> (pujian atau hadiah), menciptakan situasi belajar yang menyenangkan, atau memberi nasihat.</li><li>Kesamaan keempat kasus: semua punya dorongan belajar, walau kadarnya berbeda.</li></ul>
<p><b>e. Membangkitkan perhatian siswa.</b> Perhatian = <b>pemusatan energi psikis (pikiran dan perasaan)</b> terhadap objek yang dipelajari. Makin terpusat, proses dan hasil makin baik. Perhatian muncul karena dua hal: <b>(1)</b> siswa merasa objek berkaitan dengan dirinya (kebutuhan, cita-cita, pengalaman, bakat, atau minat); <b>(2)</b> objek dipandang berbeda, lain dari yang biasa. Contoh: Dedi tertarik penjelasan perpindahan penduduk karena pernah dibawa orang tuanya bertransmigrasi (kaitan pengalaman). Sekelompok siswa penuh perhatian karena guru memakai alat peraga yang belum pernah dilihat (objek baru). Upaya guru: mengaitkan pelajaran dengan pengalaman, kebutuhan, cita-cita, bakat, minat siswa, dan memakai metode serta media yang bervariasi.</p>
<div class="ing"><b>💡 Ingat (5 cara kondisi awal):</b> <b>H-K-D-M-P</b> = Hadir, Kesiapan, Demokratis, Motivasi, Perhatian. Intrinsik = tujuan di dalam pelajaran (Irfan, Dodi). Ekstrinsik = hadiah/pujian di luar (Nani, Aminah).</div>

<h3>2. Memberi acuan</h3>
<p>Menyampaikan secara <b>spesifik dan singkat</b> gambaran umum hal yang dipelajari dan kegiatan yang ditempuh selama pembelajaran. Dua bentuk:</p>
<p><b>a. Memberitahukan tujuan (kemampuan) yang diharapkan atau garis besar materi.</b> Agar siswa tahu sejak awal kemampuan apa yang akan diperoleh. Ini mendorong siswa bersungguh-sungguh. Gunakan bahasa yang dipahami sesuai perkembangan siswa. Bisa disampaikan lisan atau ditulis di papan tulis, supaya siswa memusatkan perhatian pada kemampuan itu.</p>
<p><b>b. Menyampaikan alternatif kegiatan belajar yang akan ditempuh.</b> Misalnya diskusi: sampaikan teknik/langkahnya. Eksperimen: langkah eksperimen. Kerja kelompok: bentuk kelompok dan sampaikan prosedur kerjanya. Bila siswa sudah memahami tekniknya, tidak perlu dijelaskan rinci. Sampaikan juga sumber belajar yang mendukung. Alasannya: pembelajaran terpadu lebih mengutamakan proses belajar <b>beraktivitas tinggi</b>, guru lebih sebagai <b>fasilitator</b>, siswa mencari dan menemukan sendiri (prinsip <b>konstruktivisme</b>), serta efektivitas dan efisiensi dipengaruhi teknik dan prosedur belajar yang dipakai.</p>

<h3>3. Membuat kaitan (melaksanakan apersepsi)</h3>
<p>Siswa tertarik bila melihat kaitan dengan apa yang telah dikenal, pengalaman, minat, dan kebutuhan mereka. Apersepsi adalah <b>menumbuhkan tanggapan lama</b> yang dimiliki siswa sebelum memberi bahan baru, atau menerima tanggapan baru dengan bantuan tanggapan lama. Singkatnya: menghubungkan materi yang sudah dimiliki dengan yang akan dipelajari. Contohnya guru mengulang atau meminta siswa mengingat bahan yang sudah diajarkan.</p>
<p><b>Fungsi:</b> menyiapkan kondisi awal belajar, terutama <b>kesiapan mental</b> menghadapi pelajaran, supaya materi lebih mudah diterima. Proses <b>asimilasi dan integrasi</b> pengetahuan adalah hasil perpaduan bahan apersepsi dengan bahan baru.</p>
<div class="tw"><table><tr><th>Cara apersepsi</th><th>Contoh di modul</th></tr>
<tr><td>a. Mengajukan <b>pertanyaan tentang bahan yang sudah dipelajari</b> (bila materi baru berkaitan langsung dengan materi sebelumnya)</td><td>Siswa dibimbing mengingat kembali dan melihat bahwa materi saling berkaitan, tidak berdiri sendiri.</td></tr>
<tr><td>b. Menunjukkan <b>manfaat</b> materi</td><td>Membahas makanan bergizi: manfaatnya bagi pertumbuhan tinggi dan berat badan siswa.</td></tr>
<tr><td>c. Meminta siswa mengemukakan <b>pengalaman</b> yang berkaitan</td><td>Membahas bentuk permukaan bumi: siswa menceritakan pengalaman berlibur ke pantai atau pegunungan.</td></tr></table></div>

<h3>4. Melaksanakan tes awal (<i>pre-test</i>)</h3>
<p>Dilakukan bila materi yang dibahas adalah <b>materi baru</b> dan guru ingin tahu berapa banyak siswa telah menguasainya. Perlu karena guru bukan satu-satunya sumber belajar. Tujuannya mengukur sejauh mana materi yang akan dipelajari sudah dikuasai siswa. Hasilnya dipakai guru untuk menentukan <b>dari mana pembahasan materi baru dimulai</b>. Karena waktu terbatas, bisa dilakukan <b>secara lisan</b> pada beberapa siswa yang dianggap mewakili seluruh siswa.</p>
<div class="ing"><b>💡 Ingat:</b> <b>Apersepsi = bahan yang SUDAH dipelajari. Penilaian awal = bahan yang AKAN diajarkan.</b> Mundur vs maju.</div>

<h2>Latihan (arah jawaban)</h2>
<p>Rancang skenario kegiatan pendahuluan: tentukan topik dan tujuan, lalu rancang kegiatan pendahuluannya sesuai tahap-tahap di atas. Minta teman mensimulasikan, catat kegiatannya, lalu beri komentar dengan mengingat kembali tujuan kegiatan pendahuluan.</p>

<h1>Kegiatan Belajar 2: Kegiatan Inti</h1>
<h2>Pengantar</h2>
<p>Kegiatan inti adalah kegiatan <b>utama</b>. Ia menekankan <b>proses pembentukan pengalaman belajar siswa (<i>learning experiences</i>)</b> terkait kemampuan yang diharapkan dikuasai secara terpadu, disusun guru dengan mengacu kurikulum yang berlaku. Di Kurikulum 2004, kemampuan itu dinamakan <b>Standar Kompetensi</b>. Guru perlu mengidentifikasi secara sistematis kegiatan belajar apa saja yang memungkinkan siswa mencapai kompetensi.</p>
<h2>A. Makna kegiatan inti</h2>
<ul><li>Sering disebut kegiatan <b>instruksional</b>.</li><li>Kompleks, terutama dalam penguasaan kemampuan secara terpadu, sehingga harus direncanakan secara matang.</li><li>Prinsipnya: proses membentuk pengalaman dan kemampuan siswa <b>secara terprogram</b> dalam durasi tertentu.</li><li>Siswa diharapkan punya dua hal: kemampuan sebagai <b>dampak instruksional</b> (langsung terkait tujuan sesuai kurikulum) dan <b>sikap positif</b> terhadap bahan pelajaran (<b>dampak pengiring</b>).</li><li>Agar siswa aktif: libatkan siswa sebanyak mungkin, beri kesempatan <b>berbuat langsung</b>, penuhi kebutuhan individual maupun kelompok, dan buat kegiatan <b>bervariasi</b>.</li></ul>
<h2>B. Bentuk kegiatan inti</h2>
<p>Setelah kegiatan awal, guru mengorganisasikan proses belajar dengan cara/teknik/metode/pendekatan yang bervariasi agar siswa beraktivitas tinggi. Targetnya perubahan tingkah laku: tidak memahami menjadi memahami, tidak mampu menjadi mampu, tidak terampil menjadi terampil. Organisasi harus <b>efektif</b> (mencapai sasaran) dan <b>efisien</b> (memakai sarana, waktu, tenaga yang dimiliki). Pelaksanaannya tetap <b>situasional</b>, menyesuaikan kondisi.</p>
<p>Dua hal yang perlu dipahami: <b>pertama</b>, bahan disajikan <b>terpadu</b> lewat penghubungan konsep antarmapel (dibahas di Modul 4). <b>Kedua</b>, guru memakai strategi dan media <b>bervariasi</b> yang mendorong siswa aktif menemukan pengetahuan baru.</p>
<p>Kegiatan pembelajaran = kegiatan yang dirancang guru agar proses belajar terjadi pada siswa. Siswa harus terlibat aktif <b>intelektual dan emosional</b> (termasuk fisik), jadi harus <i>student-centered</i>. Hasilnya: kesempatan eksplorasi, memenuhi keingintahuan, dan mengembangkan <b>berpikir tingkat tinggi</b> (menganalisis, menanggulangi), bukan hanya mengulang informasi guru, tetapi menemukan dan memecahkan masalah.</p>
<div class="tw"><table><tr><th>Pengalaman dari</th><th>Contoh kegiatan</th></tr><tr><td><b>Mengerjakan</b> sesuatu</td><td>percobaan, berlatih mengerjakan soal, diskusi, membuat karangan, wawancara</td></tr><tr><td><b>Mengamati</b> orang lain</td><td>demonstrasi guru, mengamati teman yang melakukan keterampilan, penjelasan materi, pemutaran video atau audio</td></tr></table></div>
<p>Sesuai kompetensi yang mencakup pengetahuan, keterampilan, sikap dan nilai, kegiatan harus memberi kesempatan <b>mengkaji, berlatih, dan menghayati</b>.</p>
<h3>5 faktor penentu kegiatan (Wardani, 2002)</h3>
<div class="tw"><table><tr><th>Faktor</th><th>Pengaruhnya</th></tr>
<tr><td><b>1. Tujuan</b></td><td>Pengetahuan menuntut <b>pengkajian</b> (mendengar penjelasan, demonstrasi, observasi, percobaan, diskusi). Keterampilan menuntut <b>latihan</b> (misal memainkan alat musik, menyatakan pendapat). Sikap dan nilai menuntut <b>penghayatan</b> (kerja sama lewat kerja sama).</td></tr>
<tr><td><b>2. Materi</b></td><td>Jenis dan tingkat kesulitan. Materi <b>abstrak</b>: beri contoh-contoh. Materi <b>baru</b>: penjelasan singkat atau demonstrasi. Materi sudah dikenal: kegiatan mengatasi masalah terkait materi.</td></tr>
<tr><td><b>3. Siswa</b></td><td>Karakteristik dan jumlah siswa. Percobaan di laboratorium: alat dan bahan tidak asing. Diskusi kelompok: siswa sudah mampu mengemukakan dan menanggapi pendapat.</td></tr>
<tr><td><b>4. Guru</b></td><td>Kemampuan mengelola kegiatan. Bila tidak mampu melakukan percobaan, minta bantuan guru lain.</td></tr>
<tr><td><b>5. Fasilitas, ruang, waktu</b></td><td>Alat tidak cukup untuk tiap siswa: <b>percobaan kelompok</b>. Waktu sedikit: kerja kelompok kurang tepat karena waktu habis membentuk kelompok dan menyiapkan fasilitas.</td></tr></table></div>
<div class="ing"><b>💡 Ingat:</b> <b>T-M-S-G-F</b> = Tujuan, Materi, Siswa, Guru, Fasilitas-ruang-waktu. Tujuan: pengetahuan = kaji, keterampilan = latih, sikap = hayati (<b>K-L-H</b>).</div>
<h3>Media pembelajaran</h3>
<p>Media adalah komponen yang berkaitan dengan komponen lain untuk membantu siswa belajar. Tanpa media bervariasi, kegiatan inti tidak berjalan efektif. Modul mencontohkan Ibu Evi (guru kelas 1 SD) menjelaskan materi terpadu dengan <b>gambar berseri</b>.</p>
<h4>4 nilai media</h4>
<ol><li><b>Mengkonkretkan konsep abstrak</b>: sistem peredaran darah, arus listrik, berhembusnya angin lewat gambar atau bagan sederhana.</li><li><b>Menghadirkan objek berbahaya atau sukar didapat</b>: harimau, beruang, gajah, jerapah, ular kobra lewat gambar atau televisi.</li><li><b>Menampilkan objek terlalu besar atau terlalu kecil</b>: kapal laut, pesawat, pasar, candi / bakteri, virus, semut, nyamuk, kupu-kupu.</li><li><b>Memperlihatkan gerakan terlalu cepat atau terlalu lambat</b>: film <i>slow motion</i> (lintasan peluru, melesatnya anak panah, ledakan) dan video (pertumbuhan kecambah, bunga mekar).</li></ol>
<h4>7 kekuatan media</h4>
<ol type="a"><li>Siswa dapat berinteraksi langsung dengan lingkungannya.</li><li>Memungkinkan keragaman pengamatan/persepsi tiap siswa.</li><li>Membangkitkan motivasi belajar.</li><li>Menyajikan informasi <b>konsisten</b> dan dapat <b>diulang atau disimpan</b>.</li><li>Menyajikan pesan secara <b>serempak</b> bagi seluruh siswa.</li><li>Mengatasi keterbatasan waktu dan ruang.</li><li>Mengontrol arah dan kecepatan belajar siswa.</li></ol>
<h4>6 hal yang diperhatikan dalam memanfaatkan media</h4>
<ol type="a"><li>Bukan fungsi tambahan, tetapi punya fungsi sendiri: mewujudkan situasi belajar lebih efektif.</li><li>Bagian <b>integral</b> dari seluruh proses pembelajaran (komponen yang tidak berdiri sendiri).</li><li><b>Relevan</b> dengan kompetensi dasar, indikator, dan isi bahan.</li><li>Berfungsi <b>mempercepat</b> proses belajar.</li><li>Meningkatkan <b>kualitas</b> proses sehingga hasil lebih tahan lama mengendap.</li><li>Meletakkan dasar konkret untuk berpikir, sehingga mengurangi <b>verbalisme</b>.</li></ol>
<div class="ing"><b>💡 Ingat:</b> 4 nilai = konkretkan abstrak, hadirkan yang bahaya/sukar, besar-kecil, cepat-lambat. Media tidak menyajikan pesan “berbeda-beda”. Media menyajikan informasi <b>konsisten</b>.</div>
<h3>Jawaban latihan</h3>
<p>Amati guru yang melaksanakan pembelajaran terpadu, lalu nilai kegiatan intinya dengan mengingat makna dan prinsip pembelajaran terpadu. Untuk merancang kegiatan inti satu tema: tetapkan kompetensi dasar beberapa mapel yang dapat dipadukan, rumuskan langkah inti, perhatikan prinsip dan faktor tadi, pastikan siswa aktif, berbuat langsung, dan kebutuhan individual maupun kelompok terpenuhi, serta kegiatan bervariasi.</p>

<h1>Kegiatan Belajar 3: Kegiatan Akhir dan Tindak Lanjut</h1>
<h2>Pengantar</h2>
<p>Prosedur terakhir. Tujuannya: <b>memantapkan pemahaman</b> siswa atas kegiatan belajar, <b>mengetahui keberhasilan</b> siswa, dan memberi <b>tindak lanjut</b> untuk mengembangkan kemampuan yang baru dikuasai. Bersama pendahuluan dan inti, ia penting untuk mencapai standar kompetensi.</p>
<h2>A. Makna kegiatan akhir dan tindak lanjut</h2>
<p><b>Kegiatan akhir</b> bukan sekadar menutup rangkaian pembelajaran. Ia juga untuk memantapkan pemahaman siswa tentang kompetensi dasar dan bahan, serta mengetahui keberhasilan pelaksanaan oleh siswa dan guru. Guru jadi tahu kompetensi yang <b>sudah dan belum</b> dikuasai. Bentuknya: tes (lisan atau tertulis) dan meninjau kembali penguasaan siswa agar siswa mendapat gambaran utuh pokok-pokok materi.</p>
<p><b>Tindak lanjut</b> adalah kegiatan lanjutan berdasarkan <b>proses dan hasil belajar</b> yang dicapai siswa (individual maupun kelas). Contoh: tugas atau latihan di rumah, menjelaskan kembali bahan yang sulit, meminta membaca dari sumber tertentu, memberi motivasi atau bimbingan. Boleh di luar jam pelajaran sesuai alokasi waktu. Tujuannya <b>mengoptimalkan hasil belajar</b>.</p>
<h2>B. Bentuk kegiatan akhir dan tindak lanjut</h2>
<p>Waktunya biasanya singkat (kurang lebih <b>5–10 menit</b>), jadi guru perlu efisien dan boleh berkreasi sesuai situasi.</p>
<h3>1. Kegiatan akhir</h3>
<p><b>a. Meninjau kembali penguasaan siswa.</b> Dua cara: <b>merangkum (menyimpulkan)</b> pokok materi atau <b>membuat ringkasan</b>. Sebaiknya oleh siswa di bawah bimbingan guru. Jika salah atau kurang sempurna, guru membetulkan atau menyempurnakan. <b>4 kriteria:</b> (1) berorientasi pada acuan hasil belajar dan kompetensi dasar; (2) singkat, jelas, bahasa (tulis/lisan) mudah dipahami; (3) tidak keluar dari topik; (4) memakai waktu sesingkat mungkin. Kegiatan ini bisa dilakukan sepanjang pembelajaran, pada setiap penggal atau setelah satu topik. Berguna bagi siswa yang tidak punya buku sumber atau <b>lambat belajar</b> karena bisa mempelajarinya kembali.</p>
<p><b>b. Melaksanakan penilaian.</b> Guru perlu mampu mengembangkan alat evaluasi. Tes di akhir pembelajaran disebut <b>tes akhir (<i>post-test</i>)</b>, untuk mengetahui penguasaan materi yang dipelajari. Waktu singkat: guru bisa menunjuk beberapa siswa kelompok lambat belajar (<i>slow learner</i>) menjawab lisan atau membuat kesimpulan. Waktu cukup: penilaian tertulis. Guru perlu kreatif. Penilaian tidak selalu di akhir; bisa saat proses lewat <b>penilaian alternatif (<i>alternative assessment</i>)</b> yang dibahas di Modul 5.</p>
<h3>2. Tindak lanjut pembelajaran</h3>
<p>Dilakukan berdasarkan hasil kegiatan akhir. Tujuannya mengoptimalkan hasil belajar dalam bentuk <b>pengayaan (<i>enrichment</i>)</b> dan <b>perbaikan (<i>remedial</i>)</b>.</p>
<div class="tw"><table><tr><th>Istilah</th><th>Untuk siapa</th></tr><tr><td><i>Enrichment</i> (pengayaan)</td><td>Siswa yang <b>telah mencapai kompetensi</b>: meningkatkan atau mengoptimalkan penguasaan</td></tr><tr><td><i>Remedial</i> (perbaikan)</td><td>Siswa yang <b>belum menguasai</b> kompetensi</td></tr></table></div>
<p><b>Lima alternatif:</b></p>
<p><b>a. Memberikan pekerjaan rumah (<i>homework</i>).</b> Tugas/latihan untuk meningkatkan atau memantapkan penguasaan. Perhatikan waktu dan kemampuan siswa. Tugas berlebihan membuat siswa <b>frustrasi</b> dan menurunkan motivasi dan minat. Pemberian tugas harus berdasar perencanaan yang <b>jelas, efektif, fleksibel, dan terpadu</b>, berorientasi kompetensi, bermanfaat, dan diintegrasikan dengan mapel lain. <b>6 hal yang diperhatikan:</b></p>
<ol><li>Tentukan dan jelaskan singkat topik/tema tugas.</li><li>Jelaskan tahapan tugas berdasarkan lembar tugas; beri gambaran alternatif penyelesaian.</li><li>Beri kesempatan bertanya; tegaskan kriteria dan batas waktu.</li><li>Jelaskan proses penyelesaian: di rumah atau di sekolah.</li><li>Minta menyerahkan dan mengerjakan sesuai kriteria.</li><li>Periksa dan bahas setiap tugas; beri balikan. Bisa lewat presentasi dan diskusi untuk memotivasi.</li></ol>
<p><b>b. Membahas kembali bahan yang dianggap sulit.</b> Pertimbangkan waktu. Penjelasan singkat: saat itu juga sebelum jam berakhir. Butuh waktu panjang: di luar jam pelajaran. Untuk pertemuan berikutnya, buat desain tindak lanjut berisi rumusan tujuan/kompetensi, kegiatan belajar, evaluasi, dan sumber belajar, berdasarkan hasil penilaian.</p>
<p><b>c. Menugaskan membaca materi tertentu</b> dari sumber bacaan yang ditetapkan, sesuai pokok materi. Beri <b>pertanyaan pengarah</b> sebagai pedoman, dan minta <b>laporan hasil bacaan</b>. Sulit dilakukan di <b>kelas rendah (kelas 1 dan 2)</b> karena siswa belum dapat membaca dengan baik.</p>
<p><b>d. Memberikan motivasi atau bimbingan belajar.</b> Beri balikan dan bimbingan, baik kepada yang berhasil maupun yang belum, lewat <b>penguatan (<i>reinforcement</i>)</b> verbal maupun nonverbal, dengan kata afirmatif, misalnya: “Kamu pasti bisa!”, “Semua pasti mampu melakukannya!”, “Jangan takut salah, Ibu akan membimbingmu!”. Bimbingan berupa arahan atau petunjuk jelas agar siswa memperbaiki kekurangan atau meningkatkan penguasaan, dan menumbuhkan semangat belajar. Penguatan dibahas lebih rinci di Modul 3.</p>
<p><b>e. Mengemukakan topik untuk pertemuan berikutnya.</b> Beri gambaran topik atau tema pertemuan berikutnya untuk membimbing belajar di luar jam pelajaran, supaya siswa membaca lebih dulu dan pemahaman lebih mudah dalam waktu singkat.</p>

<h1>Kegiatan Belajar 1: Keterampilan Membuka dan Menutup Pelajaran</h1>
<h2>Pengantar modul</h2>
<p>Agar bisa mengajar terpadu, guru SD perlu tiga jenis kemampuan: <b>kognitif</b> (penguasaan kaitan antarmapel, pengetahuan cara belajar dan mengajar, cara mengevaluasi proses dan hasil belajar), <b>sikap</b> (kesiapan dan kesediaan: menghargai pekerjaan, mencintai dan senang pada tema pembelajaran, toleransi pada siswa, kemauan keras meningkatkan hasil kerja), dan <b>keterampilan</b> (menguasai berbagai keterampilan mengajar). Modul 3 membahas manfaat, komponen, dan prinsip tiga pasang keterampilan: <b>KB 1</b> membuka dan menutup pelajaran, <b>KB 2</b> menjelaskan dan bertanya, <b>KB 3</b> memberi penguatan dan mengadakan variasi.</p>
<div class="ing"><b>💡 Ingat:</b> kemampuan guru = <b>K-S-K</b> (Kognitif, Sikap, Keterampilan).</div>
<h2>A. Pengertian</h2>
<p>Membuka dan menutup pelajaran adalah dua keterampilan dasar yang harus dikuasai dalam pendekatan apa pun, bukan hanya terpadu.</p>
<ul><li><b>Membuka pelajaran:</b> keterampilan guru dalam <b>memulai</b> kegiatan pembelajaran.</li><li><b>Menutup pelajaran:</b> keterampilan guru dalam <b>mengakhiri</b> kegiatan pembelajaran.</li><li>Tidak hanya di awal dan akhir, tetapi bisa <b>beberapa kali</b>, yaitu di awal dan akhir setiap <b>penggal</b> kegiatan. Contoh: satu tema punya beberapa topik, maka tiap topik dibuka dan ditutup.</li><li>Kaitannya dengan Modul 2: membuka = <b>menyiapkan siswa memasuki kegiatan inti</b>. Menutup = <b>kegiatan akhir</b> untuk memantapkan atau menindaklanjuti tema.</li><li>Keduanya <b>bukan kegiatan administratif</b> (mengisi daftar hadir, menyiapkan alat dan media). Keduanya berkaitan <b>langsung dengan pembahasan materi</b>.</li></ul>
<div class="warn"><b>⚠️ Jebakan:</b> mengecek kehadiran dan menyiapkan media/alat itu <b>administratif</b>, bukan arah keterampilan membuka pelajaran.</div>
<h2>B. Manfaat</h2>
<div class="tw"><table><tr><th>Keterampilan</th><th>Manfaat</th></tr>
<tr><td><b>Membuka</b> (4)</td><td>1. Menyiapkan <b>mental</b> siswa memasuki kegiatan inti.<br>2. Membangkitkan <b>motivasi dan perhatian</b> (<i>attention</i>).<br>3. Memberi gambaran jelas tentang aktivitas belajar dan <b>batas-batas tugas</b>.<br>4. Menyadarkan keterkaitan antara <b>pengalaman</b> yang dimiliki dengan tema yang dipelajari.</td></tr>
<tr><td><b>Menutup</b> (3)</td><td>1. Memantapkan pemahaman siswa terhadap <b>proses dan hasil</b> belajar.<br>2. Mengetahui <b>tingkat keberhasilan</b> pembelajaran terpadu.<br>3. Menetapkan <b>kegiatan tindak lanjut</b> untuk mengembangkan kompetensi yang telah dikuasai.</td></tr></table></div>
<p>Akibat lalai: jika tidak dibuka dan langsung ke inti, banyak siswa <b>belum siap</b>. Jika lupa menutup sebelum meninggalkan kelas, siswa maupun guru <b>tidak tahu keberhasilan</b> pembelajaran. Kompetensi siswa jadi kurang optimal.</p>
<div class="ing"><b>💡 Ingat:</b> menyiapkan mental = <b>membuka</b>. Menetapkan tindak lanjut = <b>menutup</b>. Jangan tertukar!</div>
<h2>C. Komponen keterampilan membuka pelajaran (4)</h2>
<h3>1. Menumbuhkan perhatian siswa</h3>
<p>Perhatian = pemusatan energi psikis pada objek yang dipelajari. Menarik perhatian adalah <b>langkah awal</b> membuka pelajaran. Caranya:</p>
<ol type="a"><li><b>Variasi gaya mengajar:</b> suara rendah ke tinggi (atau sebaliknya), mengubah posisi (depan, tengah, belakang), gerakan tubuh dan mimik muka. Rinciannya di KB 3.</li><li><b>Media yang tepat dan menarik:</b> misalnya gambar menarik yang mengundang keinginan bertanya.</li><li><b>Pola interaksi bervariasi:</b> klasikal, kelompok kecil, atau individual. Pola monoton menurunkan perhatian.</li></ol>
<h3>2. Membangkitkan motivasi siswa</h3>
<p>Dilakukan di setiap awal kegiatan atau awal penggal kegiatan.</p>
<div class="tw"><table><tr><th>Cara</th><th>Penjelasan dan contoh</th></tr>
<tr><td>a. Sikap <b>hangat dan antusias</b></td><td>Awal munculnya keinginan belajar. Sikap hangat bersahabat dan penuh semangat memengaruhi tinggi rendahnya motivasi.</td></tr>
<tr><td>b. Menimbulkan <b>rasa ingin tahu</b> (<i>curiosity</i>)</td><td>Mendorong siswa berbuat agar rasa ingin tahunya terpenuhi. Caranya: cerita atau dongeng yang mengundang pertanyaan, menunjukkan sesuatu yang baru, atau gambar menarik lalu diikuti pertanyaan.</td></tr>
<tr><td>c. Mengemukakan <b>ide yang bertentangan</b></td><td>Menggugah siswa bertanya atau berpendapat. Guru harus kreatif mencari ide yang berkaitan dengan kehidupan sehari-hari dan tema. Contoh: tema pekerjaan, hidup di kota besar sangat keras tetapi mengapa banyak orang pindah ke sana? Tema transportasi, mobil bisa bergerak tetapi bukan makhluk hidup seperti manusia.</td></tr>
<tr><td>d. Memperhatikan <b>minat</b> siswa</td><td>Minat erat dengan keinginan mempelajari tema. Dipengaruhi <b>latar belakang sosial, jenis kelamin, umur, dan lingkungan</b>.</td></tr></table></div>
<h3>3. Memberi acuan</h3>
<p>Memberi <b>gambaran singkat</b> tentang tema yang akan dipelajari.</p>
<ol type="a"><li><b>Mengemukakan tujuan dan batas tugas:</b> kompetensi dasar yang harus dikuasai, ruang lingkup tema, dan batas tugas siswa, dengan bahasa yang dipahami siswa.</li><li><b>Menjelaskan langkah pembelajaran:</b> contoh siswa kelas 6 yang akan melakukan percobaan, guru menuliskan dulu langkah-langkahnya.</li><li><b>Mengingatkan inti tema:</b> siswa diingatkan menemukan hal-hal <b>positif dan negatif</b> dari tema.</li><li><b>Mengajukan pertanyaan:</b> mempersiapkan siswa mengantisipasi bahan ajar. Contoh: sebelum demonstrasi mencangkok batang pohon.</li></ol>
<h3>4. Membuat kaitan</h3>
<p>Pembelajaran lebih bermakna bila dikaitkan dengan pengetahuan yang sudah dimiliki. Upaya mengaitkan bahan yang sudah disampaikan dengan yang akan disampaikan disebut <b>apersepsi</b> (<i>apperception</i>), dilakukan di kegiatan awal. Caranya: meninjau kembali pemahaman siswa tentang aspek yang sudah diketahui, menunjukkan kaitan materi baru dengan materi yang mungkin sudah diketahui, atau bila konsep sama sekali baru, konsep itu <b>dijelaskan dahulu secara rinci</b>.</p>
<div class="ing"><b>💡 Ingat:</b> membuka = <b>P-M-A-K</b> (Perhatian, Motivasi, Acuan, Kaitan). Motivasi: <b>H-R-I-M</b> (Hangat, Rasa ingin tahu, Ide bertentangan, Minat). Acuan: <b>T-L-I-P</b> (Tujuan, Langkah, Inti tema, Pertanyaan).</div>
<h2>D. Komponen keterampilan menutup pelajaran (2)</h2>
<h3>1. Meninjau kembali (<i>review</i>)</h3>
<p>Di setiap akhir penggal kegiatan, guru meninjau penguasaan siswa dengan <b>menetapkan topik inti</b> dan/atau <b>membuat ringkasan</b>. Misalnya selesai satu topik, guru meminta siswa menetapkan topik inti, lalu guru mengarahkan atau meluruskan pendapat siswa. Untuk memantapkan, tulis di papan tulis dan/atau siswa mencatat di buku catatan sebagai ringkasan. Ringkasan berguna terutama bagi siswa yang <b>tidak memiliki buku sumber</b>.</p>
<h3>2. Melakukan penilaian</h3>
<p>Untuk melihat tingkat penguasaan kompetensi. Karena waktu sangat terbatas, bentuknya antara lain:</p>
<ol type="a"><li>Tanya jawab lisan dengan beberapa siswa yang dianggap <b>mewakili</b> seluruh siswa.</li><li>Meminta siswa <b>menunjukkan kemampuan</b>, misalnya menunjukkan gambar yang dibuat atau membacakan puisi yang baru ditulis.</li><li>Meminta siswa <b>mengaplikasikan hasil belajar</b> di depan kelas, misalnya menyelesaikan soal matematika dengan rumus yang baru dipelajari.</li><li>Meminta siswa <b>menyatakan pendapat</b> tentang bahan dan kegiatan belajar, perorangan atau kelompok.</li><li>Memberi <b>soal tertulis</b> yang dikerjakan di luar kelas atau di-PR-kan (<i>take-home examination</i>).</li></ol>
<h2>Prinsip penerapan (2)</h2>
<div class="tw"><table><tr><th>Prinsip</th><th>Isi</th></tr>
<tr><td><b>Kebermaknaan</b> (<i>meaningful</i>)</td><td>Kegiatan harus bernilai tinggi bagi seluruh siswa, <b>relevan dengan tema dan kompetensi dasar</b>, sesuai karakteristik dan perkembangan siswa. Cara dibuat-buat, seperti lelucon yang tidak berhubungan dengan tema, menghabiskan waktu dan <b>kontra produktif</b>. Pertanyaan di luar inti pelajaran pun sama.</td></tr>
<tr><td><b>Kesinambungan dan keutuhan</b></td><td>Keterampilan ini bagian utuh dari kemampuan guru, bukan kegiatan lepas-lepas. Guru menjaga kesinambungan antarketerampilan, menyusun langkah yang <b>sinambung dengan minat, pengalaman, dan kemampuan siswa</b>, dan jelas kaitan antarkegiatan. Contoh: cerita di awal pelajaran sengaja dikaitkan dengan topik inti tema.</td></tr></table></div>
<div class="ing"><b>💡 Ingat:</b> menutup = <b>R-P</b> (Review + Penilaian). Prinsip = <b>makna</b> (relevan tema) dan <b>sambung</b> (sesuai minat, pengalaman, kemampuan siswa).</div>
<h3>Arah jawaban latihan</h3>
<p>Diskusikan bentuk kegiatan membuka dan menutup lain agar punya banyak variasi, rancang skenario (tentukan tema dan langkah belajar), simulasikan dengan teman, catat kelebihan dan kekurangan. Ingat kembali komponen dan prinsip di atas.</p>

<h1>Kegiatan Belajar 2: Keterampilan Menjelaskan dan Bertanya</h1>
<h2>A. Pengertian</h2>
<p><b>Menjelaskan</b> (<i>to explain</i>) berbeda dengan <b>menceritakan</b>. Menjelaskan = membuat sesuatu menjadi <b>jelas</b>. Menceritakan = hanya memberi informasi tanpa menjelaskannya. Dalam menjelaskan, informasi disampaikan <b>sistematis</b> sehingga penerima punya gambaran jelas tentang hubungan antarinformasi, misalnya:</p>
<ul><li>informasi baru dengan informasi yang sudah diketahui,</li><li>hubungan sebab-akibat,</li><li>hubungan teori dan praktik,</li><li>hubungan dalil-dalil dengan contoh konkret.</li></ul>
<p>Dalam pembelajaran terpadu, penjelasan harus berpengaruh <b>langsung</b> pada pemahaman siswa akan tema.</p>
<p><b>Bertanya</b> = kemampuan guru <b>memperoleh informasi</b> tentang objek yang ditanyakan dan <b>meningkatkan interaksi</b> pembelajaran yang efektif. Dalam pembelajaran terpadu bertanya perlu lebih sering dimunculkan untuk merangsang kegiatan siswa <b>berkadar aktivitas tinggi</b>. Pertanyaan yang jelas mendapat jawaban yang jelas. Pertanyaan yang diajukan dengan kehangatan dan simpati mendapat respons berbeda dari pertanyaan yang dingin dan tak acuh.</p>
<div class="ing"><b>💡 Ingat:</b> menjelaskan = <b>membuat jelas</b> (bukan sekadar bercerita). Bertanya = <b>menggali informasi</b> + <b>interaksi</b>.</div>
<h2>B. Manfaat</h2>
<p>Alasan: pembelajaran terpadu berpusat pada siswa (subjek belajar) dan memakai pengalaman langsung yang konkret sebagai dasar memahami yang abstrak. Dua keterampilan ini membantu guru mengarahkan siswa sesuai ciri itu.</p>
<div class="tw"><table><tr><th>Menjelaskan (7 manfaat)</th><th>Bertanya (7 manfaat)</th></tr><tr><td>1. Membantu siswa memahami berbagai <b>konsep</b> tema<br>2. Meningkatkan keterlibatan siswa memecahkan masalah dengan cara berpikir <b>sistematis dan terintegrasi</b><br>3. <b>Memperkirakan tingkat pemahaman</b> siswa<br>4. Meningkatkan efektivitas pembicaraan di kelas sehingga penjelasan bermakna<br>5. Membantu siswa <b>menggali pengetahuan dari berbagai sumber</b><br>6. Mengatasi kekurangan sumber belajar<br>7. Memakai waktu lebih efektif dan efisien</td><td>1. Mengarahkan siswa lebih aktif mempelajari tema dari berbagai aspek secara terintegrasi<br>2. Kegiatan belajar lebih <b>bervariasi dan bermakna</b><br>3. Mendorong siswa <b>berperan sebagai sumber informasi</b><br>4. Memupuk <b>kebiasaan bertanya</b><br>5. Meningkatkan keterlibatan <b>mental-intelektual</b><br>6. Menumbuhkan <b>keberanian</b> bertanya<br>7. <b>Menguji pemahaman</b> siswa terhadap materi</td></tr></table></div>
<p><b>Mengapa bertanya penting bagi guru SD:</b> guru masih cenderung mendominasi kelas dengan ceramah dan menjadi sumber informasi utama, siswa dianggap penerima pesan, sehingga siswa kurang aktif dan tidak berani mempertanyakan keraguannya. Masyarakat juga belum membiasakan anak bertanya, dan kesempatan bertanya dari guru jarang dimanfaatkan. Selain itu, belajar menuntut keaktifan <b>mental</b>: intelektual (berpikir) dan emosional (merasakan).</p>
<div class="warn"><b>⚠️ Jebakan:</b> “menggali pengetahuan dari berbagai sumber” = manfaat <b>menjelaskan</b>. “Menguji pemahaman, sumber informasi, kebiasaan bertanya” = manfaat <b>bertanya</b>.</div>
<h2>C. Komponen keterampilan menjelaskan</h2>
<h3>Perencanaan (sebelum menjelaskan)</h3>
<p>Dua hal: merencanakan <b>isi tema</b> dan menganalisis <b>karakteristik siswa</b>.</p>
<p><b>Isi tema</b> yang akan dijelaskan: (modul menyebut “tiga hal”, namun memuat empat butir)</p>
<ol><li>Dianalisis secara keseluruhan, termasuk unsur terkait.</li><li>Mencerminkan <b>inti/esensi kompetensi dasar dan indikator</b> masing-masing mapel.</li><li>Punya <b>signifikansi</b> (keberartian) tinggi bagi siswa.</li><li>Bernilai guna bagi kehidupan siswa atau menunjang kecakapan hidup (<i>life skills</i>).</li></ol>
<p><b>Karakteristik siswa</b> yang dianalisis: usia, jenis kelamin, tingkat perkembangan, minat (<i>student interest</i>), taraf kemampuan, latar belakang keluarga, lingkungan belajar. Perbedaan antarsiswa selalu dipertimbangkan.</p>
<h3>Empat komponen penyajian</h3>
<div class="tw"><table><tr><th>Komponen</th><th>Isi</th></tr>
<tr><td><b>1. Kejelasan</b></td><td>a. <b>Kelancaran dan kejelasan ucapan</b>: tidak tersendat, hindari bunyi tak berfungsi (eee, eh, ah, ya) yang diulang-ulang, tidak terlalu cepat.<br>b. <b>Susunan kalimat</b>: tata bahasa baku, Bahasa Indonesia baik dan benar sebagai teladan.<br>c. <b>Penggunaan istilah</b> sesuai perbendaharaan bahasa siswa. Istilah asing yang terpaksa dipakai diberi definisi dengan kata-kata yang dipahami siswa.</td></tr>
<tr><td><b>2. Penggunaan contoh dan ilustrasi</b></td><td>Siswa SD masih berpikir <b>konkret</b>, jadi pakai contoh konkret, atau gambar yang sesuai bila tidak memungkinkan. Konsep sulit dipermudah dengan contoh dari kehidupan nyata siswa. Guru perlu banyak perbendaharaan contoh. Penyajian bisa di <b>awal, saat, atau akhir</b> penjelasan, sesuai karakteristik topik dan siswa.</td></tr>
<tr><td><b>3. Pemberian tekanan</b></td><td>Tekankan <b>inti materi</b> dan keterkaitan antarmateri dalam tema; batasi hal yang kurang terkait. Caranya: <b>variasi gaya mengajar</b> (ubah suara untuk butir penting dengan mimik dan gerakan, misal nada berat sambil menunjuk gambar), <b>struktur penyajian</b> (ikhtisar materi inti, pengulangan hal penting, <b>parafrase</b> = menyatakan kembali dengan kata lain), dan <b>isyarat lisan</b> (“pertama, kedua, ketiga”, “perhatikan ini baik-baik”, “yang terpenting adalah …”, “akhir dari semuanya ini adalah …”).</td></tr>
<tr><td><b>4. Umpan balik (<i>feedback</i>)</b></td><td>Cek pemahaman dengan <b>pertanyaan tentang yang dijelaskan</b> atau <b>mengamati ekspresi wajah</b>. Bila belum paham dan masalahnya teknik menjelaskan: beri lebih banyak contoh, minta siswa mencari contoh sendiri, pakai bahan lebih sederhana, atau ulangi penjelasan. Juga identifikasi <b>sikap dan minat</b> siswa, karena pemahaman tidak terpisah dari minat dan sikap.</td></tr></table></div>
<div class="ing"><b>💡 Ingat:</b> menjelaskan = <b>K-C-T-B</b> (Kejelasan, Contoh, Tekanan, Balikan). Kejelasan = ucapan, kalimat, istilah. Tekanan = gaya, struktur (ikhtisar, ulang, parafrase), isyarat.</div>
<h3>4 prinsip menjelaskan</h3>
<ol><li>Ada <b>keterkaitan erat</b> antara guru (pemberi), siswa (penerima), dan materi tema. Ketiganya terintegrasi sehingga sesuai pengalaman dan latar belakang siswa.</li><li>Dapat diberikan di <b>awal, tengah, atau akhir</b> pembelajaran, tergantung kapan kebutuhan penjelasan muncul.</li><li>Punya tingkat <b>kebermaknaan tinggi</b>: sesuai tujuan/kompetensi dan dapat diterapkan dalam kehidupan siswa.</li><li>Disajikan sesuai <b>perencanaan</b>, tetapi boleh atas dasar kebutuhan yang muncul dari pertanyaan siswa.</li></ol>
<h2>D. Komponen keterampilan bertanya</h2>
<div class="tw"><table><tr><th>Komponen</th><th>Isi dan contoh</th></tr>
<tr><td><b>1. Pengungkapan pertanyaan jelas dan singkat</b></td><td>Struktur kalimat sederhana dan kata yang sudah dikenal. Kalimat terlalu panjang membingungkan. Yang terpenting adalah <b>jawaban</b> siswa, tetapi kualitas jawaban bergantung kualitas pertanyaan. Contoh tema “diri sendiri” (kelas awal): “Siapa namamu?”, “Berapa umurmu?”, “Di mana rumahmu?”, “Apa warna kesukaanmu?”.</td></tr>
<tr><td><b>2. Pemberian acuan</b></td><td>Informasi yang perlu diketahui siswa sebelum menjawab, diberikan di awal atau sewaktu-waktu. Contoh tema “keluarga”: “Kakek adalah bapak dari bapak atau ibu kita. Siapakah yang disebut nenek itu?” (dua kalimat pertama = acuan, kalimat ketiga = pertanyaan).</td></tr>
<tr><td><b>3. Pemusatan</b></td><td>Memfokuskan perhatian pada inti materi lewat pertanyaan yang lingkupnya <b>sempit</b> dan jawaban khusus. Contoh tema “pasar” kelas 5: “Sebutkan sepuluh jenis sayuran yang dijual di pasar” (luas) lalu “sayuran mana yang paling banyak mengandung zat besi?” (terpusat).</td></tr>
<tr><td><b>4. Pemindahan giliran dan penyebaran pertanyaan</b></td><td><b>Pemindahan giliran:</b> satu pertanyaan kompleks dijawab bergilir oleh beberapa siswa yang saling melengkapi atau menanggapi. Mendorong siswa memperhatikan pertanyaan dan jawaban teman serta meningkatkan interaksi antarsiswa. <b>Penyebaran:</b> beberapa pertanyaan berbeda ditujukan ke siswa berbeda, diberikan secara <b>acak</b> agar semua siap mendapat giliran.</td></tr>
<tr><td><b>5. Pemberian waktu berpikir</b></td><td>Pertanyaan diajukan untuk <b>seluruh kelas</b>, lalu <b>tunggu beberapa saat</b> sebelum menunjuk siswa. Hindari menunjuk siswa lebih dulu sebelum pertanyaan diajukan: tidak ada waktu berpikir dan siswa lain tidak memperhatikan.</td></tr>
<tr><td><b>6. Pemberian tuntunan</b></td><td>Jika tidak terjawab atau jawaban tidak sesuai, guru tidak diam menunggu (tidak efisien). Beri tuntunan bertahap: ungkapkan ulang pertanyaan dengan cara lebih mudah, ajukan pertanyaan lebih sederhana yang menuntun, atau ulangi penjelasan sebelumnya.</td></tr></table></div>
<p>Komponen di atas adalah bertanya <b>dasar</b>. Bertanya <b>lanjut</b> (mengubah tuntutan kognitif, mengatur urutan pertanyaan, pertanyaan pelacak, meningkatkan interaksi) <b>tidak dibahas</b> di modul ini karena menguasai bertanya dasar sudah cukup untuk pembelajaran terpadu di SD.</p>
<div class="ing"><b>💡 Ingat:</b> bertanya = <b>J-A-P-P-W-T</b> (Jelas-singkat, Acuan, Pemusatan, Pemindahan giliran/penyebaran, Waktu berpikir, Tuntunan).</div>
<h3>4 prinsip bertanya</h3>
<ol type="a"><li>Disampaikan dengan <b>antusiasme dan kehangatan</b> agar siswa sungguh-sungguh menjawab.</li><li>Hindari kebiasaan yang menurunkan kualitas: <b>mengulangi pertanyaan sendiri, mengulangi jawaban siswa, menjawab sendiri, memancing jawaban serentak, pertanyaan ganda, menentukan siswa penjawab sebelum pertanyaan diajukan</b>.</li><li>Pertanyaan kompleks butuh <b>waktu berpikir cukup lama</b>.</li><li>Pertanyaan pokok disiapkan cermat: tingkat kesukaran, ketuntasan cakupan materi, jumlah dan kualitas pertanyaan.</li></ol>
<h3>Arah jawaban latihan</h3>
<p>Diskusikan bentuk kegiatan menjelaskan dan bertanya lainnya, rancang skenario dengan tema dan langkah belajar, simulasikan dengan teman, catat kelebihan dan kekurangan. Ingat komponen dan prinsip di atas.</p>
<h2>Sering keluar di ujian (KB 2)</h2>
<div class="tw"><table><tr><th>Jebakan</th><th>Yang benar</th></tr>
<tr><td>Menjelaskan sama dengan menceritakan</td><td>Beda: menjelaskan = membuat <b>jelas</b>, menceritakan = hanya memberi informasi</td></tr>
<tr><td>Guru harus menjelaskan karena tanpa guru siswa tak dapat pengetahuan baru</td><td>Karena siswa perlu gambaran jelas <b>hubungan pengetahuan baru dan yang sudah diketahui</b></td></tr>
<tr><td>Bertanya = melatih keberanian / interaksi antarsiswa / guru tahu pemahaman</td><td>Maksud utama: <b>merangsang kegiatan siswa berkadar aktivitas tinggi</b></td></tr>
<tr><td>Manfaat menjelaskan = menguji pemahaman / sumber informasi / kebiasaan bertanya</td><td>Itu manfaat bertanya. Menjelaskan = <b>menggali pengetahuan dari berbagai sumber</b></td></tr>
<tr><td>Isi tema sesuai kemudahan guru / sarana</td><td>Isi tema <b>mencerminkan esensi kompetensi dasar</b></td></tr>
<tr><td>Merencanakan penjelasan = indikator / contoh / tekanan</td><td>= <b>menetapkan isi tema dan menganalisis karakteristik siswa</b></td></tr>
<tr><td>Kalimat baku = penggunaan istilah / ilustrasi / tekanan</td><td>= aspek <b>kejelasan</b></td></tr>
<tr><td>Ingin tahu siswa paham = struktur penyajian / contoh</td><td>= <b>umpan balik</b> lewat jawaban siswa</td></tr>
<tr><td>Pertanyaan singkat jelas = acuan / pemusatan / kata kurang dikenal</td><td>= <b>struktur kalimat sederhana</b></td></tr>
<tr><td>Agar siswa memperhatikan pertanyaan = penyebaran / waktu berpikir</td><td>= <b>pemindahan giliran</b></td></tr>
<tr><td>Prinsip bertanya: mengulang dan menjawab sendiri, memancing serentak</td><td>Itu kebiasaan yang <b>dihindari</b>. Prinsip = antusias dan hangat</td></tr></table></div>
<h2>Letak materi di modul (Modul 3, KB 2)</h2>
<div class="tw"><table><tr><th>Bagian</th><th>Halaman</th></tr><tr><td>A. Pengertian</td><td>3.16</td></tr><tr><td>B. Manfaat</td><td>3.17–3.18</td></tr><tr><td>C. Komponen menjelaskan (perencanaan)</td><td>3.18–3.19</td></tr><tr><td>Kejelasan, contoh, tekanan</td><td>3.19–3.21</td></tr><tr><td>Umpan balik dan prinsip menjelaskan</td><td>3.21–3.22</td></tr><tr><td>D. Komponen bertanya</td><td>3.23–3.26</td></tr><tr><td>Prinsip bertanya, Latihan</td><td>3.26–3.27</td></tr><tr><td>Rangkuman</td><td>3.27</td></tr><tr><td>Tes Formatif 2, Kunci</td><td>3.28–3.30, 3.49</td></tr></table></div>
