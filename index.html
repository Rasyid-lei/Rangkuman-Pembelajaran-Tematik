<h1>Kegiatan Belajar 3: Keterampilan Memberi Penguatan dan Variasi</h1>
<h2>A. Pengertian</h2>
<p><b>Penguatan (<i>reinforcement</i>)</b> = <b>respons yang diberikan guru terhadap perilaku siswa yang dianggap positif</b>, yang membuat perilaku itu mungkin <b>berulang atau meningkat</b>. Contoh sehari-hari: penjual jam tangan memberi kalender sebagai hadiah (agar pembeli kembali atau mengajak orang lain), ibu memuji anak yang membereskan tempat tidurnya (agar jadi kebiasaan). Respons positif guru membuat siswa senang dan cenderung mengulang. Guru harus melatih diri secara teratur dan terarah.</p>
<p><b>Mengadakan variasi</b> = <b>mengubah suatu keadaan supaya tidak monoton, membosankan, atau menjenuhkan</b>. Berkaitan dengan <b>gaya mengajar</b> (<i>teaching style</i>), <b>penggunaan alat dan media</b>, dan <b>pola interaksi</b> pembelajaran. Bisa dikaitkan dengan keterampilan lain (variasi membuka-menutup, menjelaskan, bertanya, memberi penguatan), sehingga variasi adalah <b>akumulasi dari semua keterampilan mengajar</b>. Bila guru mengajar selalu dengan cara yang sama, siswa bosan dan hasil belajar menurun.</p>
<div class="ing"><b>💡 Ingat:</b> penguatan = respons guru pada perilaku <b>positif</b> siswa. Variasi = mengubah keadaan supaya <b>tidak membosankan</b>.</div>
<h2>B. Manfaat</h2>
<div class="tw"><table><tr><th>Memberi penguatan (5)</th><th>Mengadakan variasi (6)</th></tr><tr><td>1. Membangkitkan dan memelihara <b>perhatian dan motivasi</b> terhadap tema<br>2. Memudahkan siswa mempelajari isi tema yang dianggap <b>sulit</b><br>3. <b>Mengontrol dan memodifikasi tingkah laku</b> siswa, mendorong tingkah laku positif<br>4. Menumbuhkan <b>rasa percaya diri</b> dan keberanian mengungkapkan pendapat<br>5. Memelihara <b>iklim kelas</b> (<i>classroom climate</i>) yang kondusif</td><td>1. Menumbuhkan dan meningkatkan <b>motivasi dan perhatian</b> (<i>attention</i>) terhadap tema dan keterkaitannya<br>2. Kesempatan mengembangkan <b>rasa ingin tahu</b> (<i>curiosity</i>)<br>3. Memupuk <b>perilaku positif siswa terhadap guru</b> yang mengajar lebih hidup dan bervariasi<br>4. <b>Menghindarkan</b> siswa dari pembelajaran <b>membosankan dan monoton</b><br>5. Meningkatkan <b>keaktifan dan keterlibatan</b> siswa<br>6. Melayani <b>karakteristik siswa dan gaya belajar</b> (<i>learning style</i>) yang beraneka ragam</td></tr></table></div>
<div class="warn"><b>⚠️ Jebakan:</b> “menumbuhkan rasa percaya diri”, “mengontrol tingkah laku”, dan “mengulang dan meningkatkan perilaku positif” = manfaat/makna <b>penguatan</b>. “Menghindarkan proses monoton” = manfaat <b>variasi</b>.</div>
<h2>C. Komponen keterampilan memberi penguatan</h2>
<h3>1. Penguatan verbal (<i>verbal reinforcement</i>)</h3>
<p>Paling sederhana: hanya <b>kata-kata atau kalimat</b>, namun salah waktu atau salah pilih kata berefek buruk. Bentuk: pujian, dukungan, pengakuan, dorongan; biasanya berupa balikan bagi siswa. Contoh: “Wah, pekerjaanmu baik sekali!”, “Bapak senang sekali dengan hasil karyamu!”, “Belum pernah Bapak melihat pekerjaan serapi ini!”. Dukungan: “Jika kamu mau belajar lebih giat lagi, pasti hasil karyamu akan lebih baik!”. Contoh Irfan membacakan puisi: “Oh, bagus sekali!”, “Ibu akui, kamu memang sangat pintar membacakan puisi!”, dilanjutkan dorongan bagi siswa lain: “Anak-anak lain perlu meniru cara Irfan membacakan puisi!”.</p>
<div class="tw"><table><tr><th>Jawaban siswa</th><th>Respons guru</th></tr><tr><td><b>Benar</b></td><td>“Ya, benar!”, “Tepat sekali jawabanmu!”</td></tr><tr><td><b>Kurang tepat</b></td><td>Jangan langsung menyalahkan. Beri <b>penguatan tak penuh (partial)</b>: “Ya, jawabanmu sudah baik, tetapi masih perlu disempurnakan sedikit lagi!” Siswa tahu jawabannya tidak seluruhnya salah dan masih ada kesempatan.</td></tr><tr><td><b>Sama sekali salah</b></td><td>Jangan langsung menyalahkan. Bijaksana mengatakan “bagus!” sebagai penghargaan atas <b>keberanian mencoba</b>.</td></tr></table></div>
<h3>2. Penguatan non-verbal (<i>non-verbal reinforcement</i>)</h3>
<p>Tidak lewat kata-kata. Jenisnya: raut wajah/mimik, gerakan/isyarat badan (<i>gestural</i>), gerak mendekati siswa (<i>proximity</i>), sentuhan (<i>contact</i>), kegiatan yang menyenangkan, simbol/tanda (<i>token</i>), dan benda/barang.</p>
<div class="tw"><table><tr><th>Jenis</th><th>Penjelasan dan contoh</th></tr>
<tr><td><b>a. Mimik dan gerakan badan</b></td><td>Raut wajah dan gerakan dipakai bersama untuk mengomunikasikan <b>kepuasan</b> guru. Contoh: senyuman, anggukan, tepukan tangan, acungan ibu jari. Bisa digabung dengan verbal (“bagus” sambil tersenyum, mengangguk, mengangkat ibu jari).</td></tr>
<tr><td><b>b. Gerak mendekati</b> (<i>proximity</i>)</td><td>Guru mendekati siswa untuk menunjukkan <b>perhatian dan rasa senang</b> pada perilaku, hasil kerja, atau penampilan. Dilakukan <b>luwes, tidak dibuat-buat</b>: melangkah mendekat, berdiri di samping siswa/kelompok, atau duduk bersama. Biasanya bersama verbal. <b>Frekuensinya dibatasi</b> agar efeknya tidak menurun.</td></tr>
<tr><td><b>c. Sentuhan</b> (<i>contact</i>)</td><td>Menyatakan <b>persetujuan dan penghargaan</b>: menepuk bahu/pundak, menjabat tangan dengan antusias, mengangkat tangan siswa yang berhasil. Perhatikan <b>kepatutan menurut umur, jenis kelamin, dan nilai budaya setempat</b>. Contoh: guru pria menepuk bahu atau mengelus rambut siswa perempuan mungkin hanya pantas di kelas awal, sedangkan di kelas tinggi dianggap berlebihan.</td></tr>
<tr><td><b>d. Kegiatan yang menyenangkan</b></td><td>Sesuai ciri pembelajaran terpadu yang <b>joyful learning</b> (bukan <i>joyless learning</i>). Hobi/kegemaran siswa jadi penguatan. Contoh: siswa berprestasi Seni Musik memimpin paduan suara saat upacara bendera; siswa gemar menggambar melukis gapura sekolah untuk Hari Kemerdekaan; siswa yang lebih dulu menyelesaikan hitungan Matematika membantu teman yang kesulitan; siswa berprestasi olahraga ikut tim PORSENI tingkat kecamatan.</td></tr>
<tr><td><b>e. Simbol dan benda</b> (<i>token</i>)</td><td>Simbol: tanda cek (✓) dan tanda tangan guru dengan komentar singkat pada tugas tertulis. Benda bermakna simbolis: guntingan <b>bintang</b> warna-warni, <b>emblem/lencana</b> prestasi, <b>piala bergilir</b>. Benda berguna sebagai hadiah (<i>reward</i>): pensil, bolpoin, penghapus, buku tulis, mistar. <b>Jangan terlalu sering</b> agar tidak kehilangan makna dan tidak menjadi target akhir imbalan.</td></tr></table></div>
<h3>6 prinsip pemberian penguatan</h3>
<ol><li><b>Hangat dan antusias</b>: wajah berseri, senyum, riang, penuh perhatian, sungguh-sungguh. Hindari lesu, acuh tak acuh, murung.</li><li><b>Bermakna</b>: menunjukkan hal yang <b>sebenarnya dikuasai</b> siswa. Jangan membohongi dengan pujian.</li><li>Hindari <b>respons negatif</b>: kata kasar, cercaan, hukuman, hinaan, ejekan, apalagi hukuman fisik (mencubit, menampar, memukul).</li><li><b>Sasaran jelas</b>: pribadi (<i>personal reinforcement</i>), satu kelompok, atau seluruh kelas.</li><li><b>Segera</b> setelah respons yang diharapkan, tanpa waktu tunggu.</li><li><b>Bervariasi</b>, tidak monoton. Verbal dan non-verbal diatur merata, guru kreatif mencari variasi baru.</li></ol>
<div class="ing"><b>💡 Ingat:</b> enam prinsip = <b>H-B-N-S-S-V</b> (Hangat, Bermakna, hindari Negatif, Sasaran, Segera, Variasi). Non-verbal = <b>M-G-S-K-S</b>: Mimik-gerakan, Gerak mendekati, Sentuhan, Kegiatan menyenangkan, Simbol-benda.</div>
<h2>D. Komponen keterampilan mengadakan variasi</h2>
<p>Tiga hal: variasi <b>gaya mengajar</b>, <b>pola interaksi</b>, dan <b>penggunaan media</b>.</p>
<h3>1. Variasi gaya mengajar (6)</h3>
<div class="tw"><table><tr><th>Bentuk</th><th>Isi</th></tr>
<tr><td>a. <b>Variasi suara</b></td><td>Nada keras ke lemah, tinggi ke rendah, cepat ke lambat, gembira ke sedih. Mengurangi kejenuhan, terutama kelas awal. Suara adalah <b>modal utama</b> guru. Bisa menirukan suara binatang atau kendaraan (tema binatang, transportasi).</td></tr>
<tr><td>b. <b>Pemusatan perhatian</b></td><td>Ungkapan verbal: “Perhatikan baik-baik!”, “Ini penting untuk diingat!”, “Dengarkan dengan baik!”, “Ini penting untuk kehidupanmu!”, bisa dengan isyarat menunjuk gambar.</td></tr>
<tr><td>c. <b>Kesenyapan</b></td><td>Guru berhenti atau diam sejenak saat kelas gaduh, sehingga siswa penasaran dan tenang. Juga sebagai <b>waktu tunggu</b> setelah mengajukan pertanyaan agar siswa berpikir.</td></tr>
<tr><td>d. <b>Kontak pandang</b></td><td>Meningkatkan <b>intensitas interaksi</b> guru-siswa. Pandangan menjelajah seluruh kelas dan melihat mata siswa; memandang seluruh kelas saat mulai bicara, lalu siswa tertentu untuk mengecek pemahaman atau perhatian khusus. Memandang siswa yang berbicara = penuh perhatian.</td></tr>
<tr><td>e. <b>Gerakan badan dan mimik</b></td><td>Ekspresi: tersenyum, mengerutkan dahi, cemberut, menaikkan alis. Gerakan: mengangguk/menggeleng, menggoyang tangan, mengangkat bahu, mendekati siswa, mengepalkan tinju, mengangkat ibu jari, bertepuk tangan. Sesuaikan dengan sikap dan pembawaan guru agar tidak dibuat-buat.</td></tr>
<tr><td>f. <b>Perubahan posisi guru</b></td><td>Tidak terpaku di satu tempat: berdiri di depan, duduk di kursi guru, ke samping, tengah, belakang; berjalan di antara siswa atau duduk di sebelah siswa. Wajar, tidak berlebihan.</td></tr></table></div>
<div class="ing"><b>💡 Ingat:</b> gaya mengajar = <b>S-P-K-K-G-P</b> (Suara, Pemusatan, Kesenyapan, Kontak pandang, Gerakan-mimik, Posisi).</div>
<h3>2. Variasi pola interaksi (3)</h3>
<div class="tw"><table><tr><th>Pola</th><th>Ciri</th></tr>
<tr><td><b>Satu arah</b> (<i>one-way traffic</i>)</td><td>Guru menjelaskan kepada seluruh siswa, siswa <b>mendengarkan dan menyimak</b>. Metode <b>ceramah/penuturan</b>. Dipakai bila materi <b>cukup sulit</b> dan perlu dijelaskan terperinci dan tuntas supaya tidak salah paham konsep.</td></tr>
<tr><td><b>Dua arah</b> (<i>two-way traffic</i>)</td><td>Pengembangan pola pertama dengan <b>tanya jawab</b>. Siswa tidak hanya menyimak tetapi mengajukan pertanyaan. Guru menerapkan komponen keterampilan bertanya (KB 2).</td></tr>
<tr><td><b>Banyak arah</b> (<i>multi-way traffic</i>)</td><td>Aktivitas siswa paling tinggi: interaksi guru-siswa <b>dan antarsiswa</b>. Guru = <b>fasilitator</b>; penjelasan ada tetapi tidak dituntaskan. Isi berupa masalah yang dipecahkan dalam <b>diskusi kelompok kecil</b> atau tugas kelompok, lalu lapor hasil. Juga lewat <b>diskusi kelas</b>: guru jadi <b>“polisi lalu lintas”</b> (mengatur arus pembicaraan) dan <b>“dinding penangkis”</b> (pertanyaan siswa dilempar ke siswa lain).</td></tr></table></div>
<h3>3. Variasi penggunaan media</h3>
<p>Siswa SD berada pada tahap <b>konkret</b>, jadi harus belajar sesuatu yang nyata. Media adalah <b>saluran</b> penyampai isi tema dari guru ke siswa, dengan metode tertentu. Media bukan pelengkap atau alat bantu yang boleh diabaikan, tetapi <b>bagian integral</b> proses pembelajaran. Riset <b>British Audio-Visual Association</b> tentang informasi yang diperoleh lewat indra:</p>
<div class="tw"><table><tr><th>Indra</th><th>Persentase</th></tr><tr><td>Penglihatan (visual)</td><td><b>75%</b></td></tr><tr><td>Pendengaran (auditori)</td><td>13%</td></tr><tr><td>Sentuhan dan perabaan</td><td>6%</td></tr><tr><td>Penciuman dan lidah</td><td>6%</td></tr></table></div>
<p>Maka media visual lebih menguntungkan, dan paling optimal bila divariasikan agar melayani <b>semua indra</b>. Tiga kelompok media: visual, audio, audio-visual.</p>
<div class="tw"><table><tr><th>Media</th><th>Isi</th></tr>
<tr><td><b>Visual</b> (hanya dilihat; paling sering dipakai guru SD)</td><td><b>Diproyeksikan:</b> proyeksi diam (gambar diam) dan proyeksi gerak (gambar bergerak); contoh OHP dan slaid suara. Butuh listrik, ruangan memadai, mahal, dan guru terampil. Lebih mudah di kota, belum di banyak desa.<br><b>Tidak diproyeksikan:</b> gambar diam, grafis, model, realia.</td></tr>
<tr><td><b>Audio</b> (hanya didengar)</td><td>Program kaset suara dan radio. Untuk melatih keterampilan <b>mendengarkan</b>. Pertimbangan: (1) hanya baik untuk siswa yang mampu berpikir abstrak (<b>kelas tinggi</b>); kelas awal perlu modifikasi, (2) butuh pemusatan perhatian lebih tinggi, (3) perlu dilengkapi pengalaman visual.</td></tr>
<tr><td><b>Audio-visual</b> (pandang-dengar)</td><td>Gabungan audio dan visual. Penyajian lebih lengkap dan dalam batas tertentu <b>dapat menggantikan peran guru</b> sebagai penyampai materi. Contoh: program televisi/video pendidikan, slaid suara.</td></tr></table></div>
<h4>Media visual tidak diproyeksikan (4 jenis)</h4>
<div class="tw"><table><tr><th>Jenis</th><th>Ciri</th></tr>
<tr><td><b>Gambar diam/mati</b></td><td>Gambar fotografik (manusia, binatang, tempat, objek), tunggal atau berseri. <b>Keuntungan:</b> menjadikan ide abstrak lebih konkret; banyak tersedia (buku, majalah, surat kabar, kalender); mudah dipakai tanpa alat lain; murah atau gratis; dapat dipakai di setiap tahap dan tema. <b>Kelemahan:</b> ukuran terlalu kecil untuk kelas besar; dua dimensi dan tidak bergerak.</td></tr>
<tr><td><b>Grafis</b></td><td>Media pandang <b>dua dimensi (bukan fotografik)</b> yang dirancang khusus; unsur gambar dan tulisan, memakai kata, angka, simbol. Karakteristik: sederhana, menarik perhatian, murah, mudah disimpan dan dibawa. Jenis: <b>grafik, bagan, diagram, poster, kartun, komik</b>.</td></tr>
<tr><td><b>Model</b></td><td><b>Tiga dimensi</b>, sering dipakai di kelas awal; tiruan objek nyata yang terlalu besar, jauh, kecil, mahal, jarang ditemukan, atau rumit. Jenis: <b>model padat, penampang, susun, kerja, mock-up, diorama</b>. Ukuran bisa sama, lebih kecil, atau lebih besar.</td></tr>
<tr><td><b>Realia</b></td><td>Model dan <b>objek nyata</b> (mata uang, tumbuhan, binatang), memberi <b>pengalaman langsung</b>.</td></tr></table></div>
<div class="ing"><b>💡 Ingat:</b> pola interaksi 1-2-banyak: ceramah, tanya jawab, diskusi. Media: <b>V-A-AV</b>. Tidak diproyeksikan = <b>G-G-M-R</b> (Gambar diam, Grafis, Model, Realia). Grafis: bagan, diagram, poster, kartun, komik.</div>
<h3>Arah jawaban latihan</h3>
<p>Diskusikan bentuk kegiatan penguatan dan variasi lainnya, rancang skenario (tema dan langkah belajar), simulasikan dengan teman, catat kelebihan dan kekurangan, dengan mengingat komponen dan prinsip di atas.</p>
<h2>Sering keluar di ujian (KB 3)</h2>
<div class="tw"><table><tr><th>Jebakan</th><th>Yang benar</th></tr>
<tr><td>Penguatan = respons siswa / efektivitas guru</td><td>= <b>respons guru</b> terhadap perilaku positif siswa</td></tr>
<tr><td>Variasi = berbagai jenis keterampilan / alat memancing perhatian</td><td>= <b>mengubah keadaan supaya tidak membosankan</b></td></tr>
<tr><td>Manfaat variasi = percaya diri / mengontrol tingkah laku / mengulang perilaku positif</td><td>Itu manfaat atau makna <b>penguatan</b>. Variasi = <b>menghindarkan monoton</b></td></tr>
<tr><td>Penguatan verbal = gerak, simbol, kegiatan</td><td>Verbal = <b>kata dan kalimat</b></td></tr>
<tr><td>Jawaban kurang tepat: menyalahkan / mengangkat ibu jari</td><td>= <b>penguatan tak penuh</b> (partial)</td></tr>

<tr><td>Satu arah dipakai saat fasilitator / diskusi</td><td>Satu arah = <b>menjelaskan materi sulit secara tuntas</b>. Fasilitator = banyak arah</td></tr>
<tr><td>Media sebagai pelengkap / bantuan guru</td><td>Dasarnya <b>siswa SD di tahap konkret</b>; media bagian integral</td></tr>
<tr><td>Bagan, poster, kartun = model / realia</td><td>= media <b>grafis</b></td></tr>
<tr><td>Penguatan memakai hukuman, ejekan</td><td>Dihindari. Penguatan harus hangat, bermakna, segera, bervariasi</td></tr></table></div>

<h2>Kejelian guru dan keuntungan guru kelas</h2>
<p>Pembelajaran terpadu idealnya berangkat dari kurikulum yang sudah terpadu (<i>integrated curriculum</i>), tetapi di Indonesia kurikulum biasanya sudah dipecah per mapel. Maka hal pertama yang diperhatikan guru adalah <b>kejelian mengidentifikasi dan menetapkan kompetensi dasar dan indikator</b> setiap mapel yang akan dipadukan. Guru harus memahami betul isi tiap kompetensi dasar dan indikator sebelum memadukannya. Keuntungannya: sistem <b>guru kelas</b> membuat guru lebih cepat melihat keterhubungan antarmapel karena mengajarkan semua mapel. Keberhasilan sangat ditentukan kemampuan guru menyusun <b>perancangan dan skenario</b> yang memperhatikan karakteristik siswa.</p>
<h2>Tujuh langkah merancang pembelajaran terpadu</h2>
<div class="tw"><table><tr><th>No</th><th>Langkah</th></tr><tr><td>1</td><td>Tetapkan mata pelajaran yang akan dipadukan</td></tr><tr><td>2</td><td>Pelajari kompetensi dasar pada kelas dan semester yang sama dalam setiap mapel</td></tr><tr><td>3</td><td>Pelajari hasil belajar dan indikator hasil belajar setiap mapel</td></tr><tr><td>4</td><td>Pilih dan tetapkan tema pemersatu</td></tr><tr><td>5</td><td>Buat pemetaan keterhubungan kompetensi dasar setiap mapel dengan tema pemersatu</td></tr><tr><td>6</td><td>Susun silabus pembelajaran dengan mengaitkan topik dan kompetensi dasar setiap mapel</td></tr><tr><td>7</td><td>Susun satuan pembelajaran terpadu</td></tr></table></div>
<div class="ing"><b>💡 Ingat:</b> <b>Mapel → KD → Indikator → Tema → Peta → Silabus → Satuan</b>. Tema baru muncul di langkah ke-4, dan ujungnya adalah <b>satuan pembelajaran terpadu</b>.</div>
<h3>1. Penetapan mata pelajaran</h3>
<p>Dilakukan setelah membuat <b>peta kompetensi dasar secara menyeluruh</b> pada semua mapel SD, supaya terjadi <b>pemerataan keterpaduan</b>. Penetapan sebaiknya disertai alasan/rasional yang berkaitan dengan pencapaian kompetensi dasar dan kebermaknaan belajar.</p>
<h3>2. Penetapan kompetensi dasar</h3>
<p>Mengidentifikasi KD pada <b>jenjang kelas dan semester yang sama</b> dari tiap mapel yang bisa diajarkan terpadu dengan payung satu tema pemersatu. Sebelumnya tetapkan dulu <b>aspek-aspek</b> tiap mapel yang bisa dipadukan. Contoh dari Standar Kompetensi 2004, kelas 2 semester 1: Bahasa Indonesia (mendengarkan, berbicara, membaca, menulis), Matematika (bilangan cacah dan pengukuran), Pengetahuan Alam (makhluk hidup, benda dan sifatnya, energi), Kerajinan Tangan dan Kesenian (rupa: gambar ekspresi dan imajinatif).</p>
<div class="tw"><table><tr><th>Mapel</th><th>KD terpilih (contoh)</th></tr><tr><td>Bahasa Indonesia</td><td>Mendeskripsikan binatang di sekitar (secara lisan)</td></tr><tr><td>Matematika</td><td>Memahami konsep urutan bilangan cacah</td></tr><tr><td>Pengetahuan Alam</td><td>Mendeskripsikan bagian-bagian yang tampak pada hewan di sekitar rumah dan sekolah</td></tr><tr><td>Kerajinan Tangan dan Kesenian</td><td>Menanggapi berbagai unsur rupa: bintik, garis, bidang, warna, dan bentuk</td></tr></table></div>
<h3>3. Penetapan hasil belajar dan indikator</h3>
<p>Mempelajari dan menetapkan <b>hasil belajar</b> tiap mapel supaya diketahui <b>materi pokok</b> yang bisa dibahas terpadu, memakai kurikulum yang berlaku. Contoh kelas 2 semester 1 (tema Binatang):</p>
<div class="tw"><table><tr><th>Mapel</th><th>Hasil belajar</th><th>Materi pokok</th></tr><tr><td>Bahasa Indonesia</td><td>Mendeskripsikan binatang secara rinci sesuai ciri-cirinya dengan kalimat runtut dan pilihan kata tepat</td><td>Gambar tentang binatang di sekitar</td></tr><tr><td>Matematika</td><td>Membilang bilangan; membandingkan bilangan</td><td>Urutan bilangan</td></tr><tr><td>Pengetahuan Alam</td><td>Mengidentifikasi bagian-bagian utama tubuh hewan dan kegunaannya</td><td>Bagian-bagian tubuh hewan</td></tr><tr><td>Kerajinan Tangan dan Kesenian</td><td>Mengkomunikasikan gagasan imajinatif hasil pengamatan benda-benda di alam sekitar</td><td>Berbagai objek benda alam yang memiliki unsur rupa dua dan tiga dimensi</td></tr></table></div>
<h3>4. Penetapan tema</h3>
<p>Setelah tiga tahap di atas. <b>Tema = pokok pikiran atau gagasan pokok yang menjadi pokok pembicaraan</b> (Poerwadarminta, 1983; Moeliono, 1989; Keraf, 1991). Perannya menciptakan situasi belajar yang kondusif:</p>
<ol type="a"><li>Siswa mudah memusatkan perhatian pada satu tema/topik.</li><li>Siswa dapat mempelajari pengetahuan dan mengembangkan beberapa KD antarmapel dalam tema yang sama.</li><li>Pemahaman lebih mendalam dan berkesan.</li><li>KD berkembang lebih baik karena mengaitkan antarmapel dan pengalaman pribadi siswa.</li><li>Siswa lebih merasakan manfaat dan makna belajar.</li><li>Siswa lebih bergairah, berkomunikasi dalam situasi nyata: bertanya, berdiskusi, bercerita, bermain peran, menulis deskripsi.</li><li>Guru <b>menghemat waktu</b> karena bisa dipersiapkan sekaligus dalam dua atau tiga kali pertemuan. Sisa waktu untuk remedial, pemantapan, atau pengayaan (<i>enrichment</i>).</li></ol>
<p><b>Pertimbangan mengembangkan tema:</b> (a) memungkinkan proses berpikir siswa dan terkait cara dan kebiasaan belajarnya; (b) lingkup sesuai usia dan perkembangan, minat, dan kemampuan; (c) <b>dimulai dari lingkungan terdekat siswa</b>, dari yang termudah ke sulit, sederhana ke kompleks, <b>konkret ke abstrak</b>.</p>
<p><b>Contoh tema (18):</b> diri sendiri, keluarga, lingkungan, kebersihan dan kesehatan, budi pekerti, tempat umum, kegiatan sehari-hari, peristiwa alam, kegemaran, permainan, alat komunikasi, transportasi, hewan dan tumbuhan, hiburan, rekreasi, negara, pengalaman, keperluan. Guru boleh menetapkan tema sendiri asal berdasarkan pertimbangan tadi.</p>
<p><b>Ruang lingkup:</b> tidak terlalu luas atau sempit. Tema yang luas dijabarkan menjadi <b>anak tema/subtema</b> (topik) yang lebih spesifik dan konkret, lalu menjadi <b>materi</b> (bila berupa karangan diberi judul). Contoh: tema <b>Pengalaman</b> memiliki anak tema pengalaman menyenangkan, menyedihkan, lucu/menggelikan. Tema <b>Peristiwa</b> memiliki anak tema peristiwa negatif dan positif (alam: banjir, gempa bumi, gunung meletus, tanah longsor, angin topan; lain: perampokan, pencopetan, tabrak lari, rapat akbar, pemilu).</p>
<div class="ing"><b>💡 Ingat:</b> 4 langkah tema: <b>pilih tema → anak tema → pilih anak tema → materi/bahan ajar</b> (wacana, dialog, dll). Tema → anak tema → materi. Contoh “Desa Nelayan” = subtema dari tema <b>kehidupan di laut</b>.</div>
<h3>5. Pemetaan keterhubungan KD dengan tema pemersatu</h3>
<p>Dibuat dalam bentuk <b>bagan dan/atau matriks jaringan topik</b> yang menunjukkan kaitan tema dengan KD tiap mapel, juga dengan hasil belajar dan indikatornya.</p>
<p><b>Contoh 1: tema BINATANG (kelas 2)</b> dihubungkan dengan KD Bahasa Indonesia, Matematika, IPA, dan KTK (seperti tabel di atas). Indikatornya antara lain: BI (menirukan gerak dan suara binatang, menjelaskan ciri-ciri binatang, membaca dan melengkapi teks pendek bergambar); IPA (membuat daftar bagian tubuh hewan dan kegunaannya, menirukan suara hewan, menggambar sederhana dan menamai bagian tubuh, menceritakan cara hewan bergerak); Matematika (menyebutkan banyaknya benda, membaca dan menulis lambang bilangan dengan kata dan angka, membandingkan kumpulan benda lebih banyak/sedikit/sama); KTK (mengungkapkan perasaan ketertarikan pada objek yang diamati dari berbagai unsur rupa).</p>
<p><b>Contoh 2: tema BATUAN (kelas IV)</b> dalam bagan jaringan:</p>
<div class="tw"><table><tr><th>Mapel</th><th>Kaitan dengan tema Batuan</th></tr><tr><td>Pengetahuan Alam</td><td>Mengidentifikasi sifat batuan; memahami pengaruh suhu dan tekanan terhadap batuan; mengelompokkan benda berdasarkan wujudnya (jenis batuan)</td></tr><tr><td>Bahasa Indonesia</td><td>Menyusun ringkasan isi teks; memahami teks tentang peninggalan sejarah (Candi Borobudur); mendeskripsikan benda berdasarkan ciri-cirinya (aneka jenis batuan); mendeskripsikan perubahan wujud benda (batuan)</td></tr><tr><td>Matematika</td><td>Menggunakan konsep keliling dan luas, menghitung luas dan keliling batuan; mengukur berat setiap jenis batuan</td></tr><tr><td>Pengetahuan Sosial</td><td>Menjaga pelestarian peninggalan sejarah; mengidentifikasi peninggalan sejarah bercorak Hindu beserta ciri-cirinya</td></tr></table></div>
<h3>6. Penyusunan silabus pembelajaran terpadu</h3>
<p>Hasil tahap sebelumnya jadi dasar. <b>Silabus</b> = garis-garis besar, ringkasan, ikhtisar, atau pokok-pokok isi/materi pembelajaran terpadu. Ia penjabaran lebih lanjut dari <b>standar kompetensi, kompetensi dasar, serta pokok dan uraian materi</b> yang perlu dipelajari siswa. Detail dan contohnya di KB 2.</p>
<h3>7. Penyusunan satuan pembelajaran terpadu</h3>
<p>Untuk pelaksanaan di kelas. Merupakan <b>realisasi pengalaman belajar</b> siswa yang ditentukan di silabus. <b>Tujuh komponen:</b></p>
<ol type="a"><li><b>Identitas</b> mapel (nama mapel yang dipadukan, kelas, semester, waktu/jam pertemuan).</li><li><b>Kompetensi dasar</b> yang hendak dicapai.</li><li><b>Materi pokok</b> beserta uraiannya.</li><li><b>Strategi pembelajaran</b> (kegiatan konkret siswa berinteraksi dengan materi dan sumber belajar).</li><li><b>Alat dan media</b>.</li><li><b>Penilaian dan tindak lanjut</b> (prosedur, instrumen, dan tindak lanjut hasil penilaian).</li><li><b>Sumber bahan</b> yang digunakan.</li></ol>
<div class="ing"><b>💡 Ingat satuan:</b> <b>I-K-M-S-A-P-S</b> = Identitas, KD, Materi pokok, Strategi, Alat-media, Penilaian-tindak lanjut, Sumber.</div>

<h1>Kegiatan Belajar 2: Silabus dan Satuan Pembelajaran Terpadu</h1>
<h2>Pengantar</h2>
<p>KB 2 banyak mengkaji <b>contoh</b> silabus dan satuan pembelajaran terpadu. Contohnya hanya sebagian dari banyak bentuk yang ada. Kalau guru sudah terbiasa dengan format sendiri, lebih baik memakai format itu. Contoh dikaji secara kritis.</p>
<h2>A. Silabus pembelajaran terpadu</h2>
<p><b>Silabus</b> = garis besar, ringkasan, ikhtisar, atau pokok-pokok isi/materi pembelajaran. Ia penjabaran lebih lanjut dari standar kompetensi, kompetensi dasar, serta pokok dan uraian materi.</p>
<div class="tw"><table><tr><th>Manfaat silabus</th><th>Pendekatan dan komponen</th></tr><tr><td>Pedoman <b>penyusunan satuan pembelajaran terpadu</b>, <b>pengelolaan kegiatan pembelajaran</b>, dan <b>pengembangan sistem penilaian</b></td><td>Dikembangkan dengan <b>pendekatan sistem</b>: komponennya saling berhubungan untuk mencapai KD. <b>5 komponen:</b> (a) identifikasi mapel yang dipadukan, (b) KD, hasil belajar, dan indikator, (c) materi pokok yang mengacu pada tema, (d) alternatif strategi pembelajaran, (e) alokasi waktu.</td></tr></table></div>
<h3>Contoh 1: silabus kelas III semester 1, tema Peristiwa Alam (24 jam pelajaran)</h3>
<p>Sekolah: SD Negeri Sekejati 3 Kota Bandung. Kolom: mata pelajaran, KD dan indikator, materi pokok, strategi pembelajaran, alokasi waktu, sumber bahan.</p>
<div class="tw"><table><tr><th>Mapel</th><th>KD / kegiatan</th><th>Materi pokok</th><th>Waktu</th></tr>
<tr><td>Bahasa Indonesia</td><td>Menceritakan peristiwa alam yang dialami, dilihat, didengar; menjelaskan peristiwa alam di sekitar; menjelaskan isi gambar seri. Kegiatan: tanya jawab dan diskusi, menyanyikan lagu “Pemandangan”, mencari berita dari media, mengamati gambar seri, menulis satu paragraf per gambar, membacakan hasil tulisan</td><td>Peristiwa alam yang terjadi di sekitar</td><td>2 jam</td></tr>
<tr><td>Pengetahuan Alam</td><td>Mendefinisikan ciri-ciri lingkungan sehat dan tidak sehat; mengidentifikasi penyebab pencemaran terhadap kesehatan; menjelaskan pengaruh pencemaran. Kegiatan: tanya jawab, mengamati lingkungan, meneliti penyebab, melaporkan</td><td>Lingkungan sehat dan tidak sehat (ciri, penyebab, pengaruh)</td><td>6 jam</td></tr>
<tr><td>Pengetahuan Sosial</td><td>Mengidentifikasi kenampakan alam dan buatan bagi kehidupan; menjelaskan manfaat kenampakan alam. Kegiatan: tanya jawab, mengamati kenampakan alam sekitar</td><td>Kenampakan alam dan buatan</td><td>4 jam</td></tr>
<tr><td>Matematika</td><td>Mengenal dan menggunakan konsep bilangan cacah dalam pemecahan masalah; memecahkan masalah sehari-hari penjumlahan dan pengurangan</td><td>Operasi hitung bilangan cerita</td><td>4 jam</td></tr>
<tr><td>Pendidikan Jasmani dan Kesehatan</td><td>Melakukan orientasi lingkungan sekolah; mengenal lokasi tempat berada. Kegiatan: penjelajahan sekitar sekolah</td><td>Mengenal denah lingkungan sekolah</td><td>4 jam</td></tr>
<tr><td>Kerajinan Tangan dan Kesenian</td><td>Mengekspresikan gagasan imajinasi dengan musik; menyanyikan lagu anak dengan syair benar; berkarya seni rupa. Kegiatan: membuat kolase</td><td>Berbagai gambar pola ragam hias, kolase</td><td>4 jam</td></tr></table></div>
<p>Total 2 + 6 + 4 + 4 + 4 + 4 = <b>24 jam pelajaran</b>. Silabus diprogramkan untuk satu tema dengan alokasi waktu sesuai kebutuhan pencapaian KD.</p>
<h3>Contoh 2: silabus kelas I semester 2, tema Benda Langit, subtema Bulan dan Bintang</h3>
<div class="tw"><table><tr><th>Mapel</th><th>Isi</th></tr>
<tr><td>Pengetahuan Alam</td><td>Mendeskripsikan benda-benda langit dan peristiwa alam serta pengaruhnya bagi kehidupan. Indikator: membuat daftar benda langit, menceritakan benda yang terlihat siang dan malam. Langkah: guru bertanya keadaan siang dan malam, tanya jawab tentang benda di langit, mengajak menyanyi “Bintang Kecil”, menginformasikan benda langit yang dipelajari</td></tr>
<tr><td>Bahasa Indonesia</td><td>Mendengarkan deskripsi benda di sekitar; mendeskripsikan benda di sekitar; mendengarkan cerita. Indikator: menentukan nama benda yang dideskripsikan guru sesuai ciri fisiknya; menuliskan huruf, kata, kalimat sederhana dengan benar dan terbaca</td></tr>
<tr><td>Matematika</td><td>Mengenal dan menggunakan konsep bilangan cacah. Indikator: membilang atau menghitung secara urut, menyebutkan banyaknya benda, menghitung dan mengurutkan benda. Guru memberi pekerjaan rumah dan menjelaskan pesan moral bahwa Allah SWT menciptakan benda langit</td></tr>
<tr><td>Kerajinan Tangan dan Kesenian</td><td>Mengenal unsur rupa: bintik, garis, bidang, bentuk; mengidentifikasi unsur rupa dua dan tiga dimensi; membuat gambar ekspresi objek imajinatif; menyanyikan lagu dengan syair benar</td></tr></table></div>
<p><b>Format kolom contoh 2:</b> mata pelajaran, KD dan hasil belajar, materi pokok, indikator, langkah pembelajaran, metode, evaluasi, alokasi waktu, sumber/alat. <b>Metode:</b> global, inquiry, ceramah, tanya jawab, penugasan dan latihan. <b>Evaluasi:</b> ketepatan menjawab, keaktifan, pelafalan, menggambar, kaidah penulisan, berhitung. <b>Alokasi:</b> 4 × 35 menit. <b>Sumber:</b> gambar-gambar, lagu anak-anak, buku teks Bahasa Indonesia.</p>
<div class="ing"><b>💡 Ingat:</b> silabus = <b>5 komponen</b> (Mapel, KD-indikator, Materi pokok, Strategi, Waktu). Kelas rendah memakai satuan <b>35 menit</b>, kelas III memakai <b>40 menit</b>.</div>
<h2>B. Satuan pembelajaran terpadu</h2>
<p><b>Satuan pembelajaran terpadu</b> = satuan atau unit program pembelajaran <b>terkecil</b> untuk jangka waktu <b>mingguan atau harian</b>, berisi rencana penyampaian suatu pokok atau satuan bahasan tertentu dalam satu tema. Disusun berdasarkan silabus untuk satu kali pertemuan dengan tujuan mencapai beberapa KD tiap mapel.</p>
<p><b>Komponen (menurut rangkuman):</b> (a) identitas mapel, (b) KD, hasil belajar, dan indikator yang dipadukan, (c) pokok-pokok materi, (d) kegiatan belajar-mengajar, (e) alat, media, dan sumber bahan, (f) cara penilaian dengan alat penilaian.</p>
<div class="warn"><b>⚠️ Perbedaan hitungan:</b> di KB 1 komponen satuan ditulis <b>7 butir</b> (alat-media dan sumber bahan dipisah). Di rangkuman KB 2 ditulis <b>6 butir</b> (alat, media, sumber digabung). Isinya sama.</div>
<h3>Contoh satuan: tema Peristiwa Alam, kelas III/1</h3>
<div class="tw"><table><tr><th>Bagian</th><th>Isi</th></tr>
<tr><td><b>Identitas</b></td><td>Mapel: Bahasa Indonesia, Pengetahuan Alam, Matematika, Kerajinan Tangan dan Kesenian. Tema: Peristiwa Alam. SD kelas III semester 1. Waktu: 2 × 40 menit.</td></tr>
<tr><td><b>A. KD dan indikator</b></td><td><b>BI:</b> menceritakan peristiwa alam (yang dialami, dilihat, didengar); menjelaskan isi gambar seri. <b>IPA:</b> membedakan lingkungan sehat dan tidak sehat; mengidentifikasi penyebab pencemaran; menjelaskan pengaruh pencemaran. <b>Matematika:</b> konsep bilangan cacah; penjumlahan dan pengurangan. <b>KTK:</b> mengekspresikan imajinasi dengan musik; menyanyikan lagu anak dengan syair benar</td></tr>
<tr><td><b>B. Materi</b></td><td>BI: peristiwa alam, gambar seri 4 rangkaian, menulis kalimat (ejaan dan tanda baca), membaca dengan lafal dan intonasi. IPA: lingkungan sehat dan tidak sehat. Matematika: penjumlahan dan pengurangan lewat soal cerita. KTK: syair lagu “Kampung Halamanku”</td></tr>
<tr><td><b>C. Strategi</b></td><td>Tahap <b>persiapan/pra-pembelajaran</b>: guru mengatur ruangan, menyiapkan alat dan media.<br><b>Pembukaan</b>: siswa dikondisikan, guru menyampaikan lisan dan menulis di papan materi dan kemampuan yang diharapkan, menjelaskan langkah kegiatan, <b>apersepsi</b> dengan menyanyikan lagu “Pemandangan” sebagai motivasi.<br><b>Inti</b>: kelompok 4–5 orang mencari berita peristiwa alam, juru bicara bercerita, tanya jawab, mengamati gambar seri, menulis satu paragraf per gambar dengan tanda baca benar, membacakan, mengamati lingkungan sehat/tidak sehat dan melapor, latihan soal cerita, menyanyikan “Kampung Halamanku”.<br><b>Penutup</b>: menarik kesimpulan dan tindak lanjut pembiasaan menjaga kebersihan dan kesehatan.</td></tr>
<tr><td><b>D. Alat dan media</b></td><td>Koran, majalah, buku pengetahuan; lingkungan sekitar sekolah; gambar seri (banjir); teks lagu “Kampung Halamanku” dan “Pemandangan”</td></tr>

<h3>Kelengkapan penilaian</h3>
<ul><li><b>Lembar soal</b>: contoh butir: sebutkan 3 macam peristiwa alam; buat kalimat dengan kata “bersih”; sebutkan 2 ciri lingkungan sehat; soal cerita uang untuk korban banjir dan beras untuk korban tanah longsor.</li><li><b>Lembar pengamatan</b>: kelompok mengisi tabel ciri lingkungan sehat dan lingkungan tidak sehat.</li><li><b>Lembar penilaian kinerja</b>: tujuh aspek (perhatian terhadap pelajaran, aktivitas bertanya, keberanian berkomunikasi dan bertindak, aktivitas mengemukakan pendapat, kelengkapan informasi, kemampuan berbahasa lisan, kerja sama kelompok) skor 1–5: 1 sangat kurang, 2 kurang, 3 cukup, 4 baik, 5 sangat baik.</li><li><b>Lembar analisis kemampuan menulis kalimat berdasarkan gambar seri</b>: lima aspek (unsur kalimat; tanda baca; huruf kapital; kerapian tulisan; kemampuan menulis berdasarkan gambar), tiap aspek bernilai 2 sehingga skor tertinggi 10. Kualifikasi: <b>SB</b> bila muncul 4 deskriptor, <b>B</b> bila 3, <b>C</b> bila 2, <b>K</b> bila 1.</li><li><b>Teks lagu</b>: “Pemandangan” dan “Kampung Halamanku” (karya Ibu Sud).</li></ul>

<h1>Kegiatan Belajar 1: Konsep, Prinsip, dan Sasaran Penilaian</h1>
<h2>Pengantar modul</h2>
<p>Penilaian dalam pembelajaran terpadu tidak hanya menilai <b>hasil</b> belajar, tetapi juga <b>proses</b> belajar. Guru harus memperhatikan: <b>jenis kompetensi</b> yang dinilai, <b>tujuan</b> penilaian, <b>teknik</b> penilaian, dan <b>jenis</b> penilaian, supaya tepat sasaran, terarah, dan terencana.</p>
<p><b>Lima tujuan modul:</b> menjelaskan (1) konsep, (2) prinsip, (3) sasaran, (4) langkah-langkah penilaian, dan (5) bentuk alat penilaian dalam pembelajaran terpadu. KB 1 untuk tujuan 1–4, KB 2 untuk tujuan 5.</p>
<div class="ing"><b>💡 Ingat:</b> yang harus dipikirkan guru = <b>K-T-T-J</b> (Kompetensi, Tujuan, Teknik, Jenis penilaian).</div>
<h2>A. Konsep penilaian</h2>
<div class="tw"><table><tr><th>Penilaian konvensional</th><th>Penilaian alternatif</th></tr><tr><td>Memakai teknik <b>tes</b>. Laporannya berupa angka atau huruf, maknanya sangat <b>abstrak</b>, sehingga tidak selengkapnya menggambarkan kemajuan belajar secara menyeluruh.</td><td>Memakai teknik <b>nontes</b>. Dipakai sebagai <b>penunjang</b> agar guru, orang tua, dan siswa tahu kemajuan dan kemampuan belajar secara menyeluruh.</td></tr></table></div>
<p>Sesuai tuntutan <b>penilaian berbasis kelas</b>, penilaian dilakukan terpadu dalam kegiatan belajar mengajar lewat <b>portofolio, hasil karya (produk), penugasan (proyek), kinerja (<i>performance</i>), dan tes tertulis</b>. Bagan 5.1 (diadaptasi dari Puskur, 2002) membagi teknik pengumpulan informasi menjadi tes (lisan, tertulis, perbuatan) dan nontes (skala sikap, daftar periksa/cek-lis, kuesioner, catatan anekdotal, portofolio, catatan sekolah, jurnal, cuplikan kerja). Tes tertulis terdiri dari uraian (terbatas/tertutup dan bebas/terbuka) dan objektif (pilihan ganda, benar-salah, menjodohkan, isian singkat, dan sebagainya), dengan ranah kognitif, afektif, dan psikomotor.</p>
<h3>Pengertian dan tujuan</h3>
<p>Penilaian dalam pembelajaran terpadu = program penilaian yang dilakukan <b>berkesinambungan</b> untuk menentukan keberhasilan pembelajaran. <b>Tujuan umum:</b> (1) menilai pembelajaran di kelas, (2) meningkatkan pembelajaran dan kualitas belajar siswa, <b>bukan sekadar menentukan skor</b>. Menurut <b>Morrow (1990)</b>, penilaian adalah <b>strategi pengumpulan dan penganalisisan informasi</b> sebagai dasar pengambilan keputusan tentang semua aspek pembelajaran.</p>
<p>Selain hasil belajar anak, guru juga memperhatikan: (1) <b>kesesuaian isi kurikulum</b> dengan kebutuhan anak, (2) <b>keefektifan strategi</b> belajar mengajar, (3) <b>kesesuaian dan keefektifan pengorganisasian kelas</b>.</p>
<div class="tw"><table><tr><th>Tujuan hasil penilaian</th><th>Artinya</th></tr><tr><td><i>Placement</i></td><td>Memenuhi kebutuhan siswa secara tepat</td></tr><tr><td><i>Instruction</i></td><td>Membantu agar pembelajaran <b>lebih terfokus</b></td></tr><tr><td><i>Communication</i></td><td>Memberi informasi kepada siswa, guru, orang tua, dan sebagainya</td></tr></table></div>
<div class="ing"><b>💡 Ingat:</b> <b>P-I-C</b>. Instruction = pembelajaran terfokus.</div>
<h2>B. Prinsip-prinsip penilaian pembelajaran terpadu</h2>
<p>Pada dasarnya sama dengan penilaian konvensional, <b>kecuali</b> perhatian lebih banyak pada <b><i>nurturant effects</i> (dampak pengiring)</b>: kemampuan <b>kerja sama, tenggang rasa, saling tergantung (<i>dependability</i>)</b>, di samping <b>keterpaduan persepsi</b> yang menjadi ciri khas pembelajaran terpadu. Penilaian dilakukan sistematis lewat <b>pengamatan, perekaman, dan analisis</b>.</p>
<h3>3 prinsip utama</h3>
<div class="tw"><table><tr><th>Prinsip</th><th>Isi</th></tr><tr><td><b>Integral/komprehensif</b></td><td>Menyeluruh dan utuh: perilaku, sikap, kreativitas. Mencakup <b>kognitif, psikomotor, dan emosi (afektif)</b>.</td></tr><tr><td><b>Berkesinambungan</b></td><td>Berencana, <b>terus-menerus dan bertahap</b> untuk melihat perkembangan tingkah laku. Direncanakan <b>bersamaan dengan penyusunan program semester</b>.</td></tr><tr><td><b>Objektif</b></td><td>Memakai <b>alat ukur yang handal</b> dan tepat, sehingga menggambarkan kemampuan yang diukur dengan tepat.</td></tr></table></div>
<h3>Prinsip menurut Mathews (1989): 9 butir</h3>
<ol><li>Berbasis <b>unjuk kerja</b> siswa. Selain produk, <b>proses</b> perlu perhatian lebih besar.</li><li>Pada setiap langkah penilaian, <b>siswa dilibatkan</b>.</li><li>Memperhatikan <b>refleksi diri</b> (<i>self reflection</i>) siswa.</li><li><b>Penilaian alternatif</b> (portofolio, catatan anekdotal, unjuk kerja, jurnal, dan lain-lain) lebih dimanfaatkan karena aspek yang dinilai kompleks.</li><li><b>Umpan balik</b> dimanfaatkan sebesar-besarnya untuk pengembangan anak secara individual dan sosial.</li><li>Mengutamakan <b>PAP (Penilaian Acuan Patokan)</b> dengan tetap memanfaatkan <b>PAN (Penilaian Acuan Normatif)</b>.</li><li>Perhatian cukup banyak pada <b>nurturant effects</b>.</li><li>Dilakukan dalam <b>proses terus-menerus (<i>ongoing process</i>)</b>, bukan hanya di awal atau akhir program.</li><li><b>Multidimensional, komprehensif, dan sistematis</b>.</li></ol>
<div class="ing"><b>💡 Ingat:</b> 3 prinsip = <b>I-B-O</b> (Integral, Berkesinambungan, Objektif). PAP diutamakan, PAN tetap dipakai. Penilaian itu <b>ongoing</b>, bukan di akhir saja.</div>
<h3>Cakupan penilaian (Tabel 5.1)</h3>
<p>Dari segi tahapan: penilaian dilakukan pada tahap <b>perencanaan</b> dan <b>pelaksanaan</b>. Dari segi sasaran: <b>proses</b> dan <b>hasil/produk</b>.</p>
<div class="tw"><table><tr><th></th><th>Perencanaan</th><th>Pelaksanaan</th></tr><tr><th>Proses</th><td>Bagaimana siswa berpartisipasi dalam penentuan tema-tema terkait?</td><td>Bagaimana aktivitas dinamika interaksi dan kecakapan berpikir siswa?</td></tr><tr><th>Hasil</th><td>Bagaimana reaksi siswa terhadap rencana yang telah dibuat?</td><td>Perubahan/perkembangan perilaku apa yang terjadi pada siswa? (kognisi/intelektual, sosial, etis, pribadi, dan sebagainya)</td></tr></table></div>
<p>Sifatnya: <b>multidimensional</b>, konteks <b>otentik (alami)</b>, <b>kolaboratif</b>, berorientasi pada perkembangan dan lingkungan budaya siswa. Penekanan pada proses maupun hasil, dan penilaian proses boleh jadi perlu perhatian khusus. Aspek perilaku beragam, jadi teknik dan alat beragam: dari <b>pengamatan langsung informal</b> sampai <b>tes formal terstruktur dan terkendali</b> (Depdikbud, 1997).</p>
<h2>Sasaran penilaian (menurut Mathews, 1989)</h2>
<div class="tw"><table><tr><th>Jenis</th><th>Sasaran</th><th>Yang dinilai</th></tr>
<tr><td rowspan="2"><b>1. Penilaian proses</b> (efektivitas KBM mencapai tujuan; informasi untuk perbaikan KBM)</td><td><b>Terhadap siswa</b> (8)</td><td>1) perkembangan konseptual anak; 2) tingkat kemampuan menghadapi tantangan; 3) interaksi dengan siswa lain; 4) kemampuan berkomunikasi; 5) kerasionalan argumen/alasan; 6) kerja sama, kekompakan, dan produktivitas kelompok; 7) partisipasi dalam diskusi kelompok; 8) penggunaan bahasa yang baik dan benar sesuai tingkat kemampuan</td></tr>
<tr><td><b>Terhadap guru</b> (4)</td><td>1) proses pembelajaran; 2) pendekatan dan metode; 3) materi (pemilihan tema, topik, unit); 4) kelengkapan pembelajaran yang disesuaikan guru</td></tr>
<tr><td rowspan="2"><b>2. Penilaian produk</b> (tingkat penguasaan siswa tentang yang dipelajari, di setiap akhir pembelajaran)</td><td><b>Terhadap siswa</b> (3)</td><td>Pengamatan hasil belajar: 1) kemampuan <b>menulis laporan</b>; 2) menyatakan gagasan dalam <b>gambar, diagram, grafik, simbol</b>; 3) <b>rekaman, video, dan kaset</b> hasil unjuk kerja</td></tr>
<tr><td><b>Terhadap guru</b> (2)</td><td>1) <b>daftar cek</b> oleh rekan guru terhadap strategi dan pengelolaan KBM; 2) <b>masukan</b> dari anak, orang tua, dan rekan guru</td></tr></table></div>
<h3>Penilaian Berbasis Kelas (PBK)</h3>
<p>Penilaian hendaknya <b>valid, mendidik, berorientasi pada kompetensi, adil dan objektif, terbuka, dan berkesinambungan</b>. Menurut <b>Kuswari (2004)</b>, PBK adalah penilaian berdasarkan pengumpulan, pelaporan, dan penggunaan informasi tentang hasil belajar siswa lewat pengukuran dengan prinsip penilaian, pelaksanaan berkelanjutan, <b>bukti otentik, akurat, dan konsisten</b> sebagai <b>akuntabilitas publik</b>.</p>
<ul><li><b>Tujuan umum:</b> memberi penghargaan atas pencapaian belajar dan memperbaiki program dan kegiatan pembelajaran.</li><li><b>Tujuan khusus (3):</b> informasi kemajuan belajar; informasi untuk membina kemajuan lebih lanjut; motivasi belajar dan bimbingan yang lebih tepat.</li><li><b>Fungsi (4) membantu siswa dan guru:</b> (1) siswa mewujudkan diri dan mengembangkan perilaku ke arah lebih baik; (2) siswa mendapat kepuasan; (3) guru menetapkan apakah metode mengajar sudah memadai; (4) guru membuat pertimbangan dan keputusan administrasi.</li></ul>
<h2>C. Bentuk alat penilaian dalam pembelajaran terpadu</h2>
<p>Instrumen mencakup dua tipe: <b>tes dan nontes</b>. Untuk menilai proses akan banyak dipakai bentuk <b>nontes</b>. Guru menetapkan dulu yang diukur: pengetahuan, kemampuan berpikir, keterampilan, produk, atau afeksi.</p>
<h3>1. Bentuk penilaian alternatif (8 bentuk + skala)</h3>
<div class="tw"><table><tr><th>Bentuk</th><th>Inti</th></tr>
<tr><td><b>a. Catatan sekolah</b></td><td><b>Laporan kemajuan belajar</b> berupa deskripsi aspek yang dialami siswa terkait mapel di sekolah</td></tr>
<tr><td><b>b. Cuplikan kerja</b></td><td>Melihat siswa melakukan tugas/proses atau produk yang dibuat, lalu menilai proses dan produk untuk menentukan tingkat pengetahuan atau <i>skill</i>. Termasuk <b>penilaian kinerja (<i>performance</i>)</b></td></tr>
<tr><td><b>c. Portofolio</b></td><td>Menilai kemajuan siswa pada satu periode dari berbagai tugas (jurnal, kaset, karya seni, produk). Berkas <b>bukti-bukti</b> untuk <b>akreditasi perolehan belajar</b>. Format: metode, pemenuhan kriteria, dan keputusan (<b>diterima, ditolak, bersyarat</b> dengan tambahan). Terbuka bagi siswa sehingga bisa <b>menilai diri sendiri</b></td></tr>
<tr><td><b>d. Wawancara</b></td><td>Penilaian <b>lisan</b>. Sebagai <b>penunjang/pelengkap</b> jika penilaian lain belum memberi gambaran jelas. Individual atau kelompok. Berikan <b>rasa aman</b> kepada siswa</td></tr>
<tr><td><b>e. Observasi</b></td><td>Pengamatan teliti dan pencatatan sistematis, dalam <b>situasi alami</b>. Mengungkapkan perilaku <b>nonverbal</b>. Prosedur: (1) spesifikasi tingkah laku yang dinilai, (2) konteks dan metode, (3) alat perekam dan penyimpan hasil</td></tr>
<tr><td><b>f. Jurnal</b></td><td><b>Catatan harian siswa</b> tentang kegiatan di kelas maupun di luar jam sekolah. Guru memakainya untuk memberi pertimbangan, motivasi, dan penguatan</td></tr>
<tr><td><b>g. Rubrik</b></td><td>Guru bersama siswa <b>menyusun kriteria penilaian</b> laporan pekerjaan anak, sehingga anak tahu perkembangannya</td></tr>
<tr><td><b>h. Catatan anekdotal (<i>file card</i>)</b></td><td>Catatan pengamatan <b>informal</b> tentang perkembangan bahasa dan sosial, kebutuhan, kelebihan, kekurangan, kemajuan, gaya belajar, keterampilan, strategi. Komentar singkat spesifik, didokumentasikan terus-menerus, <b>satu kartu per anak</b></td></tr></table></div>
<div class="warn"><b>⚠️ Jebakan:</b> catatan sekolah = <b>laporan kemajuan</b> (bukan catatan harian). Catatan harian = <b>jurnal</b>. Catatan pengamatan informal = <b>anekdotal</b>. Unjuk kerja = <b>cuplikan kerja</b>. Berkas bukti = <b>portofolio</b>. Menyimpulkan afeksi dari perilaku teramati (patuh aturan) = <b>observasi</b>.</div>
<div class="ing"><b>💡 Ingat:</b> <b>C-C-P-W-O-J-R-A</b> = Catatan sekolah, Cuplikan kerja, Portofolio, Wawancara, Observasi, Jurnal, Rubrik, Anekdotal.</div>
<h3>Kriteria penilaian yang baik (4)</h3>
<ol type="a"><li>Tugas penilaian sesuai dengan <b>masalah yang dilihat</b> (kognitif, afektif, psikomotor).</li><li>Sesuai dengan <b>tujuan pengajaran</b>.</li><li>Memberi <b>kesempatan</b> siswa menunjukkan kemampuan dan kemajuan.</li><li>Bersifat <b>menarik, menantang, dan bermanfaat</b>.</li></ol>
<h3>Tiga ranah yang dinilai (secara otentik)</h3>
<div class="tw"><table><tr><th>Ranah</th><th>Tingkatan</th></tr>
<tr><td><b>Kognitif</b> (hasil belajar intelektual, sederhana sampai kompleks, diperoleh <b>berurutan</b>)</td><td>K1 <b>Ingatan</b> (paling awal), K2 <b>Pemahaman</b> (menyerap, mengerti), K3 <b>Penerapan</b> (menerapkan kaidah pada masalah konkret dan baru), K4 <b>Analisis</b> (merinci kesatuan ke bagian), K5 <b>Sintesis</b> (membentuk kesatuan baru dari bagian), K6 <b>Penilaian</b> (membentuk pendapat dengan pertanggungjawaban berdasarkan kriteria; paling kompleks)</td></tr>
<tr><td><b>Afektif</b> (emosi, kecenderungan, sikap, keinginan, nilai, minat, perasaan)</td><td>Dua hal dinilai: <b>kompetensi afektif</b> dan <b>sikap dan minat</b> terhadap mapel dan proses belajar. Tingkatan: <b>pemberian respons, apresiasi, penilaian, internalisasi</b>. Yang dinilai: (1) memberi respons terhadap nilai, (2) menikmati/menerima nilai, norma, objek etika dan estetika, (3) menilai (<i>valuing</i>) baik-buruk, adil-tidak adil, indah-tidak indah, (4) menerapkan nilai, norma, etika, estetika dalam perilaku sehari-hari. Juga daya tarik, minat, motivasi, ketekunan, sikap</td></tr>
<tr><td><b>Psikomotor</b></td><td>Tingkatan: <b>gerakan awal</b> (menggerakkan sebagian anggota badan), <b>gerakan semi rutin</b> (menirukan gerakan seluruh anggota badan), <b>gerakan rutin</b> (menyeluruh, sempurna, otomatis). Dalam tahap lebih rinci: persepsi, kesiapan, gerakan terbimbing, terbiasa, kompleks, penyesuaian pola gerak, kreativitas</td></tr></table></div>
<div class="ing"><b>💡 Ingat K1–K6:</b> <b>I-P-P-A-S-P</b> = Ingatan, Pemahaman, Penerapan, Analisis, Sintesis, Penilaian. Afektif: <b>Respons → Apresiasi → Penilaian → Internalisasi</b>.</div>
<p><b>Penilaian otentik</b> (Marzano, 1992): siswa diminta mengaplikasikan pengetahuan atau menunjukkan keterampilan seperti dipakai di dunia nyata, dan kinerjanya dinilai.</p>
<h3>2. Contoh penerapan: menulis deskripsi (kelas V, ranah kognitif)</h3>
<p>KD: menulis deskripsi. Indikator: memahami cara menulis karangan deskripsi dengan ejaan benar dan mengomunikasikan ide atau pesan tertulis. Topik: <b>Upacara Bendera</b>.</p>
<div class="tw"><table><tr><th>Bentuk</th><th>Penerapan</th></tr>
<tr><td>1. Cuplikan kerja</td><td>Menulis paragraf deskripsi minimal 30 kata dalam 30 menit; dinilai dari ketepatan isi, kerapian tulisan, ejaan dan tanda baca, pilihan kata. Juga siswa mengomentari karangan deskripsi siap pakai (isi dengan judul, ejaan dan tanda baca, pilihan kata)</td></tr>
<tr><td>2. Observasi</td><td>Guru mengamati siswa menulis, mencatat yang sudah dan belum bisa, khususnya yang kesulitan memulai, lalu membimbing secara individual</td></tr>
<tr><td>3. Wawancara</td><td>Terbatas, penunjang. Contoh pertanyaan: apa itu deskripsi? Kapan dan di mana kamu mengikuti upacara? Siapa saja yang ikut? Apa saja yang terjadi?</td></tr>
<tr><td>4. Portofolio</td><td>Berkas cuplikan kerja dari tahap pramenulis sampai publikasi, hasil observasi dan wawancara. Memenuhi kriteria: <b>diakui</b>. Sudah bisa tetapi belum sempurna (misalnya ejaan, terlihat di tahap revisi): <b>bersyarat</b>, harus mengikuti petunjuk dan latihan atau mengulang menulis dengan tahapan menulis lengkap</td></tr>
<tr><td>5. Catatan sekolah</td><td>Laporan akreditasi, misalnya Gia pada catur wulan ini memahami kriteria dan cara menulis deskripsi, kosakata bagus, ejaan atau tanda baca masih kurang tepat</td></tr>
<tr><td>6. Catatan anekdotal</td><td>Catatan tanggal per tanggal tentang Gia (kelas V): sikap (senang menulis), revisi dan penyuntingan (bersedia memperbaiki), mekanik (kesalahan ejaan dan penulisan “di”, lalu meningkat)</td></tr></table></div>
<h3>Penerapan pada ranah afektif dan psikomotor</h3>
<ul><li><b>Afektif:</b> variabel: sikap (<i>attitudes</i>), minat, motivasi, nilai (<i>values</i>), pilihan, konsep diri, kendali kontrol. Lebih sukar dinilai karena abstrak, jadi di samping tes dipakai nontes. Contoh pertanyaan: apa gunanya mengajarkan menulis kalau siswa membenci menulis? Tahap afektif: <b>menerima, menanggapi, evaluasi, organisasi, karakteristik</b>. Alat yang cocok (Tabel 5.2): <b>wawancara, observasi, cuplikan kerja, catatan harian, angket</b>.</li><li><b>Psikomotor:</b> gerak tubuh dari sederhana (<i>gross</i>) sampai terkoordinasi (<i>finely coordinated</i>). Tahap: <b>persepsi, gerakan terbimbing, terbiasa, gerakan kompleks, penyesuaian pola gerak, kreativitas</b>. Dapat dinilai tes dan nontes; alat cocok (Tabel 5.3): <b>observasi, wawancara, cuplikan kerja, catatan harian, angket</b>. Contoh kelas rendah: pra-membaca dan pra-menulis, dari membuat garis, lingkaran, menghubungkan garis dan lingkaran, menulis di udara dengan gerakan tangan, sampai menulis halus dan tegak bersambung.</li></ul>
<h3>3. Bentuk penilaian konvensional (tes)</h3>
<div class="tw"><table><tr><th>Tipe</th><th>Isi</th></tr><tr><td><b>Objektif</b> (<i>objective type</i>)</td><td>Pilihan berganda (<i>multiple choice</i>), benar-salah (<i>true-false</i>), menjodohkan (<i>matching</i>), isian singkat (<i>short answer</i>)</td></tr><tr><td><b>Subjektif</b></td><td><b>Essay</b></td></tr></table></div>
<p>Istilah pengganti objective type: <b>Selected Response Assessment (SRA)</b>.</p>
<ul><li><b>Alasan SRA masih dipakai (3):</b> mengukur ranah kognisi tingkat awal (<i>knowledge, memorization, comprehension</i>); mudah dipakai massal (nasional, regional); banyak SRA dikembangkan lembaga testing dan dijual bebas.</li><li><b>Kelemahan:</b> tidak semua ranah, terutama yang <b>kompleks dan afektif</b>, bisa diukur tepat. Sumber kelemahan: salah target (<i>content validity</i>), salah memilih bentuk tes, kualitas item rendah, kesalahan scoring. Solusi: ajak siswa mempertimbangkan isi dan bentuk tes.</li><li><b>SRA tepat bila (5):</b> bahasa soal tidak terlalu sulit; soal dari yang sudah terstandar; peserta banyak; waktu cukup; ranah luas pada tingkat knowledge, memory, atau comprehension.</li><li><b>Tiga tahap pengembangan SRA:</b> persiapan, pemilihan unsur yang dites, pengembangan tes item.</li></ul>
<h3>Arah jawaban latihan</h3>
<p>Buat satu rancangan pembelajaran terpadu disertai rancangan penilaian nontes. Ingat kembali: penyusunan silabus (Modul 4), Kurikulum SD 2004, dan jenis-jenis penilaian nontes beserta penerapannya.</p>

<h1>Kegiatan Belajar 2: Prosedur Pengembangan dan Format Penilaian Pembelajaran Terpadu di SD</h1>
<h2>A. Prosedur penilaian pembelajaran terpadu</h2>
<p>Penilaian memberi informasi untuk <b>pengambilan keputusan</b>. Tujuh pertanyaan yang dijawab: (1) apa yang dipelajari? (2) apakah siswa bisa naik kelas? (3) nilai berapa yang tepat? (4) siswa masuk kelompok mana? (5) bantuan apa yang perlu diberikan? (6) metode mengajar mana yang perlu diperbaiki? (7) kurikulum mana yang perlu diubah? Agar informasinya tepat, penilaian harus <b>berkualitas</b>, yaitu menghasilkan informasi yang <b><i>reliable</i> dan <i>valid</i></b>, didukung bukti yang meyakinkan.</p>
<h3>Empat tahap penilaian</h3>
<div class="tw"><table><tr><th>Tahap</th><th>Isi</th></tr>
<tr><td><b>1. Perencanaan</b></td><td><b>a. Merumuskan tujuan penilaian</b> (oleh guru maupun siswa). Pada dasarnya untuk membantu siswa meningkatkan prestasi. Bagi guru, penilaian dipakai untuk: (1) identifikasi <b>kekuatan dan kelemahan</b> siswa dan memonitor perkembangan; (2) melihat sejauh mana aktivitas pembelajaran mencapai tujuan; (3) memilih aktivitas dan strategi mengajar yang sesuai kebutuhan siswa; (4) memberi <b>umpan balik</b> (penghargaan, saran, kritik membangun); (5) memilih informasi yang cukup untuk <b>pelaporan kepada orang tua</b>; (6) menyediakan informasi berharga bagi guru, pimpinan, dan siswa baru periode berikutnya.<br><b>b. Menentukan kriteria keberhasilan</b> (siswa dan guru).<br><b>c. Menentukan teknik dan instrumen</b> penilaian.</td></tr>
<tr><td><b>2. Pelaksanaan</b></td><td>Disadari bahwa: (a) penilaian berlangsung <b>sejak awal sampai akhir</b> pembelajaran; (b) penilaian adalah proses <b>berkelanjutan</b>, bukan sekadar satu aspek belajar yang harus dicapai; (c) dapat diarahkan pada <b>proses, produk, dan program</b>.</td></tr>
<tr><td><b>3. Penyusunan dan penyajian laporan</b></td><td>Memperhitungkan seluruh informasi yang terkumpul dan pengolahannya. Disusun <b>logis, sistematis, dan komprehensif</b>, diakhiri dengan <b>rekomendasi dan saran</b>.</td></tr>
<tr><td><b>4. Tindak lanjut</b></td><td>Hasil pengolahan dan saran ditindaklanjuti <b>secara operasional</b>. Tidak semua tindak lanjut dilakukan di akhir kegiatan karena penilaian berlangsung terus-menerus. Umpan balik dimanfaatkan untuk meningkatkan kegiatan belajar mengajar.</td></tr></table></div>
<div class="ing"><b>💡 Ingat:</b> urutan 4 tahap = <b>Perencanaan → Pelaksanaan → Laporan → Tindak lanjut</b> (<b>P-P-L-T</b>). Tujuh keputusan = apa dipelajari, naik kelas, nilai, kelompok, bantuan, metode, kurikulum. “Memberi umpan balik” <b>bukan</b> langkah perencanaan.</div>
<h2>B. Format penilaian pembelajaran terpadu</h2>
<p>Format disesuaikan dengan jenis alat penilaian yang dipakai, supaya informasi dari siswa terkumpul. Contoh-contohnya:</p>
<h3>1. Format observasi (Form I–IV)</h3>
<p>Dipakai di tahap perencanaan dan pelaksanaan, dengan indikator kemampuan yang ditetapkan, difokuskan pada proses maupun produk. Skala: <b>1 sangat tidak baik, 2 tidak baik, 3 cukup, 4 baik, 5 baik sekali</b>, dengan tanggal dan tanda tangan guru.</p>
<div class="tw"><table><tr><th>Form</th><th>Aspek yang dinilai</th></tr>
<tr><td><b>I</b> (perencanaan kegiatan)</td><td>Kelogisan alasan; kerja sama kelompok dan partisipasi; toleransi dan sopan santun; penggunaan Bahasa Indonesia; disiplin waktu; produktivitas</td></tr>
<tr><td><b>II</b> (perencanaan kegiatan)</td><td>Kelengkapan informasi/data; kerja sama kelompok dan partisipasi; disiplin waktu; minat dan antusiasme; keberanian (komunikasi dan berkelompok); produktivitas</td></tr>
<tr><td><b>III</b> (hasil laporan tertulis)</td><td>Kelengkapan data/informasi; sistematika laporan; penggunaan bahasa (pemilihan kosakata, keefektifan kalimat, penyusunan paragraf, kelogisan penyampaian, ejaan dan tanda baca); kesesuaian bentuk-bentuk laporan</td></tr>
<tr><td><b>IV</b> (sajian nonverbal: gambar, foto, matriks, diagram, rekaman kaset/video)</td><td>Kemenarikan; kebermaknaan; keterkaitan dengan tema; kejelasan pesan</td></tr></table></div>
<h3>2. Format penilaian diri siswa</h3>
<p>Siswa menyusun sendiri pertanyaan dan menjawabnya dengan mengorganisasikan gagasannya sendiri. Guru juga bisa menilai diri terkait proses pembelajaran yang dilakukannya. Jurnal tulisan siswa dipakai sebagai masukan guru untuk <b>pertimbangan, motivasi, dan penguatan</b>.</p>
<ul><li><b>Evaluasi diri:</b> yang saya ketahui dari pelajaran ini; yang ingin saya ketahui lebih lanjut; hal yang saya senangi; hal yang tidak saya pahami; nilai yang cocok untuk saya beserta alasan; saran untuk pelajaran tahun mendatang.</li><li><b>Penilaian diri:</b> apakah saya penyimak yang baik? memberi kesempatan bicara kepada orang lain? berbicara secara sopan? memberi dorongan kepada orang lain?</li></ul>
<h3>3. Format portofolio</h3>
<p>Hasil penilaian <b>proses, produk, dan program</b> didokumentasikan dalam portofolio. Ia jadi masukan bagi guru untuk memutuskan nilai siswa dan menyusun perencanaan pembelajaran berikutnya.</p>
<ul><li><b>Simpulan portofolio</b> (diisi siswa): nama, tanggal, unit, tema; menyusun item yang dikerjakan beserta alasan pemilihannya; bidang yang diharapkan berkembang; bidang yang sudah dipelajari (membaca, menulis, matematika, pengetahuan sosial, sains); harapan yang ingin ditemukan.</li><li><b>Penilaian portofolio</b> (diisi guru, 6 butir): (1) konsep, prosedur, hubungan yang sudah dipahami; (2) lingkup perkembangan pemahaman; (3) lingkup kebutuhan dominan yang harus diberikan; (4) pekerjaan yang sudah diselesaikan; (5) pekerjaan yang memerlukan revisi; (6) penilaian tiap lingkup (kemampuan memecahkan masalah, berpikir kritis, berbahasa, dan lain-lain).</li></ul>
<h3>4. Rubrik</h3>
<p>Kriteria disusun <b>kolaboratif guru dan siswa</b>, sehingga siswa tahu kriteria dan dapat mengukur kemampuannya sendiri. Kualifikasi ditetapkan dari <b>munculnya ciri deskriptor</b>.</p>
<div class="tw"><table><tr><th>Fokus kemampuan</th><th>Kualifikasi dan deskriptor (contoh)</th></tr>
<tr><td>Matematika: soal hitung campuran</td><td>Baik dan benar. Dapat mengerjakan soal penjumlahan, pengurangan, perkalian, pembagian dengan bilangan cacah sampai 50.000 dalam bentuk soal cerita</td></tr>
<tr><td>Membaca wacana teks</td><td>Baik dan benar. Memahami fakta, memahami ide, menemukan informasi, memecahkan masalah dalam wacana</td></tr>
<tr><td>Membaca wacana gambar</td><td>Memahami fakta, ide, menemukan informasi, memecahkan masalah dalam gambar</td></tr>
<tr><td>Membaca teks grafik</td><td>Memahami fakta, ide, menemukan informasi, merumuskan masalah dalam grafik</td></tr></table></div>
<p><b>Rubrik menulis</b> memakai tingkat <b>A bagus sekali, B bagus, C cukup, D kurang</b> dengan kriteria: informasi lengkap; informasi sesuai tema; ada kohesi dan koherensi; ejaan benar; tanda baca benar; memuat contoh; bahasa mudah dipahami; alur berpikir logis.</p>
<h3>5. Cuplikan kerja</h3>
<p>Guru memberi tugas yang menuntut siswa memperlihatkan unjuk kerja. Contoh di IPA/Sains: siswa melakukan percobaan untuk menemukan konsep dan memaparkan rencana lewat format <b>“Rencana Penelitianku”</b>: pertanyaan penelitian, bahan yang dibutuhkan, bantuan yang mungkin dibutuhkan, rencana pencapaian, dengan siapa ingin berbagi hasil pengamatan, serta tanda tangan siswa, guru, dan orang tua. Setelah kegiatan, guru menilai kemampuan, keterampilan, sikap, dan pemahaman konsep dari hasil unjuk kerja.</p>
<h3>6. Masukan orang tua</h3>
<p>Keterlibatan orang tua sangat positif. Masukannya <b>menghapus penafsiran keliru</b> guru dan siswa, membuat guru dan orang tua berorientasi pada kemajuan dan kekurangan anak, serta memungkinkan interaksi guru dan siswa. Dimanfaatkan untuk memperbaiki pembimbingan anak dan strategi belajar mengajar. <b>Format observasi orang tua</b> (kunjungan ke kelas): saat memperhatikan anak bekerja, saya berharap menyaksikan …; saya terkejut melihat …; saya senang melihat …; saya kagum tentang ….</p>
<h3>Daftar cek (<i>checklist</i>)</h3>
<p>Butir objek/gejala yang diamati dengan <b>pola respons tetap</b>, misalnya ya-tidak atau ada-tidak ada. Contoh kolom “Ya” dan “Belum berkembang”:</p>
<ul><li><b>Intelektual:</b> keterbukaan, kreativitas, ketekunan dan keteguhan hati, rasa ingin tahu.</li><li><b>Sosial:</b> kemampuan kerja sama, kemandirian (termasuk percaya diri dan kontrol diri), kepedulian terhadap orang lain, kepedulian lingkungan, penghargaan diri, kesadaran diri.</li></ul>
<h3>7. Penilaian berskala</h3>
<p>Terdiri dari beberapa aspek sifat yang dinilai. Kategori (data nominal) diubah menjadi <b>data interval skala 1–5</b>. Guru mengisi satu nilai (misalnya 4) untuk tiap aspek berdasarkan pengamatan dan pertimbangannya. Perlu keterlatihan dan pengalaman agar mendekati skor sebenarnya. Meski bersifat <b>subjektif</b>, datanya tetap penting dan bermanfaat.</p>
<div class="tw"><table><tr><th>Skala penilaian perencanaan (7 aspek)</th><th>Skala penilaian pelaksanaan (5 aspek)</th></tr><tr><td>1. Penetapan tujuan (dampak pengiring, dampak instruksional)<br>2. Pemilihan tema (kesesuaian minat, kesesuaian kemampuan, unsur pengembangan kreativitas, keterkaitan antarbidang studi)<br>3. Pengorganisasian siswa (kesempatan menyelidiki, fleksibilitas kelompok, belajar dari interaksi, bekerja sama)<br>4. Kegiatan (hubungan dengan wilayah kurikulum, penemuan, menantang, mengembangkan proses efektif)<br>5. Ragam sumber<br>6. Penilaian (proses, produk)<br>7. Pengalokasian waktu</td><td>1. Ketaatan kepada perencanaan (pemberian informasi, penggunaan sumber, penggunaan waktu)<br>2. Pengelolaan kelas (antusiasme, memotivasi kerja kelompok, memotivasi individu)<br>3. Keberanian (simultan, bertindak, berkomunikasi)<br>4. Penilaian proses (observasi, interview)<br>5. Produktivitas (perhatian siswa, partisipasi siswa, pencapaian siswa, keinginan menyelesaikan tugas)</td></tr></table></div>
<p><i>Catatan modul: skala perencanaan merupakan penilaian dimensi hasil perencanaan pembelajaran terpadu di D-II PGSD (lihat matriks cakupan penilaian). Deskripsi tiap aspek perlu dirumuskan terkait skalanya.</i></p>
<div class="ing"><b>💡 Ingat format:</b> <b>O-D-P-R-C-O-D-S</b> = Observasi, Diri (evaluasi), Portofolio, Rubrik, Cuplikan kerja, Orang tua, Daftar cek, Skala. Checklist ya-tidak untuk <b>observasi</b>. Jurnal siswa = <b>evaluasi diri</b>.</div>
<h3>Arah jawaban latihan</h3>
<p>Buat beragam format penilaian nontes untuk pembelajaran terpadu Bahasa Indonesia dan IPA: tetapkan dulu KD tiap mapel, lalu bentuk nontes yang sesuai. Ingat kembali jenis nontes dan kegunaannya, Kurikulum 2004 (BI dan IPA), dan penyusunan silabus.</p>
<h2>Sering keluar di ujian (KB 2)</h2>
<div class="tw"><table><tr><th>Jebakan</th><th>Yang benar</th></tr>
<tr><td>Urutan tahap: laporan dulu / tindak lanjut dulu</td><td>Perencanaan → Pelaksanaan → Laporan → Tindak lanjut</td></tr>
